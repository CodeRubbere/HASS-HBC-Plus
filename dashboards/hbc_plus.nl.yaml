          - type: tile
            entity: sensor.hbc_apps
            name: Vereiste app werkt niet
            icon: mdi:application-cog-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            icon_tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            card_mod:
              style:
                .: |
                  ha-card {
                    background: rgba(var(--rgb-warning-color, 255, 166, 0), 0.15) !important;
                    border: none !important;
                    --tile-color: var(--warning-color) !important;
                    --tile-info-primary-font-weight: 700 !important;
                    --tile-info-primary-font-size: 16px !important;
                    --tile-icon-opacity: 0 !important;
                  }
                ha-tile-icon$: |
                  .container::before { opacity: 0 !important; }
                  .container { background: none !important; }
            visibility:
              - condition: numeric_state
                entity: sensor.hbc_apps
                above: 0
          - type: markdown
            text_only: true
            content: |-
              {%- set dash = '1.3.0' -%}
              {%- set rel = states('sensor.hbc_package_version') -%}
              {%- set mm = rel.split('.')[:2] | join('.') -%}
              {%- set fl = state_attr('sensor.hbc_health', 'flows_version') or '—' -%}
              {%- set tabs = state_attr('sensor.hbc_health', 'flow_versions') or {} -%}
              {%- set files = dict(state_attr('sensor.hbc_package_version', 'files') or {},
                                   **(state_attr('sensor.hbc_health', 'package_versions') or {})) -%}
              {%- set market = state_attr('sensor.hbc_marketplace', 'items') or [] -%}
              {%- macro row(n, v) -%}{%- if v and (v | string).split('.')[:2] | join('.') == mm -%}{{ n }} · {{ v }}{%- else -%}<font color=red>{{ n }} · {{ v or 'ontbreekt' }}</font>{%- endif -%}{%- endmacro -%}
              <font color=grey>Elk onderdeel van HBC+ en zijn versie. Een minor release (1.3 → 1.4) vervangt elk onderdeel; een patch release (1.3.0 → 1.3.1) alleen de onderdelen die veranderd zijn, dus patchnummers kunnen verschillen. Een regel in rood hoort bij een andere release of ontbreekt: zie de stappen voor bijwerken in de gebruikershandleiding. Een Marketplace-onderdeel of app in oranje heeft een nieuwere versie.</font>

              **HBC+ release {{ rel }}**

              - {{ row('**Dashboard**', dash) }}
              - {{ row('**Node-RED-flows**', fl) }}
              {%- for k, v in tabs | dictsort %}
                - {{ row(k | replace('HBC+ ', ''), v) }}
              {%- endfor %}
              {%- if not tabs %}
                - <font color=grey>nog geen lijst met tabbladen (komt van *HBC+ health* in Node-RED)</font>
              {%- endif %}
              - **Packagebestanden**
              {%- for k, v in files | dictsort %}
                - {{ row(k ~ '.yaml', v) }}
              {%- endfor %}
              - **Marketplace**
              {%- for i in market %}
                - {% if i.status == 'not found' %}<font color=red>{{ i.name }} · niet gevonden</font>{% elif i.status == 'update' %}{{ i.name }} · {{ i.installed }} → <font color=orange>{{ i.latest }}</font>{% else %}{{ i.name }} · {{ i.installed or '—' }}{% endif %}
              {%- endfor %}
              {%- if not market %}
                - <font color=grey>nog geen lijst (komt van `sensor.hbc_marketplace` in `hbc_control.yaml`)</font>
              {%- endif %}
              {%- set apps = state_attr('sensor.hbc_apps', 'items') or [] %}
              - **Apps**
              {%- for i in apps %}
                - {% if i.status in ['not set up', 'not connected', 'not running'] %}<font color=red>{{ i.name }} · {{ {'not set up': 'niet ingesteld', 'not connected': 'niet verbonden', 'not running': 'draait niet'}.get(i.status, i.status) }}{{ (' (geen melding sinds ' ~ i.minutes ~ ' min)') if i.status == 'not running' and i.minutes is not none else '' }}</font>{% elif i.status in ['not an app', 'standalone', 'unknown'] %}{{ i.name }} · <font color=grey>{{ {'not an app': 'hier geen app (externe broker)', 'standalone': 'draait (standalone)', 'unknown': 'onbekend (MQTT nodig)'}[i.status] }}</font>{% elif i.status == 'update' %}{{ i.name }} · {{ i.installed }} → <font color=orange>{{ i.latest }}</font>{{ ' · draait' if i.name == 'Node-RED' else '' }}{% elif i.type == 'Integration' %}{{ i.name }} · verbonden{{ (' · ingebouwd in HA ' ~ i.installed) if i.installed else '' }}{% else %}{{ i.name }} · {{ i.installed }}{{ ' · draait' if i.name == 'Node-RED' else '' }}{% endif %}
              {%- endfor %}
              {%- if not apps %}
                - <font color=grey>nog geen lijst (komt van `sensor.hbc_apps` in `hbc_control.yaml`)</font>
              {%- endif %}
              {%- if market | selectattr('status', 'eq', 'not found') | list %}

              <small>*Niet gevonden* (Marketplace): niet via de Marketplace gedownload, of de update-entiteit staat uit, dus HBC+ kan het niet controleren. Download het via de Marketplace, of zet de update-entiteit aan.</small>
              {%- endif %}
              {%- set items = state_attr('sensor.hbc_health', 'version_items') or [] -%}
              {%- set exp = state_attr('sensor.hbc_health', 'version_expected') or mm -%}
              {%- for part, title in [('flow', 'Node-RED flow'), ('package', 'Package file'), ('config', 'hbc_config.yaml setting')] -%}
              {%- set rows = items | selectattr('part', 'eq', part) | list -%}
              {%- if rows %}

              <ha-alert alert-type="warning">{% for r in rows -%}
              {{ r.name }} {{ ('v' ~ r.version) if r.version else ('ontbreekt' if part == 'config' else 'ontbreekt (of ouder dan deze controle)') }}<br>
              {%- endfor %}<small>Verwacht: v{{ exp }}.x</small></ha-alert>
              {%- endif -%}
              {%- endfor -%}
              {%- if dash.split('.')[:2] | join('.') != exp and rel is match('^\d+\.\d+') %}

