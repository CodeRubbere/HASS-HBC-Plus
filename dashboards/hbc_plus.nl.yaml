              - from: 0
                color: '#ef9a9a'
              - from: 95
                color: '#ffa600'
              - from: 100
                color: '#db4437'
            grid_options:
              columns: 6
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            content: |-
              {%- set ph = 'L1' -%}
              {%- set e = 'sensor.hbc_phase_' ~ (ph | lower) ~ '_active' -%}
              {%- set act = states(e) | string -%}
              {%- set mode = state_attr(e, 'mode') or 'idle' -%}
              {%- set hp = state_attr(e, 'hbc_power') | int(0) -%}
              {%- set cr = state_attr(e, 'charge_room') -%}
              {%- set dr = state_attr(e, 'discharge_room') -%}
              {%- set would = (state_attr(e, 'would') or 'ok') | string -%}
              {%- set reason = (state_attr(e, 'reason') or '') | string -%}
              {%- set room = 'Ruimte: ' ~ (cr | int(0)) ~ ' W laden · ' ~ (dr | int(0)) ~ ' W ontladen' if cr is number and dr is number else '' -%}
              {%- if act in ['unknown', 'unavailable', ''] -%}
              <ha-alert alert-type="info" title="{{ ph }} · geen gegevens">De fasemonitor in Node-RED heeft nog niets gemeld.</ha-alert>
              {%- elif act == 'off' -%}
              <ha-alert alert-type="info" title="{{ ph }} · fasebewaking uit">Geen faseregels; de batterijen volgen de strategie.</ha-alert>
              {%- elif reason.startswith('no battery on') -%}
              <ha-alert alert-type="info" title="{{ ph }} · geen batterij op deze fase">{{ room }}</ha-alert>
              {%- elif mode == 'idle' or act == 'none' -%}
              <ha-alert alert-type="info" title="{{ ph }} · inactief{{ ' — geen batterij nodig' if mode == 'idle' else ' — ' ~ reason }}">{{ room }}</ha-alert>
              {%- else -%}
              <ha-alert alert-type="success" title="{{ ph }} · {{ 'laadt' if mode == 'charge' else 'ontlaadt' }} {{ hp | abs }} W · actief {{ act | replace('+', ' + ') }}">{{ room }}</ha-alert>
              {%- endif %}
              {%- if would not in ['ok', 'guard off'] %}
              <ha-alert alert-type="warning" title="HBC+ zou {{ 'ingrijpen' if state_attr(e, 'guard_mode') == 'Monitor' else 'corrigeren' }}">{{ would }}</ha-alert>
              {%- endif %}
              {%- set n = [states('input_number.house_battery_count') | int(0), 6] | min -%}
              {%- set actl = act.split('+') -%}
              {%- set sb = (state_attr(e, 'standby') or '') | string -%}
              {%- set ns = namespace(rows=[]) -%}
              {%- for b in range(1, n + 1) if states('input_select.marstek_m' ~ b ~ '_phase') == ph -%}
                {%- set id = 'M' ~ b -%}
                {%- set p = states('sensor.marstek_m' ~ b ~ '_battery_power') | int(0) -%}
                {%- set role = ('laadt' if p > 5 else ('ontlaadt' if p < -5 else 'actief')) if id in actl
                               else ('laadt' if p > 5 else ('ontlaadt' if p < -5 else ('wacht' if id in sb else '—'))) -%}
                {%- set ns.rows = ns.rows + ['**' ~ id ~ '** · ' ~ states('sensor.marstek_m' ~ b ~ '_battery_state_of_charge') ~ ' % · ' ~ p ~ ' W · ' ~ role] -%}
              {%- endfor %}

              {{ ns.rows | join('<br>') if ns.rows else '<font color=grey>Geen batterij op ' ~ ph ~ ' in de fasekaart.</font>' }}
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: tile
            entity: input_boolean.hbc_show_phase_details
            name: Toon details
            icon: mdi:chevron-down
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            visibility:
              - condition: state
