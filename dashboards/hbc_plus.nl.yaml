              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md#zelftest-bij-installatie
          - type: markdown
            text_only: true
            content: <font color=grey>Controleert de installatie en meet de fase van elke batterij. Je fasekaart past hij nooit zelf aan.</font>
          - type: tile
            entity: script.hbc_selftest_run
            name: Volledige test starten
            icon: mdi:play-circle-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: true
              confirmation:
