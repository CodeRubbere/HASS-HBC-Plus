            heading_style: subtitle
            icon: mdi:pen
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/home-battery-control-plus
          - type: markdown
            content: '### Stap 5'
            text_only: true
          - type: markdown
            content: <ha-alert title="(Optioneel) vermogensgrenzen nakijken"><br> Gebruik grenzen en peak shaving om <font color=darkblue>pieken en het risico op overbelasting</font> te verlagen.</ha-alert>
            visibility:
              - condition: and
