          - type: markdown
            content: <font color=grey>HBC+ leert hoeveel het huis per kwartier verbruikt, op werkdagen en weekenddagen. Met de schakelaar aan houdt Dynamic maar zoveel goedkope kwartieren als nodig om het verwachte verbruik van de dure kwartieren te laden (plus de marge, min wat al opgeslagen is), de goedkoopste eerst. Vereist minstens 7 werkdagen en 4 weekenddagen leren, de goedkope strategie Charge en een andere dure strategie dan Sell.</font>
            text_only: true
          - type: custom:apexcharts-card
            header:
              show: true
              title: Verwacht verbruik, komende 24 uur
            graph_span: 24h
            span:
              start: minute
            now:
              show: true
              label: Nu
            apex_config:
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
              yaxis:
                decimalsInFloat: 0
                title:
                  text: W
            series:
              - entity: sensor.hbc_load_forecast
                name: Voorspelling
                type: area
                curve: stepline
                data_generator: >
                  const f = entity.attributes.forecast || []; const t0 = new
                  Date(entity.attributes.start).getTime(); return f.map((w, k)
                  => [t0 + k * 900000, w]);
          - type: markdown
            content: '{%- set lf = state_attr(''sensor.hbc_energy_prices_data'', ''load_forecast'') or {} -%} {%- if is_state(''input_boolean.house_battery_dynamic_use_load_forecast'', ''on'') -%} {%- if lf.used -%} ✅ Dynamic houdt **{{ lf.low_kept }}** goedkope kwartieren en slaat er {{ lf.low_dropped }} over: de dure kwartieren hebben {{ lf.need_kwh }} kWh nodig, {{ lf.stored_kwh }} kWh is opgeslagen, één goedkoop kwartier laadt {{ lf.per_low_kwh }} kWh. {%- elif lf.reason -%} ⏳ Nu niet gebruikt: {{ lf.reason }}. Dynamic laadt zoals zonder voorspelling. {%- else -%} ⏳ Wacht op de volgende Dynamic-run (elk kwartier). {%- endif -%} {%- endif %}'
            text_only: true
          - type: entities
            entities:
              - entity: input_boolean.house_battery_dynamic_use_load_forecast
