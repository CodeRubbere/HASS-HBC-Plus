          - type: tile
            entity: sensor.hbc_marketplace
            name: Marketplace-onderdeel niet gevonden
            icon: mdi:store-alert-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            icon_tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            card_mod:
              style:
                .: |
                  ha-card {
                    background: rgba(var(--rgb-warning-color, 255, 166, 0), 0.15) !important;
                    border: none !important;
                    --tile-color: var(--warning-color) !important;
                    --tile-info-primary-font-weight: 700 !important;
                    --tile-info-primary-font-size: 16px !important;
