            content: |-
              <ha-alert title="Netvermogenssensor instellen"><br>HBC+ heeft sensor.p1_meter_power en sensor.p1_meter_power_phase_1 … _3 nodig (W, afname positief).</ha-alert>
              1. Bewerk het bestand `packages/hbc_config.yaml`
              1. Haal optie A of B uit commentaar: elke regel tussen BEGIN en END
              1. Vervang elke sensor gemarkeerd met `<< YOUR`, controleer de configuratie en herlaad de Template-entiteiten
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.p1_meter_power
                    state: unavailable
                  - condition: state
                    entity: sensor.p1_meter_power
                    state: unknown
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            content: <ha-alert title="Netvermogenssensor" alert-type="success"><br>Ingesteld</ha-alert>
            visibility:
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: heading
            icon: mdi:pen
            heading: Open File editor
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /core_configurator
          - type: markdown
            content: '### Stap 3'
            text_only: true
          - type: markdown
            content: <ha-alert title="Node-RED instellen"><br> Importeer en deploy de <font color=red>Node-RED</font>-scripts.</ha-alert>
