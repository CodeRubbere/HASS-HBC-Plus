# HBC+ dashboard, Nederlandse versie van dashboards/hbc_plus.yaml (zelfde views, entiteiten en URL's).
# Plak de inhoud in de raw-configuratie-editor van het dashboard Home Battery Control Plus
# (URL home-battery-control-plus). Houd dit bestand gelijk met hbc_plus.yaml bij elke wijziging.
views:
  - type: sections
    title: Home Battery Control Plus
    path: home-battery-control-plus
    icon: mdi:home-analytics
    badges:
      - type: entity
        entity: sensor.hbc_health
        show_name: true
        show_state: true
        show_icon: true
        card_mod:
          style:
            .: |
              ha-badge {
                --ha-card-border-color: {{ 'var(--success-color)' if is_state('sensor.hbc_health', 'ok') else 'var(--error-color)' }};
                --ha-card-border-width: 2px;
              }
            ha-badge$: |
              .badge {
                border: 2px solid {{ 'var(--success-color)' if is_state('sensor.hbc_health', 'ok') else 'var(--error-color)' }} !important;
              }
      - type: entity
        entity: sensor.hbc_steered_by
        name: Controller
        icon: mdi:steering
        show_name: true
        show_state: true
        show_icon: true
        color: grey
        tap_action:
          action: none
        visibility:
          - condition: state
            entity: sensor.hbc_steered_by
            state: HBC+
        card_mod:
          style:
            .: |
              ha-badge {
                --ha-card-background: rgba(var(--rgb-primary-color), 0.15);
                --ha-card-border-color: var(--primary-color);
                --ha-card-border-width: 2px;
              }
            ha-badge$: |
              .badge {
                background: rgba(var(--rgb-primary-color), 0.15) !important;
                border: 2px solid var(--primary-color) !important;
              }
      - type: entity
        entity: sensor.hbc_steered_by
        name: Controller
        icon: mdi:steering-off
        show_name: true
        show_state: true
        show_icon: true
        color: grey
        tap_action:
          action: none
        visibility:
          - condition: state
            entity: sensor.hbc_steered_by
            state: Marstek
        card_mod:
          style:
            .: |
              ha-badge {
                --ha-card-background: rgba(var(--rgb-primary-color), 0.15);
                --ha-card-border-color: var(--primary-color);
                --ha-card-border-width: 2px;
              }
            ha-badge$: |
              .badge {
                background: rgba(var(--rgb-primary-color), 0.15) !important;
                border: 2px solid var(--primary-color) !important;
              }
      - type: entity
        entity: sensor.hbc_steered_by
        name: Controller
        icon: mdi:battery-sync
        show_name: true
        show_state: true
        show_icon: true
        color: amber
        tap_action:
          action: navigate
          navigation_path: /batterijplan
        visibility:
          - condition: state
            entity: sensor.hbc_steered_by
            state: Batterijplan
        card_mod:
          style:
            .: |
              ha-badge {
                --ha-card-background: rgba(var(--rgb-primary-color), 0.15);
                --ha-card-border-color: var(--primary-color);
                --ha-card-border-width: 2px;
              }
            ha-badge$: |
              .badge {
                background: rgba(var(--rgb-primary-color), 0.15) !important;
                border: 2px solid var(--primary-color) !important;
              }
      - type: entity
        entity: sensor.hbc_steered_by
        name: Controller
        icon: mdi:robot-outline
        show_name: true
        show_state: true
        show_icon: true
        color: amber
        tap_action:
          action: navigate
          navigation_path: /helios-optimizer/helios-controls
        visibility:
          - condition: state
            entity: sensor.hbc_steered_by
            state: HELIOS
        card_mod:
          style:
            .: |
              ha-badge {
                --ha-card-background: rgba(var(--rgb-primary-color), 0.15);
                --ha-card-border-color: var(--primary-color);
                --ha-card-border-width: 2px;
              }
            ha-badge$: |
              .badge {
                background: rgba(var(--rgb-primary-color), 0.15) !important;
                border: 2px solid var(--primary-color) !important;
              }
      - type: entity
        entity: sensor.hbc_steered_by
        name: Controller
        icon: mdi:robot-off-outline
        show_name: true
        show_state: true
        show_icon: true
        color: red
        tap_action:
          action: navigate
          navigation_path: /helios-optimizer/helios-controls
        visibility:
          - condition: state
            entity: sensor.hbc_steered_by
            state: HELIOS offline
        card_mod:
          style:
            .: |
              ha-badge {
                --ha-card-background: rgba(var(--rgb-primary-color), 0.15);
                --ha-card-border-color: var(--primary-color);
                --ha-card-border-width: 2px;
              }
            ha-badge$: |
              .badge {
                background: rgba(var(--rgb-primary-color), 0.15) !important;
                border: 2px solid var(--primary-color) !important;
              }
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_select.hbc_control_mode
        name: Control mode
        tap_action:
          action: more-info
        card_mod:
          style:
            .: |
              ha-badge {
                --ha-card-background: rgba(var(--rgb-primary-color), 0.15);
                --ha-card-border-color: var(--primary-color);
                --ha-card-border-width: 2px;
              }
            ha-badge$: |
              .badge {
                background: rgba(var(--rgb-primary-color), 0.15) !important;
                border: 2px solid var(--primary-color) !important;
              }
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_control_state
        show_entity_picture: false
        name: Strategie
        card_mod:
          style:
            .: |
              ha-badge {
                --ha-card-background: rgba(var(--rgb-primary-color), 0.15);
                --ha-card-border-color: var(--primary-color);
                --ha-card-border-width: 2px;
              }
            ha-badge$: |
              .badge {
                background: rgba(var(--rgb-primary-color), 0.15) !important;
                border: 2px solid var(--primary-color) !important;
              }
      - type: entity
        entity: input_boolean.hbc_show_batteries
        name: Toon batterijen
        icon: mdi:home-battery
        show_name: true
        show_state: false
        show_icon: true
        tap_action:
          action: toggle
        visibility:
          - condition: state
            entity: input_boolean.hbc_show_batteries
            state: 'off'
          - condition: state
            entity: input_boolean.hbc_dashboard_mode
            state: 'off'
      - type: entity
        entity: input_boolean.hbc_show_batteries
        name: Verberg batterijen
        icon: mdi:home-battery
        show_name: true
        show_state: false
        show_icon: true
        color: amber
        tap_action:
          action: toggle
        visibility:
          - condition: state
            entity: input_boolean.hbc_show_batteries
            state: 'on'
          - condition: state
            entity: input_boolean.hbc_dashboard_mode
            state: 'off'
      - type: entity
        entity: input_boolean.house_battery_control_show_price_list
        name: Toon prijzen
        icon: mdi:format-list-bulleted
        show_name: true
        show_state: false
        show_icon: true
        tap_action:
          action: toggle
        visibility:
          - condition: state
            entity: input_boolean.house_battery_control_show_price_list
            state: 'off'
          - condition: state
            entity: input_boolean.hbc_dashboard_mode
            state: 'off'
      - type: entity
        entity: input_boolean.house_battery_control_show_price_list
        name: Verberg prijzen
        icon: mdi:format-list-bulleted
        show_name: true
        show_state: false
        show_icon: true
        color: amber
        tap_action:
          action: toggle
        visibility:
          - condition: state
            entity: input_boolean.house_battery_control_show_price_list
            state: 'on'
          - condition: state
            entity: input_boolean.hbc_dashboard_mode
            state: 'off'
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: input_boolean.hbc_show_strategy
        name: Toon strategieën
        icon: mdi:strategy
        tap_action:
          action: toggle
        visibility:
          - condition: state
            entity: input_boolean.hbc_show_strategy
            state: 'off'
          - condition: state
            entity: input_boolean.hbc_dashboard_mode
            state: 'off'
          - condition: state
            entity: sensor.hbc_steered_by
            state_not:
              - HELIOS
              - HELIOS offline
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: input_boolean.hbc_show_strategy
        name: Verberg strategieën
        icon: mdi:strategy
        color: amber
        tap_action:
          action: toggle
        visibility:
          - condition: state
            entity: input_boolean.hbc_show_strategy
            state: 'on'
          - condition: state
            entity: input_boolean.hbc_dashboard_mode
            state: 'off'
          - condition: state
            entity: sensor.hbc_steered_by
            state_not:
              - HELIOS
              - HELIOS offline
      - type: entity
        entity: input_boolean.hbc_dashboard_mode
        name: Dashboard mode
        icon: mdi:view-dashboard-outline
        show_name: true
        show_state: false
        show_icon: true
        color: amber
        tap_action:
          action: toggle
      - type: entity
        entity: sensor.hbc_time
        name: Tijd
        icon: mdi:clock-outline
        show_name: false
        show_state: true
        show_icon: true
        tap_action:
          action: none
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Status & bediening (v1.3.0)
            heading_style: title
            icon: mdi:gamepad-variant-outline
          - type: tile
            entity: sensor.hbc_health
            name: HBC+ heeft een probleem gelogd
            icon: mdi:alert-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            icon_tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            card_mod:
              style:
                .: |
                  ha-card {
                    background: rgba({{ 'var(--rgb-error-color, 219, 68, 55)' if is_state('sensor.hbc_health','error') else 'var(--rgb-warning-color, 255, 166, 0)' }}, 0.15) !important;
                    border: none !important;
                    --tile-color: {{ 'var(--error-color)' if is_state('sensor.hbc_health','error') else 'var(--warning-color)' }} !important;
                    --tile-info-primary-font-weight: 700 !important;
                    --tile-info-primary-font-size: 16px !important;
                    --tile-icon-opacity: 0 !important;
                  }
                ha-tile-icon$: |
                  .container::before { opacity: 0 !important; }
                  .container { background: none !important; }
            visibility:
              - condition: state
                entity: sensor.hbc_health
                state:
                  - warning
                  - error
          - type: markdown
            text_only: true
            content: |-
              {%- set h = 'sensor.hbc_health' -%} {%- set e = state_attr(h, 'errors_10m') | int(0) -%} {%- set w = state_attr(h, 'warnings_10m') | int(0) -%} {%- set last = state_attr(h, 'last_error') if e > 0 else state_attr(h, 'last_warning') -%} {%- set ea = (state_attr(h, 'last_error_at') or '') | as_datetime(None) -%} {%- set wa = (state_attr(h, 'last_warning_at') or '') | as_datetime(None) -%} {%- set at = ea if e > 0 else wa -%} {%- set newest = ([ea, wa] | select | max) if (ea or wa) else None -%} {%- set quiet = newest is not none and (now() - newest).total_seconds() > 90 -%} {%- set hint = state_attr(h, 'hint') or '' -%} {%- set what = 'errors' if e > 0 else 'warnings' -%}
              {%- if quiet -%} <ha-alert alert-type="info">Deze melding verdwijnt vanzelf rond {{ ((newest + timedelta(minutes=10)) | as_local).strftime('%H:%M') }}.<br> In de laatste 10 minuten: {{ e }} fout{{ 'en' if e != 1 }} en {{ w }} waarschuwing{{ 'en' if w != 1 }}.<br><br><b>Laatste:</b><br><i>{{ last | e }}</i>{% if hint %}<br><br><b>Oplossing:</b><br>{{ hint | e }}{% endif %}</ha-alert>
              {%- else -%} <ha-alert alert-type="{{ 'error' if is_state(h, 'error') else 'warning' }}">{{ e }} fout{{ 'en' if e != 1 }} en {{ w }} waarschuwing{{ 'en' if w != 1 }} in de laatste 10 minuten.<br><br><b>Laatste{{ ' (' ~ relative_time(at) ~ ' geleden)' if at else '' }}:</b><br><i>{{ last | e }}</i>{% if hint %}<br><br><b>Oplossing:</b><br>{{ hint | e }}{% endif %}<br><small>Oorzaak opgelost? Deze melding verdwijnt vanzelf na 10 minuten zonder nieuwe fouten of waarschuwingen.</small></ha-alert>
              {%- endif %}

              [Open Logging](/home-battery-control-plus/problem-solver)
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_alert_info
                state: 'on'
              - condition: state
                entity: sensor.hbc_health
                state:
                  - warning
                  - error
          - type: heading
            heading: Controller
            heading_style: subtitle
            icon: mdi:information-outline
          - type: horizontal-stack
            grid_options:
              columns: 12
              rows: auto
            cards:
              - type: tile
                entity: input_select.marstek_master_battery_mode
                name: HBC+
                icon: mdi:battery-heart
                hide_state: true
                vertical: false
                tap_action:
                  action: perform-action
                  perform_action: script.hbc_dashboard_select
                  data:
                    entity_id: input_select.marstek_master_battery_mode
                    option: Full control
                icon_tap_action:
                  action: perform-action
                  perform_action: script.hbc_dashboard_select
                  data:
                    entity_id: input_select.marstek_master_battery_mode
                    option: Full control
                features_position: bottom
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('input_select.marstek_master_battery_mode', 'Full control') %}
                      background: rgba(var(--rgb-primary-color), 0.15) !important;
                      border: 2px solid var(--primary-color) !important;
                      --tile-color: var(--amber-color) !important;
                      {% else %}
                      border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                      {% endif %}
                    }
              - type: tile
                entity: input_select.marstek_master_battery_mode
                name: Marstek
                icon: mdi:battery-sync
                hide_state: true
                vertical: false
                tap_action:
                  action: perform-action
                  perform_action: script.hbc_dashboard_select
                  data:
                    entity_id: input_select.marstek_master_battery_mode
                    option: Marstek control
                  confirmation:
                    text: De batterijen teruggeven aan de Marstek-firmware (Marstek control)? HBC+ stopt met aansturen.
                icon_tap_action:
                  action: perform-action
                  perform_action: script.hbc_dashboard_select
                  data:
                    entity_id: input_select.marstek_master_battery_mode
                    option: Marstek control
                  confirmation:
                    text: De batterijen teruggeven aan de Marstek-firmware (Marstek control)? HBC+ stopt met aansturen.
                features_position: bottom
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('input_select.marstek_master_battery_mode', 'Marstek control') %}
                      background: rgba(var(--rgb-primary-color), 0.15) !important;
                      border: 2px solid var(--primary-color) !important;
                      --tile-color: var(--amber-color) !important;
                      {% else %}
                      border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                      {% endif %}
                    }
              - type: tile
                entity: input_select.marstek_master_battery_mode
                name: Marstek M.
                icon: mdi:battery-clock-outline
                hide_state: true
                vertical: false
                tap_action:
                  action: perform-action
                  perform_action: script.hbc_dashboard_select
                  data:
                    entity_id: input_select.marstek_master_battery_mode
                    option: Manual control
                  confirmation:
                    text: De batterijen teruggeven aan de Marstek-firmware (Manual control)? HBC+ stopt met aansturen.
                icon_tap_action:
                  action: perform-action
                  perform_action: script.hbc_dashboard_select
                  data:
                    entity_id: input_select.marstek_master_battery_mode
                    option: Manual control
                  confirmation:
                    text: De batterijen teruggeven aan de Marstek-firmware (Manual control)? HBC+ stopt met aansturen.
                features_position: bottom
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('input_select.marstek_master_battery_mode', 'Manual control') %}
                      background: rgba(var(--rgb-primary-color), 0.15) !important;
                      border: 2px solid var(--primary-color) !important;
                      --tile-color: var(--amber-color) !important;
                      {% else %}
                      border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                      {% endif %}
                    }
          - type: heading
            heading: Control mode
            heading_style: subtitle
            icon: mdi:information-outline
          - type: tile
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            entity: input_select.hbc_control_mode
            name: Manual
            icon: mdi:hand-pointing-right
            hide_state: true
            vertical: true
            grid_options:
              columns: 3
              rows: auto
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_dashboard_select
              data:
                entity_id: input_select.hbc_control_mode
                option: Manual
            tap_action:
              action: perform-action
              perform_action: script.hbc_dashboard_select
              data:
                entity_id: input_select.hbc_control_mode
                option: Manual
            card_mod:
              style:
                .: |
                  ha-card {
                    {% if is_state('input_select.hbc_control_mode', 'Manual') %}
                    background: rgba(var(--rgb-primary-color), 0.15) !important;
                    border: 2px solid var(--primary-color) !important;
                    --tile-color: var(--amber-color) !important;
                    --tile-icon-color: var(--amber-color) !important;
                    {% else %}
                    border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                    {% endif %}
                  }
                ha-tile-icon$: >
                  {% if is_state('input_select.hbc_control_mode', 'Manual') %}

                  .container { color: var(--amber-color) !important; }

                  .container::before { background-color: var(--amber-color)
                  !important; opacity: 0.2 !important; }

                  {% endif %}
          - type: tile
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            entity: input_select.hbc_control_mode
            name: Schedule
            icon: mdi:calendar-clock
            hide_state: true
            vertical: true
            grid_options:
              columns: 3
              rows: auto
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_dashboard_select
              data:
                entity_id: input_select.hbc_control_mode
                option: Schedule
            tap_action:
              action: perform-action
              perform_action: script.hbc_dashboard_select
              data:
                entity_id: input_select.hbc_control_mode
                option: Schedule
            card_mod:
              style:
                .: |
                  ha-card {
                    {% if is_state('input_select.hbc_control_mode', 'Schedule') %}
                    background: rgba(var(--rgb-primary-color), 0.15) !important;
                    border: 2px solid var(--primary-color) !important;
                    --tile-color: var(--amber-color) !important;
                    --tile-icon-color: var(--amber-color) !important;
                    {% else %}
                    border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                    {% endif %}
                  }
                ha-tile-icon$: >
                  {% if is_state('input_select.hbc_control_mode', 'Schedule') %}

                  .container { color: var(--amber-color) !important; }

                  .container::before { background-color: var(--amber-color)
                  !important; opacity: 0.2 !important; }

                  {% endif %}
          - type: tile
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            entity: input_select.hbc_control_mode
            name: Price
            icon: mdi:currency-eur
            hide_state: true
            vertical: true
            grid_options:
              columns: 3
              rows: auto
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_dashboard_select
              data:
                entity_id: input_select.hbc_control_mode
                option: Price
            tap_action:
              action: perform-action
              perform_action: script.hbc_dashboard_select
              data:
                entity_id: input_select.hbc_control_mode
                option: Price
            card_mod:
              style:
                .: |
                  ha-card {
                    {% if is_state('input_select.hbc_control_mode', 'Price') %}
                    background: rgba(var(--rgb-primary-color), 0.15) !important;
                    border: 2px solid var(--primary-color) !important;
                    --tile-color: var(--amber-color) !important;
                    --tile-icon-color: var(--amber-color) !important;
                    {% else %}
                    border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                    {% endif %}
                  }
                ha-tile-icon$: >
                  {% if is_state('input_select.hbc_control_mode', 'Price') %}

                  .container { color: var(--amber-color) !important; }

                  .container::before { background-color: var(--amber-color)
                  !important; opacity: 0.2 !important; }

                  {% endif %}
          - type: tile
            grid_options:
              columns: 3
              rows: auto
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            entity: input_select.hbc_control_mode
            name: HELIOS
            icon: mdi:robot-outline
            hide_state: true
            vertical: true
            tap_action:
              action: perform-action
              perform_action: script.hbc_dashboard_select
              data:
                entity_id: input_select.hbc_control_mode
                option: External
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_dashboard_select
              data:
                entity_id: input_select.hbc_control_mode
                option: External
            features_position: bottom
            card_mod:
              style:
                .: |
                  ha-card {
                    {% if is_state('input_select.hbc_control_mode', 'External') %}
                    background: rgba(var(--rgb-primary-color), 0.15) !important;
                    border: 2px solid var(--primary-color) !important;
                    --tile-color: var(--amber-color) !important;
                    --tile-icon-color: var(--amber-color) !important;
                    {% else %}
                    border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                    {% endif %}
                  }
                ha-tile-icon$: >
                  {% if is_state('input_select.hbc_control_mode', 'External') %}

                  .container { color: var(--amber-color) !important; }

                  .container::before { background-color: var(--amber-color)
                  !important; opacity: 0.2 !important; }

                  {% endif %}
          - type: tile
            entity: update.cheapest_energy_hours_update
            name: Integratie Cheapest Hours niet geïnstalleerd
            icon: mdi:information-outline
            color: blue
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_steering_info
            icon_tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_steering_info
            card_mod:
              style:
