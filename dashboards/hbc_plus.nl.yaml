          - type: markdown
            content: <font color=grey>Wat je energie kostte met de batterijen, vergeleken met wat die zonder had gekost, kwartier voor kwartier tegen de inkoop- en terugleverprijs van dat kwartier. Vaste kosten tellen niet mee. Vandaag met batterijen €{{ states('sensor.hbc_cost_with_battery_today') | float(0) | round(2) }}, zonder €{{ states('sensor.hbc_cost_without_battery_today') | float(0) | round(2) }}. {%- set m = state_attr('sensor.hbc_savings_total', 'quarters_missing') | int(0) -%} {%- if m > 0 %} {{ m }} kwartieren konden niet gewaardeerd worden (HA uit of geen prijs).{% endif %}</font>
            text_only: true
          - type: heading
            heading: Rondgangsrendement
            heading_style: title
            icon: mdi:battery-sync
            grid_options:
              rows: 1
          - type: entities
            entities:
              - entity: sensor.hbc_round_trip_efficiency
                name: Gemeten over 7 dagen
              - entity: sensor.hbc_suggested_minimum_spread
                name: Voorgestelde Minimum spread
              - entity: input_number.house_battery_strategy_dynamic_threshold_delta
                name: Huidige Minimum spread (in te stellen bij Timed & Dynamic)
                type: simple-entity
              - entity: input_number.house_battery_wear_cost
                name: Slijtagekosten
              - entity: input_boolean.house_battery_dynamic_use_efficiency
                name: Dynamic gebruikt gemeten rendement
              - type: button
                name: Voorstel overnemen
                icon: mdi:cash-check
                action_name: Apply
                tap_action:
                  action: perform-action
                  perform_action: script.hbc_apply_suggested_spread
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            content: |-
              {%- set e = 'sensor.hbc_round_trip_efficiency' -%} {%- set w = state_attr(e, 'warning') -%} {%- set n = state_attr(e, 'days') | count if state_attr(e, 'days') else 0 -%} {%- if w -%} {%- if w.startswith('collecting data') -%} {%- set due = (now() + timedelta(days=8 - n)).strftime('%-d-%-m') -%} ⏳ **Status:** gegevens verzamelen, {{ n }} van 8 dagelijkse momentopnamen. De eerste waarde komt op {{ due }} om 00:05. {%- else -%} ⚠️ **Status:** {{ w[0] | upper }}{{ w[1:] }}. {%- endif -%} {%- else -%} ✅ **Status:** gemeten over de laatste 7 dagen. {%- endif %}

              <font color=grey>Energie eruit plus de verandering in opgeslagen energie, gedeeld door energie erin, gemeten aan de AC-kant van de batterij. HBC+ bewaart elke dag om 00:05 een momentopname en heeft er 8 nodig (7 dagen) voordat het een waarde toont.

              Het voorstel is de spread waarbij een laad-/ontlaadcyclus nog loont: het verlies op de dure kwartieren plus de slijtagekosten, naar boven afgerond. 

              Met *Dynamic gebruikt gemeten rendement* aan, rekent Dynamic het verlies zelf mee (rendement × hoog − laag) en is het voorstel alleen de slijtagekosten.</font>
            text_only: true
