      - type: grid
        cards:
          - type: heading
            heading: L1
            heading_style: title
            icon: mdi:sine-wave
          - type: gauge
            entity: sensor.hbc_phase_l1_grid_load
            name: Net t.o.v. zekering
            unit: '%'
            min: -120
            max: 120
            needle: true
            segments:
              - from: -120
                color: '#db4437'
              - from: -100
                color: '#ffa600'
              - from: -95
                color: '#a5d6a7'
              - from: 0
                color: '#ef9a9a'
              - from: 95
                color: '#ffa600'
              - from: 100
                color: '#db4437'
            grid_options:
              columns: 6
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
