              - type: markdown
                text_only: true
                content: '{%- set a = state_attr(''sensor.batterijplan'', ''actie'') -%} {%- set items = [(''L'', ''#3b82f6'', ''Laden van het net''), (''O'', ''#22c55e'', ''Ontladen''), (''H'', ''#f59e0b'', ''Vasthouden''), (''V'', ''#ec4899'', ''Terugleveren''), (''Z'', ''#94a3b8'', ''Alleen zon'')] -%} {% for k, c, t in items -%} <font color="{{ c }}">■</font> {% if k == a %}**{{ t }}** (nu){% else %}{{ t }}{% endif %} · {% endfor -%} <font color="#616161">■</font> Verleden'
                card_mod:
                  style: >
                    ha-card { padding: 4px 16px 0 16px !important; font-size:
