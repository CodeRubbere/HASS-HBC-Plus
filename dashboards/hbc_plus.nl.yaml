            content: '<ha-alert alert-type="info">Fasebewaking staat op <b>{{ states(''input_select.house_battery_phase_guard_mode'') }}</b>: HBC+ handelt nog niet naar deze instellingen{% if is_state(''input_select.house_battery_phase_guard_mode'', ''Monitor'') %}; een fase-overbelasting geeft alleen een melding, geen Full stop{% else %}; een fase-overbelasting geeft geen Full stop en geen melding{% endif %}. Actief en standby blijven leeg tot Node-RED hbc/phase/L1-L3 publiceert.</ha-alert>'
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_steering_info
                state: 'on'
              - condition: state
                entity: input_select.house_battery_phase_guard_mode
