            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            text_only: true
            content: '### Stap 4'
          - type: markdown
            text_only: true
            content: '{% set s = states(''input_select.house_battery_strategy_dynamic_data_source'') %}{% if s in [''None'', ''unknown'', ''unavailable''] %}<ha-alert title="Kies een tariefbron"><br>Dynamic, Charge Deadline en de prijsbewaking hebben prijzen nodig. Kies je bron, en bij Grid Clock je leverancier.</ha-alert>{% else %}<ha-alert alert-type="success" title="Tariefbron"><br>{{ s }}</ha-alert>{% endif %}'
          - type: heading
