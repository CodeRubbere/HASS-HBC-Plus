            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: true
              confirmation:
                text: De volledige test starten? Elke batterij laadt om de beurt met 800 W, zo'n 1 tot 3 minuten per batterij; daarna neemt je strategie het weer over.
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state_not: running
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: tile
            entity: script.hbc_selftest_run
            name: Alleen installatie controleren
            icon: mdi:clipboard-list-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: false
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: false
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state_not: running
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: tile
            entity: script.hbc_selftest_abort
            name: Test stoppen
            icon: mdi:stop-circle-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_abort
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_abort
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state: running
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            text_only: true
            content: '<font color=grey><small><i>Volledige test starten</i>: elke batterij laadt met 800 W, zo''n 1 tot 3 minuten per batterij. <i>Alleen installatie controleren</i>: zonder laden.</small></font>'
          - type: markdown
            text_only: true
            content: |-
              {%- set st = states('sensor.hbc_self_test_status') -%}
              {%- set c = state_attr('sensor.hbc_self_test_status', 'checks') or [] -%}
              {%- set okc = c | selectattr('result', 'eq', 'ok') | list | count -%}
              {%- set bad = c | rejectattr('result', 'eq', 'ok') | list -%}
              {%- set p = states('sensor.hbc_self_test_phases') -%}
              {%- set same = state_attr('sensor.hbc_self_test_phases', 'run_id') == state_attr('sensor.hbc_self_test_status', 'run_id') -%}
              {%- set bs = state_attr('sensor.hbc_self_test_phases', 'batteries') or [] -%}
              {%- set f = state_attr('sensor.hbc_self_test_status', 'finished') -%}
              {%- set ts = as_timestamp(f, none) if f else none -%}
              {%- set when = '' if ts is none else ((('vandaag ' if ts | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') else ts | timestamp_custom('%d-%m ')) ~ ts | timestamp_custom('%H:%M'))) -%}
              {%- set ptxt = {'ok': 'alle batterijen op de verwachte fase', 'mismatch': 'een batterij zit op een andere fase', 'uncertain': 'een fase is niet zeker', 'skipped': 'fasedetectie overgeslagen', 'not_started': 'fasedetectie niet gestart', 'timeout': 'fasedetectie duurde te lang', 'aborted': 'fasedetectie gestopt', 'error': 'fasedetectie mislukt'}.get(p, '') if same else 'fasen niet gemeten' -%}
              {%- if st == 'running' -%}
              <ha-alert alert-type="info" title="Test loopt">{{ 'Fasen meten: één batterij tegelijk laadt met 800 W.' if is_state_attr('sensor.hbc_self_test_status', 'step', 'phase_detection') else 'De controles lopen…' }}</ha-alert>
              {%- elif not c -%}
              <ha-alert alert-type="info" title="Nog niet uitgevoerd">Druk één keer op <b>Volledige test starten</b> na het installeren of wijzigen van batterijen.</ha-alert>
              {%- else -%}
              {%- set typ = 'error' if st == 'errors' else ('warning' if st in ['warnings', 'aborted'] else 'success') -%}
              <ha-alert alert-type="{{ typ }}" title="{{ okc }} van {{ c | count }} controles geslaagd{{ ' · ' ~ ptxt if ptxt }}">{{ ('Laatst uitgevoerd ' ~ when) if when else '' }}
              {%- for x in bad %}<br>{{ '❌' if x.result == 'error' else '⚠️' }} <b>{{ x.label }}</b>: {{ x.info }}{% endfor %}
              {%- for b in bs if same %}{% set cur = states('input_select.marstek_' ~ (b.id | lower) ~ '_phase') %}{% if b.measured and cur in ['L1', 'L2', 'L3'] and b.measured != cur %}<br>⚠️ <b>{{ b.id }}</b>: fasekaart {{ cur }}, gemeten {{ b.measured }}. Druk op <b>Fasekaart toepassen</b>.{% endif %}{% endfor -%}
              </ha-alert>
              {%- endif -%}
          - type: tile
            entity: input_boolean.hbc_show_selftest_details
            name: Toon details
            icon: mdi:chevron-down
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_selftest_details
                state_not: 'on'
          - type: tile
            entity: input_boolean.hbc_show_selftest_details
            name: Verberg details
            icon: mdi:chevron-up
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_selftest_details
                state: 'on'
          - type: button
            name: Fasekaart toepassen
            icon: mdi:sine-wave
            show_state: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_apply_phase_map
              confirmation:
                text: De gemeten fasen overnemen in de fasekaart (Marstek MN phase)? Batterijen op Own circuit blijven ongemoeid.
            visibility:
              - condition: numeric_state
                entity: sensor.hbc_self_test_phase_changes
                above: 0
            card_mod:
              style: |
                ha-card {
                  border: 2px solid var(--warning-color) !important;
                }
          - type: markdown
            content: |-
              {%- set c = state_attr('sensor.hbc_self_test_status', 'checks') or [] -%}
              {%- set icon = {'ok': '✅', 'warning': '⚠️', 'error': '❌'} -%}
              {%- set bs = state_attr('sensor.hbc_self_test_phases', 'batteries') or [] -%}
              {%- set notes = bs | selectattr('note', 'defined') | selectattr('note') | list | count > 0 -%}
              {%- if c %}
              | Controle | | Details |
              | :--- | :---: | :--- |
              {% for x in c -%}
              {%- set info = 'draait' if x.id == 'flow' and x.result == 'ok'
                   else ('automatisch' if x.id == 'price' and x.result == 'ok' and (x.info | string).startswith('not pinned') else x.info) -%}
              | {{ x.label }} | {{ icon.get(x.result, x.result) }} | {{ info | string | replace('|', '/') }} |
              {% endfor %}
              {%- else %}
              Nog geen test uitgevoerd.
              {% endif %}
              {%- if bs %}

              **Fasen**

              | Batterij | Fasekaart | Gemeten | Gemeten stijging (W){{ ' | Opmerking' if notes }} |
              | :--- | :---: | :---: | :---{{ ' | :---' if notes }} |
              {% for b in bs -%}
              {%- set cur = states('input_select.marstek_' ~ (b.id | lower) ~ '_phase') -%}
              {%- set d = b.delta or {} -%}
              | {{ b.id }} | {{ cur }} | {{ b.measured or '–' }}{{ ' ⚠️' if b.measured and cur in ['L1', 'L2', 'L3'] and cur != b.measured }} | {% for ph in ['L1', 'L2', 'L3'] %}{{ '**' if ph == b.measured }}{{ ph }} {{ d.get(ph, '–') }}{{ '**' if ph == b.measured }}{{ ' · ' if not loop.last }}{% endfor %}{% if notes %} | {{ b.note | default('') }}{{ ' (' ~ b.attempts ~ ' pogingen)' if b.attempts | default(0) > 1 }}{% endif %} |
              {% endfor %}
              {%- endif %}

              Fasebewaking: **{{ states('input_select.house_battery_phase_guard_mode') }}** · {{ states('input_select.house_battery_phase_sharing') }}
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_selftest_details
                state: 'on'
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
      - type: grid
        cards:
          - type: heading
            heading: Batterijkalibratie
            heading_style: title
            icon: mdi:battery-sync
          - type: heading
            icon: mdi:information
            heading: Hoe kalibratie werkt
            heading_style: subtitle
            tap_action:
