                state_not: 'on'
          - type: tile
            entity: input_boolean.hbc_show_phase_details
            name: Verberg details
            icon: mdi:chevron-up
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_phase_details
                state: 'on'
          - type: markdown
            content: |-
              {%- set ph = 'L1' -%}
              {%- set e = 'sensor.hbc_phase_' ~ (ph | lower) ~ '_active' -%}
              {%- set s = state_attr(e, 'since') -%}
              {%- set ts = as_timestamp(s, none) if s else none -%}
              {%- set when = '—' if ts is none else ((('' if ts | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') else ts | timestamp_custom('%d-%m ')) ~ ts | timestamp_custom('%H:%M'))) -%}
              {%- set working = (state_attr(e, 'mode') or 'idle') != 'idle' and states(e) not in ['none', 'off', 'unknown', 'unavailable'] -%}
              <font color=grey>Waarom deze batterij:</font> {{ state_attr(e, 'reason') or '—' }}<br>
              <font color=grey>Sinds:</font> {{ when }}<br>
              {%- if working %}
              <font color=grey>Setpoint:</font> {{ state_attr(e, 'setpoint') | int(0) }} W{{ ' · draagt over' if state_attr(e, 'handover') }}<br>
              {%- endif %}
              <font color=grey>Bewaking:</font> {{ state_attr(e, 'guard_mode') or '—' }} · {{ state_attr(e, 'sharing') or '—' }}
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_phase_details
                state: 'on'
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
