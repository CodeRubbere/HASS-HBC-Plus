              {% for i in range(1, n + 1) %}{% set d = days.get('M' ~ i) %}
              - **M{{ i }}** · {% if d is none %}nog geen volle lading gezien{% else %}{% set k = [((d / lim) * 10) | round(0) | int, 10] | min if lim > 0 else 10 %}{{ '▰' * k }}{{ '▱' * (10 - k) }} {{ d | round(0) | int }} van {{ lim }} dagen{{ ' · **nodig**' if d >= lim }}{% endif %}
              {%- endfor %}
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
