                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            content: '**Import override blijft in Monitor:** op een fase zitten twee batterijen en de fasebewaking staat niet op *Enforce*. Op vol vermogen van het net laden kan de groep van die fase overbelasten.'
