  - type: sections
    title: Logging
    icon: mdi:spider-outline
    path: problem-solver
    background:
      opacity: 10
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Node-RED
            heading_style: title
          - type: heading
            icon: mdi:list-status
            heading: 🕵️ Flow-trace
            heading_style: subtitle
          - type: markdown
            content: |-
              **Strategie:** {{ states('input_select.house_battery_strategy')}}
              ***
              {% set history = state_attr('sensor.home_battery_control_trace', 'history') or [] %} {% set start_ts = state_attr('sensor.home_battery_control_trace', 'start') %} {% set end_ts = state_attr('sensor.home_battery_control_trace', 'end') %} {% set start_dt = (start_ts / 1000) | as_datetime if start_ts is number else as_datetime(start_ts) %} {% set end_dt = (end_ts / 1000) | as_datetime if end_ts is number else as_datetime(end_ts) %} {% set total_dt = (end_dt - start_dt).total_seconds() if end_dt and start_dt else 0 %}
              Gebruikte flows
              | Stap | Flow | Duur |
              | :--- | :--- | :--- |
              {% set first_ts = history[0].timestamp if history|length > 0 else end_ts %} {% set first_dt = (first_ts / 1000) | as_datetime if first_ts is number else as_datetime(first_ts) %} {% set d0 = (first_dt - start_dt).total_seconds() if first_dt and start_dt else 0 %} | 0 | Start thuisbatterij | `{{ "{:.3f}".format(d0) }}s` |
              {% for entry in history -%}
                {%- set ts = entry.timestamp -%}
                {%- set current_dt = (ts / 1000) | as_datetime if ts is number else as_datetime(ts) -%}
                {%- if not loop.last -%}
                  {%- set next_ts = history[loop.index].timestamp -%}
                {%- else -%}
                  {%- set next_ts = end_ts -%}
                {%- endif -%}    
                {%- set next_dt = (next_ts / 1000) | as_datetime if next_ts is number else as_datetime(next_ts) -%}
                {%- set delta = (next_dt - current_dt).total_seconds() if next_dt and current_dt else 0 -%}
                | {{ loop.index }} | {{ entry.flow }} | `{{ "{:.3f}".format(delta) }}s` |
              {% endfor %} | ✔️ | Start thuisbatterij | `Klaar` |

              **Totaal `{{ "{:.3f}".format(total_dt) }}s`** in strategieflows
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
      - type: grid
        cards:
          - type: heading
            heading: Insights
            heading_style: title
            icon: mdi:information-outline
          - type: heading
            icon: mdi:list-box-outline
            heading: 📋 Uitleg (laatste 100 regels)
            heading_style: subtitle
          - type: markdown
            content: |
              {% set logs = state_attr('sensor.home_battery_control_log', 'log') %}  {% if logs %}
              | Tijd |  | Flow | Node | Uitleg |
              | :--- | :--- | :--- | :--- | :--- |
                {%- for entry in logs %}
                {%- set color = '#009ac7' -%}
                {%- if entry.level == 'log' %}{% set color = '#38cd9e' -%}
                {%- elif entry.level == 'warn' %}{% set color = 'orange' -%}
                {%- elif entry.level == 'error' %}{% set color = 'red' -%}
                {%- endif %}
                | {{ entry.timestamp }} | {{ entry.icon }} |<font color="{{color}}">{{ entry.flow }}</font> | {{ entry.node }} |{{ entry.payload }} |
                {%- endfor %}
              {% else %}
                Geen logs beschikbaar
              {% endif %}
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
        column_span: 2
