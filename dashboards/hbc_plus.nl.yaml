            content: '{% set circ = states(''input_number.house_battery_phase_circuit_limit_w'') | float(3680) %} <ha-alert alert-type="error">De batterijen op {% for i in [1, 2, 3] if states(''sensor.hbc_phase_l'' ~ i ~ ''_battery_power'') | float(0) | abs > circ %}L{{ i }} {% endfor %} trekken meer dan {{ circ | int }} W. Controleer dat er maar één batterij per fase draait (Enforce).</ha-alert>'
