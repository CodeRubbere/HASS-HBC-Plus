  - type: sections
    title: Tijd & Dynamisch
    path: timed-dynamic
    icon: mdi:timer-cog-outline
    cards: []
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_health
        name: Gezondheid
        icon: mdi:stethoscope
        show_entity_picture: false
        card_mod:
          style:
            ha-badge:
              $: |
                .badge {
                  border: 2px solid {{ 'var(--success-color)' if is_state('sensor.hbc_health', 'ok') else 'var(--error-color)' }} !important;
                }
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_select.house_battery_strategy
        name: Kies strategie
        tap_action:
          action: more-info
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_text.house_battery_strategy_active_sub_strategy
        show_entity_picture: false
        name: Voert uit
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_time
        show_entity_picture: false
        name: Tijd
        tap_action:
          action: none
    header:
      layout: center
      badges_position: top
      badges_wrap: scroll
      card:
        type: markdown
        content: >-
          ### Tijd & Dynamisch


          **Timed** draait de strategie die je voor elke periode van de dag
          instelt.

          **Dynamic** kiest een strategie op basis van de energieprijzen, _bijv.
          Charge in de goedkoopste uren_.

          _De prijzen komen uit je tariefbron, standaard Grid Clock..._
        text_only: true
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Dynamic-strategie
            heading_style: title
            badges:
              - type: entity
                entity: input_select.house_battery_strategy
                show_state: true
                show_icon: true
                icon: mdi:play-circle
                color: green
                visibility:
                  - condition: state
                    entity: input_select.house_battery_strategy
                    state: Dynamic
            grid_options:
              rows: 1
            icon: mdi:strategy
          - type: markdown
            content: >-
              {%- set a = state_attr('sensor.batterijplan', 'actie') -%} {%- set
              t = {'L': 'laden van het net', 'O': 'ontladen', 'H': 'vasthouden',
              'V': 'terugleveren', 'Z': 'alleen zon'} -%} <ha-alert alert-type="info"
              title="Aangestuurd door Batterijplan (Live)"><br> Nu: <b>{{ t.get(a, 'nog
              geen plan') }}</b>.</br>

              Batterijplan zet de Dynamic-modi elk kwartier; je eigen modi
              komen terug zodra Batterijplan Live uit gaat of je HBC+ Dynamic
              verlaat. {%- if state_attr('sensor.batterijplan_zon_voor_hbc',
              'modus') == 'laaddoel' %} De zonnevoorspelling van HBC+ is vervangen
              door het laaddoel van Batterijplan. {%- endif %}</ha-alert>
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_managed_by_batterijplan
                state: 'on'
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: heading
            icon: mdi:battery-sync
            heading: Dynamic · aangestuurd door Batterijplan (Live)
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /batterijplan
            visibility:
              - condition: state
                entity: binary_sensor.hbc_managed_by_batterijplan
                state: 'on'
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: markdown
            text_only: true
            content: >-
              <ha-alert alert-type="info" title="Aangestuurd door HELIOS"><br> Strategie
              <b>Helios</b> is gekozen.</br>

              HELIOS vervangt HBC+ Dynamic: je Dynamic-modi, prijsintervallen en
              zonnevoorspelling worden niet gebruikt zolang Helios gekozen is, en
              komen terug als je weer Dynamic kiest. Is er geen HELIOS-flow
              geïnstalleerd, dan draait HBC+ Full stop. Kies een andere strategie om
              de besturing terug te geven aan HBC+.</ha-alert>
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy
                state: Helios
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: heading
            icon: mdi:battery-sync
            heading: Aangestuurd door HELIOS Optimizer (Live)
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /helios-optimizer
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy
                state: Helios
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Integratie Cheapest Hours niet
              geïnstalleerd.</ha-alert>


              Deze strategie gebruikt [de integratie Cheapest Hours van
              TheFes](https://github.com/TheFes/cheapest-energy-hours/tree/main?tab=readme-ov-file#how-to-install).

              Installeer haar via de Marketplace of volg zijn instructies.
            text_only: true
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: update.cheapest_energy_hours_update
                    state: unavailable
                  - condition: state
                    entity: update.cheapest_energy_hours_update
                    state: unknown
          - type: heading
            icon: mdi:information
            heading: De Dynamic-strategie gebruiken
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md#dynamic
            visibility:
              - condition: not
                conditions:
                  - condition: state
                    entity: update.cheapest_energy_hours_update
                    state: unavailable
                  - condition: state
                    entity: update.cheapest_energy_hours_update
                    state: unknown
          - type: vertical-stack
            cards:
              - type: markdown
                text_only: true
                content: >-
                  <ha-icon icon="mdi:chart-bar"></ha-icon>&nbsp; Prijsintervallen:
                  <b>HBC+</b>
                visibility:
                  - condition: state
                    entity: binary_sensor.hbc_managed_by_batterijplan
                    state_not: 'on'
                  - condition: state
                    entity: input_select.house_battery_strategy
                    state_not: Helios
                card_mod:
                  style: >
                    ha-card { padding: 12px 16px 0 16px !important; font-size:
                    18px; }
              - type: markdown
                text_only: true
                content: >-
                  {%- set d = 'sensor.hbc_energy_prices_data' -%} {%- set m =
                  state_attr(d, 'mark_now') -%} {%- set marks = state_attr(d,
                  'marks') or [] -%} {%- set negs = marks | selectattr('neg',
                  'defined') | map(attribute='neg') | select | list -%} {%- set
                  items = [('Cheap', '#4caf50', 'Goedkoop'), ('Regular', '#9e9e9e',
                  'Normaal'), ('Expensive', '#ff9800', 'Duur')] -%} {% for k, c, t in
                  items -%} <font color="{{ c }}">■</font> {% if k == m %}**{{ t }}**
                  (nu){% else %}{{ t }}{% endif %} · {% endfor -%} {%- if 'export' in
                  negs %}<font color="#9c27b0">■</font> Terugleveren kost geld · {%
                  endif -%} {%- if 'import' in negs %}<font
                  color="#4a148c">■</font> Betaald om af te nemen · {% endif -%} <font
                  color="#009ac7">■</font> Huidig kwartier {%- if
                  is_state('binary_sensor.hbc_sell_prices_separate', 'on') %} ·
                  <font color="#455a64">━</font> Terugleverprijs{% endif %}
                card_mod:
                  style: >
                    ha-card { padding: 4px 16px 0 16px !important; font-size:
                    12px; }
                visibility:
                  - condition: state
                    entity: binary_sensor.hbc_managed_by_batterijplan
                    state_not: 'on'
                  - condition: state
                    entity: input_select.house_battery_strategy
                    state_not: Helios
              - type: markdown
                text_only: true
                content: >-
                  <ha-icon icon="mdi:chart-bar"></ha-icon>&nbsp; Prijsintervallen:
                  <b>HELIOS Optimizer</b>
