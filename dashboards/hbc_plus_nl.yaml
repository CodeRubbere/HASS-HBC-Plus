                    ha-card { padding: 12px 16px 0 16px !important; font-size:
                    18px; }
              - type: markdown
                text_only: true
                content: >-
                  {%- set p =
                  state_attr('input_number.helios_optimizer_energy_plan',
                  'plan') -%} {%- if p and p.timestamp is defined and
