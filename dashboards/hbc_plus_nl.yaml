                card_mod:
                  style: >
                    ha-card { padding: 4px 16px 0 16px !important; font-size:
                    12px; }
                visibility:
                  - condition: state
                    entity: binary_sensor.hbc_managed_by_batterijplan
                    state: 'on'
              - type: custom:apexcharts-card
                card_mod:
                  style: >
                    ha-card { background: none !important; border: none
                    !important; box-shadow: none !important; }
                header:
                  show: false
                graph_span: 48h
                span:
                  start: day
                stacked: false
                now:
                  show: true
                  color: '#009ac7'
                  label: Nu
                apex_config:
                  noData:
                    text: Geen data beschikbaar
                    align: center
                    verticalAlign: middle
                    style:
                      fontSize: 16px
                  plotOptions:
                    bar:
                      borderRadius: 2
                      columnWidth: 90%
                  legend:
                    show: true
                    position: top
                    markers:
                      width: 0
                      height: 0
                      size: 0
                      strokeWidth: 0
                    formatter: |
                      EVAL:function (name) {
                        const i = String(name).indexOf(':');
                        return i < 0 ? name : '<b>' + name.slice(0, i + 1) + '</b>' + name.slice(i + 1);
                      }
                  xaxis:
                    type: datetime
                    labels:
                      datetimeUTC: false
                      format: HH:mm
                      rotate: -45
                      rotateAlways: true
                  yaxis:
                    decimalsInFloat: 0
                    title:
                      text: cent / kWh
                  tooltip:
                    shared: true
                    intersect: false
                    x:
                      format: ddd dd MMM HH:mm
                    'y':
                      formatter: |
                        EVAL:function (val, opts) {
                          if (val === null || val === undefined) return '';
                          const t = Number(val).toFixed(1) + ' ct/kWh';
                          if (!opts || opts.seriesIndex !== 0) return t;
                          const x = opts.w.globals.seriesX[0][opts.dataPointIndex];
                          const l = (window.hbcPlanLabel || {})[x];
                          return l ? t + ' · ' + l : t;
                        }
                series:
                  - entity: sensor.hbc_energy_prices_data
                    name: 'Staven: inkoopprijs'
                    type: column
                    color: '#9e9e9e'
                    float_precision: 1
                    show:
                      legend_value: false
                    data_generator: >
                      // HBC+ v1.2: purple = feeding in costs money, dark purple
                      = paid to import

                      // HBC+ v1.3: while Batterijplan (Live) steers Dynamic
                      (F10), or the strategy is Helios

                      // with a HELIOS plan, past bars are plain grey and future
                      bars show the planned action.

                      const marks = entity.attributes.marks || [];

                      const colours = { high: '#ff9800', low: '#4caf50' };

                      const negColours = { export: '#9c27b0', import: '#4a148c'
                      };

                      const now = Date.now();

                      const bp =
                      hass.states['binary_sensor.hbc_managed_by_batterijplan']?.state
                      === 'on';

                      const helios =
                      hass.states['input_select.house_battery_strategy']?.state
                      === 'Helios';

                      // planAt(start ms) -> [colour, tooltip label] of the
                      planned action, or null

                      let planAt = () => null;

                      let managed = false;

                      if (bp) {
                        // Batterijplan: punten[0] = start in s, punten[5] = action
                        const ACT = { L: ['#3b82f6', 'laden van net'], O: ['#22c55e', 'ontladen'],
                                      H: ['#f59e0b', 'vasthouden'], V: ['#ec4899', 'terugleveren'], Z: ['#94a3b8', 'alleen zon'] };
                        const plan = {};
                        (hass.states['sensor.batterijplan']?.attributes?.punten || [])
                          .forEach(p => { plan[p[0] * 1000] = p[5]; });
                        planAt = (s) => ACT[plan[s]] || null;
                        managed = true;
                      } else if (helios) {
                        // HELIOS: plan.timestamp[i] (local time) + plan.hbc_sub_strat[i], step_size in minutes;
                        // a quarter gets the sub-strategy of the HELIOS step it falls in
                        const SUB = { 'Sell': ['#ff9800', 'Sell'], 'Charge': ['#4caf50', 'Charge'],
                                      'Charge PV': ['#cddc39', 'Charge PV'], 'Self-consumption': ['#00bcd4', 'Self-consumption'],
                                      'Zero import': ['#3f51b5', 'Zero import'], 'Standby / peak shave': ['#9e9e9e', 'Standby / peak shave'],
                                      'Full stop': ['#e53935', 'Full stop'] };
                        const hp = hass.states['input_number.helios_optimizer_energy_plan']?.attributes || {};
                        const p = hp.plan || {};
                        const ts = (p.timestamp || []).map(t => new Date(String(t).replace(' ', 'T')).getTime());
                        const sub = p.hbc_sub_strat || [];
                        const step = (Number(hp.step_size) || 15) * 60000;
                        planAt = (s) => {
                          for (let i = ts.length - 1; i >= 0; i--) {
                            if (ts[i] <= s) return (s < ts[i] + step && SUB[sub[i]]) ? SUB[sub[i]] : null;
                          }
                          return null;
                        };
                        managed = ts.length > 0;
                      }

                      const labels = {};

                      const out = marks.map(iv => {
                        const s = new Date(iv.start).getTime();
                        const e = new Date(iv.end).getTime();
                        const a = managed ? planAt(s) : null;
                        if (a) labels[s] = a[1];
                        return {
                          x: s,
                          y: iv.price,
                          fillColor: (now >= s && now < e)
                            ? '#009ac7'
                            : (managed && e <= now)
                              ? '#616161'
                            : a
                              ? a[0]
                              : (negColours[iv.neg] || colours[iv.mark] || '#9e9e9e')
                        };
                      });

                      window.hbcPlanLabel = labels;

                      return out;
                  - entity: sensor.hbc_energy_prices_data
                    name: 'Lijn: terugleverprijs'
                    type: line
                    color: '#455a64'
                    stroke_width: 2
                    curve: stepline
                    float_precision: 1
                    show:
                      legend_value: false
                    data_generator: >
                      // HBC+ v1.2: only when there are separate sell prices
                      (Grid Clock feed)

                      const marks = entity.attributes.marks || [];

                      if (!marks.some(iv => iv.sell !== undefined && iv.sell !==
                      null && iv.sell !== iv.price)) return [];

                      return marks.map(iv => ({ x: new Date(iv.start).getTime(),
                      y: iv.sell }));
            card_mod:
              style: |
                #root {
                  background: var(--ha-card-background, var(--card-background-color, white));
                  border-radius: var(--ha-card-border-radius, 12px);
                  border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color, var(--divider-color, #e0e0e0));
                  box-shadow: var(--ha-card-box-shadow, none);
                  overflow: hidden;
                  --vertical-stack-card-gap: 0px;
                  gap: 0 !important;
                }
          - type: entity
            entity: input_text.house_battery_strategy_active_sub_strategy
            icon: mdi:play-circle-outline
            name: Nu actief
            grid_options:
              columns: full
              rows: auto
            state_color: false
            card_mod:
              style: |
                .value { font-size: 18px !important; }
          - type: entity
            entity: sensor.hbc_energy_price_now
            icon: mdi:transmission-tower-export
            name: Inkoopprijs
            grid_options:
              rows: auto
            state_color: false
            card_mod:
              style: |
                .value { font-size: 18px !important; }
                .measurement { font-size: 13px !important; }
          - type: entity
            entity: sensor.hbc_energy_export_price_now
            icon: mdi:transmission-tower-import
            name: Terugleverprijs
            grid_options:
              rows: auto
            state_color: false
            card_mod:
              style: |
                .value { font-size: 18px !important; }
                .measurement { font-size: 13px !important; }
            visibility:
              - condition: state
                entity: binary_sensor.hbc_sell_prices_separate
                state: 'on'
          - type: entity
            entity: sensor.hbc_energy_prices_data
            attribute: mark_now
            icon: mdi:periodic-table
            name: Huidige prijs
            grid_options:
              rows: auto
            state_color: false
            card_mod:
              style: |
                .value { font-size: 18px !important; }
                .measurement { font-size: 13px !important; }
          - type: entity
            entity: sensor.hbc_energy_prices_data
            icon: mdi:cash-fast
            name: Winst netcyclus vandaag
            grid_options:
              rows: auto
            state_color: false
            card_mod:
              style: |
                .value { font-size: 18px !important; }
                .measurement { font-size: 13px !important; }
            unit: cent / kWh
            attribute: gross_spread
      - type: grid
        cards:
          - type: heading
            heading: Weergave prijsmarkeringen
            heading_style: title
            icon: mdi:chart-bar
            grid_options:
              rows: 1
          - type: heading
            icon: mdi:format-list-bulleted
            heading: Vandaag en morgen per interval. Zet Prijslijst uit om te verbergen
            heading_style: subtitle
          - type: markdown
            content: >-
              <small><small>


              | Tijd | Vandaag ¢ | Markering | Trend | Morgen ¢ | Markering | Trend |

              |:---:|---:|:---:|:---:|---:|:---:|:---:|

              {% set s = 'sensor.hbc_energy_prices_data' %}

              {%- set prices = state_attr(s, 'prices') or [] -%}

              {%- set marks  = state_attr(s, 'marks') or [] -%}

              {%- set pph    = state_attr(s, 'datapoints_per_hour') | default(1,
              true) | int -%}

              {%- set ppd    = 24 * pph -%}

              {%- set step   = (60 / pph) | int -%}

              {%- set bars   = ['▁','▂','▃','▄','▅','▆','▇','█'] -%}

              {%- set pmin   = (prices | min) if prices else 0 -%}

              {%- set pmax   = (prices | max) if prices else 0 -%}

              {%- set rng    = pmax - pmin -%}

              {%- set current_idx = now().hour * pph + (now().minute // step)
              -%}

              {%- if prices and (prices | length) >= ppd -%}
                {%- for i in range(ppd) -%}
                  {%- set t_price   = prices[i] -%}
                  {%- set t_idx     = i + ppd -%}
                  {%- set tom_price = prices[t_idx] if (prices | length) > t_idx else none -%}
                  {%- set hour      = (i // pph) | int -%}
                  {%- set minute    = (i % pph) * step -%}
                  {%- set t_mark    = marks[i].mark if (marks | length) > i else none -%}
                  {%- set tom_mark  = marks[t_idx].mark if (marks | length) > t_idx else none -%}
                  {%- set t_bar     = bars[((t_price - pmin) / rng * 7) | round(0) | int] if rng > 0 else bars[0] -%}
                  {%- set tom_bar   = (bars[((tom_price - pmin) / rng * 7) | round(0) | int] if (tom_price is not none and rng > 0) else (bars[0] if tom_price is not none else '-')) -%}
                  {%- set t_emoji   = '🔴' if t_mark == 'high' else ('🟢' if t_mark == 'low' else '—') -%}
                  {%- set tom_emoji = '🔴' if tom_mark == 'high' else ('🟢' if tom_mark == 'low' else ('—' if tom_price is not none else '-')) -%}
                  | {% if i == current_idx %}<font color="#009ac7">{{ "%02d"|format(hour) }}:{{ "%02d"|format(minute) }}</font>{% else %}{{ "%02d"|format(hour) }}:{{ "%02d"|format(minute) }}{% endif %} | {% if i == current_idx %}<font color="#009ac7">{{ "%0.1f"|format(t_price) }}</font>{% elif t_mark == 'high' %}<font color="orange">{{ "%0.1f"|format(t_price) }}</font>{% elif t_mark == 'low' %}<font color="#4caf50">{{ "%0.1f"|format(t_price) }}</font>{% else %}{{ "%0.1f"|format(t_price) }}{% endif %} | {{ t_emoji }} | {% if i == current_idx %}<font color="#009ac7">{{ t_bar }}</font>{% elif t_mark == 'high' %}<font color="orange">{{ t_bar }}</font>{% elif t_mark == 'low' %}<font color="#4caf50">{{ t_bar }}</font>{% else %}{{ t_bar }}{% endif %} | {% if tom_price is not none %}{% if tom_mark == 'high' %}<font color="orange">{{ "%0.1f"|format(tom_price) }}</font>{% elif tom_mark == 'low' %}<font color="#4caf50">{{ "%0.1f"|format(tom_price) }}</font>{% else %}{{ "%0.1f"|format(tom_price) }}{% endif %}{% else %}-{% endif %} | {{ tom_emoji }} | {% if tom_mark == 'high' %}<font color="orange">{{ tom_bar }}</font>{% elif tom_mark == 'low' %}<font color="#4caf50">{{ tom_bar }}</font>{% else %}{{ tom_bar }}{% endif %} |
                {% endfor %}
              {%- else -%}
                | - | *Onvoldoende data beschikbaar...* | - | - | - | - | - |
              {% endif %}


              **Bereik:** {{ "%0.1f"|format(pmin) }} – {{ "%0.1f"|format(pmax) }}
              ¢  •  **Spreiding:** {{ "%0.1f"|format(rng) }} ¢


              </small></small>
        visibility:
