views:
  - type: sections
    path: home-battery-control
    title: Overzicht
    icon: mdi:home
    max_columns: 3
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_health
        name: Gezondheid
        icon: mdi:stethoscope
        show_entity_picture: false
        card_mod:
          style:
            ha-badge:
              $: |
                .badge {
                  border: 2px solid {{ 'var(--success-color)' if is_state('sensor.hbc_health', 'ok') else 'var(--error-color)' }} !important;
                }
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_time
        show_entity_picture: false
        name: Tijd
        tap_action:
          action: none
    header:
      card:
        type: markdown
        text_only: true
        content: >-
          {%- set dash = '1.3.0' -%}
          <center><img src="/local/hbc-plus/hbc-plus-dashboard.svg?v=v{{ dash }}"
          alt="HBC+ Home Battery Control Plus" height="72"></center>
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Status & bediening (v1.3.0)
            heading_style: title
            icon: mdi:gamepad-variant-outline
          - type: markdown
            text_only: true
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.hbc_update_available
                    state: 'on'
                  - condition: numeric_state
                    entity: sensor.hbc_release_dashboard_number
                    above: 10300
            content: |-
              {%- set dash = '1.3.0' -%}
              {%- set u = 'binary_sensor.hbc_update_available' -%}
              {%- set latest = state_attr(u, 'latest') -%}
              {%- set out = state_attr(u, 'outdated') or [] -%}
              {%- set md = (state_attr('sensor.hbc_release_manifest', 'parts') or {}).get('dashboard', '') -%}
              {%- if md is match('^\d+\.\d+\.\d+$') and md.split('.')[:2] == dash.split('.')[:2]
                    and (md.split('.') | map('int') | list) > (dash.split('.') | map('int') | list) -%}
                {%- set out = out + ['Dashboard: ' ~ dash ~ ' → ' ~ md] -%}
              {%- endif -%}
              {%- if state_attr(u, 'newer') -%}
              <ha-alert alert-type="info" title="HBC+ v{{ latest }} is beschikbaar"><br>Je draait v{{ state_attr(u, 'installed') }}. In de release notes staat wat er nieuw is en hoe je bijwerkt.</ha-alert>
              {%- elif out -%}
              <ha-alert alert-type="info" title="Niet elk onderdeel van HBC+ v{{ latest }} is geïnstalleerd"><br>Kopieer deze onderdelen uit de release: <br>{{ out | join('<br>') }}</ha-alert>
              {%- endif %}


              [Open de release notes]({{ state_attr(u, 'release_url') }})
          - type: markdown
            text_only: true
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: sensor.hbc_release_number
                    below: 103
                  - condition: numeric_state
                    entity: sensor.hbc_release_number
                    above: 103
            content: >-
              {%- set dash = '1.3.0' -%} {%- set inst =
              states('sensor.hbc_package_version') -%} {%- set dn = (dash.split('.')[0]
              | int) * 100 + (dash.split('.')[1] | int) -%} {%- set newer =
              states('sensor.hbc_release_number') | int(0) > dn -%}
              <ha-alert alert-type="warning" title="Dashboard v{{ dash }} past niet
              bij HBC+ v{{ inst }}"><br>{% if newer %}Plak
              dashboards/hbc_plus_nl.yaml van v{{ inst }} opnieuw in de
              raw-configuratie-editor van dit dashboard.{% else %}Dit dashboard is
              nieuwer dan je packages en flows: kopieer de packages en importeer de
              flows van v{{ dash }}.{% endif %}</ha-alert>
          - type: markdown
            text_only: true
            content: >-
              {%- set checks = [
                states('input_number.house_battery_count') | int(0) > 0,
                states('sensor.p1_meter_power') not in ['unknown', 'unavailable'],
                is_state('input_boolean.house_battery_control_has_node_red', 'on'),
                states('input_select.house_battery_strategy_dynamic_data_source') not in ['None', 'unknown', 'unavailable'],
                is_state('input_select.marstek_master_battery_mode', 'Full control'),
                states('sensor.hbc_self_test_status') in ['ok', 'warning'] ] -%}
              <ha-alert alert-type="info" title="Installatie: {{ checks | select |
              list | count }} van {{ checks | count }} stappen klaar"><br>Rond de
              installatie af op de view Instellingen.</ha-alert>


              [Open Instellingen](/home-battery-control-plus-nl/advanced-settings)
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_onboarding_finished
                state_not: 'on'
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state: 'on'
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            content: >-
              {%- set t = states('sensor.hbc_last_run') | as_datetime(None) -%}
              {%- set p1 = states.sensor.p1_meter_power -%} {%- set p1_ok = p1
              is not none and p1.state not in ['unknown', 'unavailable', ''] -%}
              {%- set p1_at = (p1.last_reported if p1 is not none and
              p1.last_reported is defined and p1.last_reported else
              (p1.last_updated if p1 is not none else none)) -%} {%- set
              p1_stale = not p1_ok or p1_at is none or (now() -
              p1_at).total_seconds() > 300 -%} <ha-alert alert-type="error"
              title="HBC+ stuurt de batterijen niet aan"><br>Geen goede regelcyclus
              {{ 'sinds ' ~ as_local(t).strftime('%d-%m %H:%M') if t else 'sinds Home
              Assistant startte' }}. Home Assistant heeft de batterijen teruggegeven
              aan hun eigen firmware. {% if p1_stale -%} {%- if not p1_ok -%} De
              P1-meter (sensor.p1_meter_power) is {{ p1.state if p1 is not none else
              'niet gevonden' }}. {%- else -%} Geen nieuwe P1-meterwaarde sinds {{
              as_local(p1_at).strftime('%H:%M') }} (laatste {{ p1.state }} W). {%-
              endif %} HBC+ draait alleen op P1-updates: controleer de P1-meter en zijn
              integratie in Home Assistant. {%- else -%} Controleer of Node-RED
              draait. {%- endif %}</ha-alert>


              [Open Logging](/home-battery-control-plus-nl/problem-solver)
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: sensor.hbc_health
                state:
                  - warning
                  - error
            content: >-
              {%- set h = 'sensor.hbc_health' -%} {%- set e = state_attr(h,
              'errors_10m') | int(0) -%} {%- set w = state_attr(h,
              'warnings_10m') | int(0) -%} {%- set last = state_attr(h,
              'last_error') if e > 0 else state_attr(h, 'last_warning') -%} {%-
              set ea = (state_attr(h, 'last_error_at') or '') |
              as_datetime(None) -%} {%- set wa = (state_attr(h,
              'last_warning_at') or '') | as_datetime(None) -%} {%- set at = ea
              if e > 0 else wa -%} {%- set newest = ([ea, wa] | select | max) if
              (ea or wa) else None -%} {%- set quiet = newest is not none and
              (now() - newest).total_seconds() > 90 -%} {%- set hint =
              state_attr(h, 'hint') or '' -%} {%- set what = 'fouten' if e > 0
              else 'waarschuwingen' -%}

              {%- if quiet -%} <ha-alert alert-type="info" title="Geen nieuwe HBC+-{{
              what }} sinds {{ (newest | as_local).strftime('%H:%M')
              }}"><br>Deze melding verdwijnt vanzelf rond {{ ((newest +
              timedelta(minutes=10)) | as_local).strftime('%H:%M') }}.<br> In de
              laatste 10 minuten: {{ e }} fout{{ 'en' if e != 1 }} en {{ w }}
              waarschuwing{{ 'en' if w != 1 }}.<br><br><b>Laatste:</b><br><i>{{ last | e }}</i>{% if
              hint %}<br><br><b>Oplossing:</b><br>{{ hint | e }}{% endif %}</ha-alert>

              {%- else -%} <ha-alert alert-type="{{ 'error' if is_state(h,
              'error') else 'warning' }}" title="{{ 'HBC+ blijft fouten loggen'
              if is_state(h, 'error') else 'HBC+ heeft een probleem gelogd' }}"><br>{{ e }}
              fout{{ 'en' if e != 1 }} en {{ w }} waarschuwing{{ 'en' if w != 1 }} in
              de laatste 10 minuten.<br><br><b>Laatste{{ ' (om ' ~ (at | as_local).strftime('%H:%M') ~ ')'
              if at else '' }}:</b><br><i>{{ last | e }}</i>{% if hint
              %}<br><br><b>Oplossing:</b><br>{{ hint | e }}{% endif %}<br><small>Oorzaak
              opgelost? Deze melding verdwijnt vanzelf na 10 minuten zonder nieuwe
              fouten of waarschuwingen.</small></ha-alert>

              {%- endif %}


              [Open Logging](/home-battery-control-plus-nl/problem-solver)
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_phase_limit_exceeded
                state: 'on'
            content: >-
              {% set lim = states('input_number.house_battery_phase_limit_w') |
              float(3680) %} <ha-alert alert-type="error" title="Fasezekering
              overbelast"><br>Netvermogen op {% for i in [1, 2, 3] if
              states('sensor.p1_meter_power_phase_' ~ i) | float(0) | abs > lim
              %}L{{ i }} {% endfor %} is hoger dan {{ lim | int }} W. Controleer het
              huisverbruik en de actieve batterijen.</ha-alert>


              [Open Fasebewaking](/home-battery-control-plus-nl/phases)
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_phase_circuit_limit_exceeded
                state: 'on'
            content: >-
              {% set circ =
              states('input_number.house_battery_phase_circuit_limit_w') |
              float(3680) %} <ha-alert alert-type="error" title="Batterijgroep
              overbelast"><br>De batterijen op {% for i in [1, 2, 3] if
              states('sensor.hbc_phase_l' ~ i ~ '_battery_power') | float(0) |
              abs > circ %}L{{ i }} {% endfor %} trekken meer dan {{ circ | int }}
              W. Controleer of er maar één batterij per fase werkt
              (Enforce).</ha-alert>


              [Open Fasebewaking](/home-battery-control-plus-nl/phases)
          - type: tile
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.ev_is_charging
                state: 'on'
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
              - condition: state
                entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                state: Full stop
            entity: sensor.ev_is_charging
            name: EV laadt - strategie Full stop is actief
            color: red
            hide_state: true
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.ev_is_charging
                state: 'on'
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
              - condition: state
                entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                state: Standby / peak shave
            entity: sensor.ev_is_charging
            name: EV laadt - strategie Standby / peak shave is actief
            color: amber
            hide_state: true
            vertical: false
            features_position: bottom
          - type: heading
            icon: mdi:cash-remove
            heading: >-
              Geen energieprijzen: Dynamic draait zijn basisstrategie. Controleer de
              tariefbron
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/prices
            visibility:
              - condition: state
                entity: binary_sensor.hbc_price_data_missing
                state: 'on'
          - type: heading
            icon: mdi:alert
            heading: 'Dynamic-strategie: Full stop. Kies een tariefbron'
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/prices
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy_dynamic_data_source
                state: None
              - condition: state
                entity: input_select.house_battery_strategy
                state: Dynamic
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - features:
              - type: select-options
            type: tile
            entity: input_select.marstek_master_battery_mode
            features_position: bottom
            vertical: false
            show_entity_picture: false
            hide_state: true
            name: Besturingsmodus
            icon: mdi:camera-control
          - type: tile
            entity: input_select.house_battery_strategy
            name: Kies strategie
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: select-options
                options:
                  - Full stop
                  - Self-consumption
                  - Timed
                  - Dynamic
                  - Charge
                  - Charge PV
                  - Charge Deadline
                  - Sell
                  - Zero import
                  - Standby / peak shave
                  - Helios
            features_position: bottom
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - type: markdown
            text_only: true
            content: >-
              <ha-alert alert-type="info" title="Aangestuurd door HELIOS"><br> Strategie
              <b>Helios</b> is gekozen.</br>

              De HELIOS-flow beslist wanneer de batterijen laden, ontladen of
              wachten, niet HBC+. Is er geen HELIOS-flow geïnstalleerd, dan draait
              HBC+ Full stop. Kies een andere strategie om de besturing terug te
              geven aan HBC+.</ha-alert>
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy
                state: Helios
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: heading
            icon: mdi:battery-sync
            heading: Aangestuurd door HELIOS Optimizer (Live)
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /helios-optimizer
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy
                state: Helios
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: markdown
            content: >-
              {%- set a = state_attr('sensor.batterijplan', 'actie') -%} {%- set
              t = {'L': 'laden van het net', 'O': 'ontladen', 'H': 'vasthouden',
              'V': 'terugleveren', 'Z': 'alleen zon'} -%} <ha-alert alert-type="info"
              title="Aangestuurd door Batterijplan (Live)"><br> Nu: <b>{{ t.get(a, 'nog
              geen plan') }}</b>.</br>

              Batterijplan zet de Dynamic-modi elk kwartier; je eigen modi
              komen terug zodra Batterijplan Live uit gaat of je HBC+ Dynamic
              verlaat. {%- if state_attr('sensor.batterijplan_zon_voor_hbc',
              'modus') == 'laaddoel' %} De zonnevoorspelling van HBC+ is vervangen
              door het laaddoel van Batterijplan. {%- endif %}</ha-alert>
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_managed_by_batterijplan
                state: 'on'
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: heading
            icon: mdi:battery-sync
            heading: Dynamic · aangestuurd door Batterijplan (Live)
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /batterijplan
            visibility:
              - condition: state
                entity: binary_sensor.hbc_managed_by_batterijplan
                state: 'on'
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: markdown
            content: >-
              **✋ Vastgehouden door:** {% for h in state_attr('sensor.hbc_strategy_holds',
              'holds') or [] if h.active %}{{ h.requester }} ({{ h.strategy }}{{
              ', tot ' ~ h.expires if h.expires }}){{ ', ' if not loop.last
              }}{% endfor %}. Jouw keuze: {{
              state_attr('sensor.hbc_strategy_holds', 'base') }}.
            visibility:
              - condition: numeric_state
                entity: sensor.hbc_strategy_holds
                above: 0
          - type: markdown
            content: >-
              **⚡ Prijsbewaking:** {{ state_attr('sensor.hbc_price_guard',
              'action') }} {%- set u = state_attr('sensor.hbc_price_state',
              'until') -%} {%- if u %} tot {{ as_timestamp(u) |
              timestamp_custom('%H:%M') }}{% endif %} ({{ {'export_negative':
              'terugleveren kost geld',
                  'import_negative': 'je krijgt betaald om af te nemen'}.get(states('sensor.hbc_price_state'), 'lage prijzen') }})
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/prices
            visibility:
              - condition: state
                entity: sensor.hbc_price_guard
                state: override
          - type: heading
            icon: mdi:information-slab-circle
            heading: 'Over strategieën '
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md#een-strategie-kiezen
          - type: entities
            entities:
              - entity: input_text.house_battery_strategy_active_sub_strategy
                type: simple-entity
                name: Voert uit (flow)
            grid_options:
              columns: 12
              rows: auto
            show_header_toggle: false
            state_color: false
            no_background: true
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - type: history-graph
            entities:
              - entity: input_select.house_battery_strategy
                name: Gekozen strategie
              - entity: input_text.house_battery_strategy_active_sub_strategy
                name: Voert uit
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            hours_to_show: 12
          - type: markdown
            content: |-
              <font color="grey">

              #### Je energie- en batterijgebruik</font>
            text_only: true
          - type: history-graph
            entities:
              - entity: input_number.house_battery_control_pid_output
                name: PID-regeling
              - entity: sensor.p1_meter_power
                name: Netvermogen
              - entity: select.marstek_m1_forcible_charge_discharge
                name: M1
              - entity: select.marstek_m2_forcible_charge_discharge
                name: M2
              - entity: select.marstek_m3_forcible_charge_discharge
                name: M3
              - entity: select.marstek_m4_forcible_charge_discharge
                name: M4
              - entity: select.marstek_m5_forcible_charge_discharge
                name: M5
              - entity: select.marstek_m6_forcible_charge_discharge
                name: M6
            hours_to_show: 0.05
      - type: grid
        cards:
          - type: heading
            heading: Nu
            heading_style: title
            icon: mdi:flash
          - type: tile
            grid_options:
              columns: full
              rows: 1
            entity: sensor.battery_time_remaining
            name: Resterende batterij-energie
            icon: mdi:battery-clock
            show_entity_picture: false
            hide_state: false
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.p1_meter_power
            name: Netvermogen
            vertical: false
            show_entity_picture: false
            grid_options:
              columns: 6
            icon: mdi:transmission-tower
          - type: tile
            grid_options:
              columns: 6
            entity: sensor.house_total_battery_power
            name: Batterijvermogen
            icon: mdi:home-battery
            show_entity_picture: false
            vertical: false
            features_position: bottom
          - type: heading
            heading: Laatste 24 uur
            heading_style: subtitle
            grid_options:
              rows: 1
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.p1_meter_power
                name: Netvermogen
              - entity: sensor.house_total_battery_power
                name: Batterijen
          - type: heading
            heading: Info en handleidingen
            heading_style: title
            icon: mdi:book-open-page-variant
          - type: heading
            icon: mdi:book-open-variant
            heading: Gebruikershandleiding (Nederlands)
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md
          - type: heading
            icon: mdi:book-open-variant
            heading: User guide (English)
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md
          - type: heading
            icon: mdi:spider
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/problem-solver
            heading: Logging
          - type: markdown
            content: -----
            text_only: true
          - type: heading
            icon: mdi:star-check-outline
            heading: Vind je HBC+ handig? Geef het een ster
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus
          - type: markdown
            content: >-
              [![GitHub
              stars](https://img.shields.io/github/stars/CodeRubbere/HASS-HBC-Plus?style=social)](https://github.com/CodeRubbere/HASS-HBC-Plus)
            text_only: true
      - type: grid
        cards:
          - type: heading
            heading: Batterijen
            heading_style: title
            icon: mdi:home-battery
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/batteries
          - type: heading
            heading: Marstek M1
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: state
                entity: sensor.marstek_m1_device_name
                state_not: unknown
          - type: glance
            entities:
              - entity: sensor.marstek_m1_battery_state_of_charge
                name: M1 SoC
              - entity: sensor.marstek_m1_ac_power
                name: M1 vermogen
              - entity: number.marstek_m1_max_charge_power
                name: Max. laden
              - entity: number.marstek_m1_max_discharge_power
                name: Max. ontladen
              - entity: input_select.marstek_m1_phase
                name: Fase
            visibility:
              - condition: state
                entity: sensor.marstek_m1_device_name
                state_not: unknown
          - type: heading
            heading: Marstek M2
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m2_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 1
          - type: glance
            entities:
              - entity: sensor.marstek_m2_battery_state_of_charge
                name: M2 SoC
              - entity: sensor.marstek_m2_ac_power
                name: M2 vermogen
              - entity: number.marstek_m2_max_charge_power
                name: Max. laden
              - entity: number.marstek_m2_max_discharge_power
                name: Max. ontladen
              - entity: input_select.marstek_m2_phase
                name: Fase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m2_device_name
                    state_not: unknown
                  - condition: numeric_state
