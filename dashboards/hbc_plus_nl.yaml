    header:
      layout: center
      badges_position: top
      badges_wrap: scroll
      card:
        type: markdown
        text_only: true
        content: >-
          ### Fasebewaking


          **Fasebewaking** houdt elke fase onder zijn netzekering en
          batterijgroep, _bijv. één actieve batterij per gedeelde fase_.

          **Peak shaving** houdt netafname en teruglevering onder een grens,
          _bijv. voor een capaciteitstarief_.

          _Per fase: de actieve batterij, net- en batterijbelasting, en laad- en
          ontlaadruimte..._
    cards: []
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Fasebewaking
            heading_style: title
            icon: mdi:sine-wave
            grid_options:
              rows: 1
          - type: heading
            heading: Instellingen fasebewaking
            heading_style: subtitle
            icon: mdi:cog-outline
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/advanced-settings
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_phase_limit_exceeded
                state: 'on'
            content: >-
              {% set lim = states('input_number.house_battery_phase_limit_w') |
              float(3680) %} <ha-alert alert-type="error" title="Fasezekering
              overbelast"><br>Netvermogen op {% for i in [1, 2, 3] if
              states('sensor.p1_meter_power_phase_' ~ i) | float(0) | abs > lim
              %}L{{ i }} {% endfor %} is hoger dan {{ lim | int }} W. Controleer het
              huisverbruik en de actieve batterijen hieronder.</ha-alert>
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_phase_circuit_limit_exceeded
                state: 'on'
            content: >-
              {% set circ =
              states('input_number.house_battery_phase_circuit_limit_w') |
              float(3680) %} <ha-alert alert-type="error" title="Batterijgroep
              overbelast"><br>De batterijen op {% for i in [1, 2, 3] if
              states('sensor.hbc_phase_l' ~ i ~ '_battery_power') | float(0) |
              abs > circ %}L{{ i }} {% endfor %} trekken meer dan {{ circ | int }}
              W. Controleer of er maar één batterij per fase werkt
              (Enforce).</ha-alert>
          - type: markdown
            text_only: true
            visibility:
              - condition: state
