  - type: sections
    icon: mdi:math-integral-box
    path: self-consumption
    sections:
      - type: grid
        cards:
          - type: heading
            heading: PID-regelaar (geavanceerde instellingen)
            heading_style: title
            icon: mdi:cog-box
            grid_options:
              rows: 1
          - type: markdown
            content: >-
              <font color="grey"><i>Deze instellingen bepalen hoe agressief het
              systeem het netvermogen op het gewenste niveau probeert te houden.
              Te agressief is instabiel! Te voorzichtig kost rendement. Volgens
              feedback uit de community kan deze PID-regeling de software van de
              fabrikant ruim verslaan.

              </i></font>
            text_only: true
          - type: heading
            icon: mdi:information
            heading: Hulp | PID-regeling instellen en afstellen
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md#self-consumption-en-pid-afstelling
          - type: markdown
            content: >-
              <ha-alert alert-type="warning">Hoge gevoeligheid van de regelaar,
              houd je systeem in de gaten.</ha-alert>
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: input_number.house_battery_control_kp
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_ki
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_kd
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_error_signal_dampening
                    above: 70
                  - condition: numeric_state
                    entity: input_number.house_battery_control_pid_output_dampening
                    above: 50
            text_only: true
          - type: entities
            entities:
              - entity: input_select.house_battery_control_pid_presets
                name: PID-presets
              - entity: input_number.house_battery_control_kp
                name: Proportionele versterking (Kp)
              - entity: input_number.house_battery_control_ki
                name: Integrerende versterking (Ki)
              - entity: input_number.house_battery_control_kd
                name: Differentiërende versterking (Kd)
              - entity: input_number.house_battery_control_error_signal_dampening
                name: Ingangsdemping
                secondary_info: none
              - entity: input_number.house_battery_control_pid_output_dampening
                name: Uitgangsdemping
              - entity: input_number.house_target_grid_consumption_in_w
                name: Doel netafname
      - type: grid
        cards:
          - type: heading
            heading: PID-historie
            heading_style: title
            icon: mdi:cog-box
            grid_options:
              rows: 1
          - type: markdown
            content: >-
              <font color="grey"><i>Gebruik **PID-historie** voor het afstellen.
              Ze toont de interne waarden van de regelaar:


              * **Ingang (W):** fout in netvermogen (huidig t.o.v. gewenst)

              * **Uitgang (W):** doelvermogen van de batterij

              * **Uitgang (W):** P-term + I-term + D-term


              </i></font>
            text_only: true
            grid_options:
              columns: full
          - title: PID-analyse
            type: history-graph
            entities:
              - entity: input_number.house_battery_control_pid_output
                name: PID-uitgang
              - entity: sensor.p1_meter_power
                name: Netvermogen
              - entity: input_number.house_battery_control_error_signal
                name: PID-ingang
              - entity: input_number.house_battery_control_p_term
                name: P-term
              - entity: input_number.house_battery_control_i_term
                name: I-term
              - entity: input_number.house_battery_control_d_term
                name: D-term
            grid_options:
              columns: full
            hours_to_show: 0.1
          - type: markdown
            content: >-
              <font color="grey"><i>Klik op de labels in de legenda om losse
              grafieken aan/uit te zetten

              </i></font>
            text_only: true
            grid_options:
              columns: full
        column_span: 2
