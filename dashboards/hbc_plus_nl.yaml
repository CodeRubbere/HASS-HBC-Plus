      badges_position: top
      badges_wrap: scroll
      card:
        type: markdown
        content: >-
          ### PID-regeling

          De **PID-regelaar** stuurt je batterijen om het netverbruik dicht bij
          het doel te houden, _bijv. 0 Watt_, en wordt gebruikt door: 

          _Self-consumption, Charge PV, Charge (geregeld), Peak shaving en
          meer..._
        text_only: true
    subview: false
    max_columns: 3
  - type: sections
    title: Batterijen
    path: batteries
    icon: mdi:home-battery-outline
    badges:
      - type: entity
