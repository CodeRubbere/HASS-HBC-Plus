                    12px; }
                visibility:
                  - condition: state
                    entity: input_select.house_battery_strategy
                    state: Helios
              - type: markdown
                text_only: true
                content: >-
                  <ha-icon icon="mdi:chart-bar"></ha-icon>&nbsp; Prijsintervallen:
                  <b>Batterijplan</b>
                visibility:
