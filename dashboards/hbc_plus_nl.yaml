              feed heeft de echte all-in inkoop- en terugleverprijzen.
            visibility:
              - condition: state
                entity: input_select.house_battery_price_guard_mode
                state: 'On'
              - condition: state
                entity: input_select.house_battery_strategy_dynamic_data_source
                state_not: Grid Clock
          - type: markdown
            content: >-
              **Afname-override blijft op Monitor:** een fase draagt twee
              batterijen en de fasebewaking staat niet op *Enforce*. Op vol
              vermogen laden van het net kan de groep van die fase overbelasten.
            visibility:
              - condition: state
                entity: binary_sensor.hbc_phase_shared
                state: 'on'
              - condition: state
                entity: input_select.house_battery_phase_guard_mode
                state_not: Enforce
              - condition: state
                entity: input_select.house_battery_price_guard_mode
                state_not: 'Off'
          - type: markdown
            content: >-
              **Verkopen loont zelden zonder salderen.** Nu levert een
              teruggeleverde kWh {{ states('sensor.hbc_energy_export_price_now')
              }} ct op, een kWh die je zelf houdt bespaart {{
              states('sensor.hbc_energy_price_now') }} ct. Dynamic markeert alleen
              een Sell-periode als de terugleverprijs de inkoopprijs met meer dan
              de minimale spread verslaat; overweeg *Self-consumption* voor dure
              periodes.
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy_dynamic_expensive
                state: Sell
              - condition: state
                entity: binary_sensor.hbc_sell_prices_separate
                state: 'on'
