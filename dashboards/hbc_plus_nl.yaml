                  (nu){% else %}{{ t }}{% endif %} · {% endfor -%} <font
                  color="#616161">■</font> Verleden {%- else -%} Geen HELIOS-plan
                  gevonden (input_number.helios_optimizer_energy_plan), dus de staven
                  tonen de gewone prijsmarkeringen. {%- endif -%}
                card_mod:
                  style: >
