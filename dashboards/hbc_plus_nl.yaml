              - type: entities
                entities:
                  - entity: input_number.house_battery_control_idle_time
                    name: Stoppen na inactiviteit van
                  - entity: input_number.house_battery_control_hysteresis_in_w
                    name: 'Hysterese '
                    secondary_info: none
            grid_options:
              columns: 12
              rows: auto
        column_span: 3
      - type: grid
        cards:
          - type: heading
            heading: Batterij-fasetest
            heading_style: title
            icon: mdi:clipboard-check-outline
            grid_options:
              rows: 1
          - type: heading
            icon: mdi:information
            heading: Controleer de installatie en de fasekaart
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md#zelftest-bij-installatie
          - type: markdown
            content: >-
              <font color=grey>Controleert of alles wat HBC+ nodig heeft er is en
              werkt, en meet dan per batterij op welke fase hij zit: één batterij
              tegelijk laadt ongeveer 35 s met 800 W (1 tot 3 minuten per
              batterij, daarna neemt je strategie het weer over). De test past de
              fasekaart nooit aan: dat doe je met de knop hieronder.</font>
            text_only: true
            grid_options:
              rows: 1
              columns: 24
          - show_name: true
            show_icon: true
            type: button
            name: Zelftest starten
            icon: mdi:play-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              confirmation:
                text: >-
                  De zelftest starten? Met fasedetectie aan verlaten de
                  batterijen je strategie 1 tot 3 minuten per batterij.
              data:
                phase_detection: true
              target: {}
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state_not: running
          - type: button
            name: Alleen controles
            icon: mdi:clipboard-list-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: false
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state_not: running
          - type: button
            name: Zelftest stoppen
            icon: mdi:stop-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_abort
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state: running
          - type: heading
            icon: ''
            heading_style: subtitle
          - type: tile
            grid_options:
              rows: 1
              columns: 24
            entity: sensor.hbc_self_test_status
            name: Batterij-fasetest
            vertical: false
            features_position: bottom
          - type: markdown
            content: >
              {% set c = state_attr('sensor.hbc_self_test_status', 'checks') or
              [] %} {% set icon = {'ok': '✅', 'warning': '⚠️', 'error': '❌'} %}
              {% if c %}| Controle | | Details |

              | :--- | :---: | :--- |

              {% for x in c %}| {{ x.label }} | {{ icon.get(x.result, x.result)
              }} | {{ x.info | replace('|', '/') }} |

              {% endfor %}{% elif is_state('sensor.hbc_self_test_status',
              'running') %}De controles lopen...{% else %}Nog niet uitgevoerd.{% endif
              %}
          - type: markdown
            content: >
              {% set p = states('sensor.hbc_self_test_phases') %} {% set bs =
              state_attr('sensor.hbc_self_test_phases', 'batteries') or [] %} {%
              if is_state('sensor.hbc_self_test_status', 'running') and
              is_state_attr('sensor.hbc_self_test_status', 'step',
              'phase_detection') %}**Fasedetectie: bezig** – één batterij tegelijk
              laadt met 800 W, ongeveer 1 tot 3 minuten per batterij.{% elif
              p in ['unknown', 'unavailable'] %}Fasedetectie nog niet uitgevoerd.{%
              else %}**Fasedetectie: {{ p }}**{% if
              state_attr('sensor.hbc_self_test_phases', 'reason') %} – {{
              state_attr('sensor.hbc_self_test_phases', 'reason') }}{% endif %}


              {% if bs %}| Batterij | Ingesteld | Gemeten | Stijging L1 / L2 / L3 (W) |
              Opmerking |

              | :--- | :---: | :---: | :--- | :--- |

              {% for b in bs %}{% set cur = states('input_select.marstek_' ~
              (b.id | lower) ~ '_phase') %}| {{ b.id }} | {{ cur }} | {{
              b.measured or '–' }}{{ ' ⚠️' if b.measured and cur in ['L1', 'L2',
              'L3'] and cur != b.measured }} | {{ b.delta.L1 | default('–') }} /
              {{ b.delta.L2 | default('–') }} / {{ b.delta.L3 | default('–') }}
              | {{ b.note }}{{ ' (' ~ b.attempts ~ ' pogingen)' if b.attempts |
              default(0) > 1 }} |

              {% endfor %}{% endif %}{% endif %}


              Fasebewaking: **{{
              states('input_select.house_battery_phase_guard_mode') }}** · {{
              states('input_select.house_battery_phase_sharing') }}
          - type: button
            name: Fasekaart toepassen
            icon: mdi:sine-wave
            show_state: false
            grid_options:
              columns: full
              rows: 2
            tap_action:
              action: perform-action
