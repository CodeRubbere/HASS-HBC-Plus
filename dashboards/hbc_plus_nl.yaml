                  {%- set a = state_attr('sensor.batterijplan', 'actie') -%} {%-
                  set items = [('L', '#3b82f6', 'Laden van net'), ('O',
                  '#22c55e', 'Ontladen'), ('H', '#f59e0b', 'Vasthouden'), ('V',
                  '#ec4899', 'Terugleveren'), ('Z', '#94a3b8', 'Alleen zon')] -%} {%
