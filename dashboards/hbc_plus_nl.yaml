    max_columns: 3
  - type: sections
    title: Instellingen
    path: advanced-settings
    icon: mdi:cog-outline
    cards: []
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_health
        name: Gezondheid
        icon: mdi:stethoscope
        show_entity_picture: false
        card_mod:
          style:
            ha-badge:
              $: |
                .badge {
                  border: 2px solid {{ 'var(--success-color)' if is_state('sensor.hbc_health', 'ok') else 'var(--error-color)' }} !important;
                }
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_select.house_battery_strategy
        name: Kies strategie
        tap_action:
          action: more-info
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_text.house_battery_strategy_active_sub_strategy
        show_entity_picture: false
        name: Voert uit
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_time
        show_entity_picture: false
        name: Tijd
        tap_action:
          action: none
    header:
      layout: center
      badges_position: top
      badges_wrap: scroll
      card:
        type: markdown
        text_only: true
        content: >
          ### Instellingen


          **Installatie**, de **instellingen van de fasebewaking**,
          **meldingen** en de **EV-stoptrigger**.
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Installatie
            heading_style: title
            icon: mdi:cog-outline
            grid_options:
              rows: 1
          - type: markdown
            content: '### Stap 1'
            text_only: true
          - type: entities
            entities:
              - entity: input_number.house_battery_count
                name: Aantal batterijen
          - type: markdown
            content: '### Stap 2'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="Netvermogensensor instellen"><br>HBC+ heeft
              sensor.p1_meter_power en sensor.p1_meter_power_phase_1 … _3 nodig
              (W, afname positief).</ha-alert>

              1. Bewerk het bestand `packages/hbc_config.yaml`

              1. Haal het commentaar weg bij optie A of B: elke regel tussen BEGIN
              en END

              1. Vervang elke sensor gemarkeerd met `<< YOUR`, controleer de
              configuratie en herlaad Template-entiteiten
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.p1_meter_power
                    state: unavailable
                  - condition: state
                    entity: sensor.p1_meter_power
                    state: unknown
          - type: markdown
            content: >-
              <ha-alert title="Netvermogensensor"
              alert-type="success"><br>Ingesteld</ha-alert>
            visibility:
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - type: heading
            icon: mdi:pen
            heading: Open de bestandseditor
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /core_configurator
          - type: markdown
            content: '### Stap 3'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="Node-RED instellen"><br> Importeer en deploy de <font
              color=red>Node-RED</font>-flows.</ha-alert>
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state_not: 'on'
          - type: markdown
            content: >-
              <ha-alert title="Node-RED" alert-type="success"><br>Ingesteld en
              flows gedeployed</ha-alert>
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
          - type: markdown
            text_only: true
            content: '### Stap 4'
          - type: markdown
            text_only: true
            content: >-
              {% set s =
              states('input_select.house_battery_strategy_dynamic_data_source')
              %}{% if s in ['None', 'unknown', 'unavailable'] %}<ha-alert
              title="Kies een tariefbron"><br>Dynamic, Charge Deadline en de
              prijsbewaking hebben prijzen nodig. Kies je bron, en met Grid Clock
              je leverancier.</ha-alert>{% else %}<ha-alert
              alert-type="success" title="Tariefbron"><br>{{ s
              }}</ha-alert>{% endif %}
          - type: heading
            heading: Open Prijzen
            heading_style: subtitle
            icon: mdi:pen
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/prices
          - type: markdown
            content: '### Stap 5'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="(Optioneel) vermogensgrenzen nakijken"><br> Gebruik
              grenzen en peak shaving om <font color=darkblue>pieken en het risico
              op overbelasting</font> te verlagen.</ha-alert>
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state_not: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state_not: 'on'
          - type: heading
            icon: mdi:cog-outline
            heading: Vermogensgrenzen nakijken
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/phases
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state_not: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state_not: 'on'
          - type: markdown
            content: >-
              <ha-alert title="Vermogensgrenzen" alert-type="success"><br> De
              batterijen helpen pieken en overbelasting te voorkomen, als dat
              kan.</ha-alert>
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state: 'on'
          - type: markdown
            text_only: true
            content: '### Stap 6'
          - type: markdown
            text_only: true
            content: >-
              {% set t = states('input_text.house_battery_notify_targets') %}{%
              if t in ['', 'unknown', 'unavailable'] %}<ha-alert
              title="(Optioneel) Meldingen"><br>Elke melding gaat nu naar
              <code>notify.notify</code>. Stel hieronder je meldingsdoelen in en
              stuur een test.</ha-alert>{% else %}<ha-alert alert-type="success"
              title="Meldingen"><br>Verstuurd naar {{ t }}</ha-alert>{% endif %}
          - type: markdown
            content: '### Stap 7'
            text_only: true
          - type: markdown
            content: >-
              Zet de Besturingsmodus pas op `Full control` nadat je alle
              installatie-instructies hebt doorgenomen en gecontroleerd. 


              Kies een laadstrategie, bijv. `Self-consumption`, kies de
              regelaargevoeligheid `Very safe` en je bent klaar!
          - type: markdown
            text_only: true
            content: '### Stap 8'
          - type: markdown
            text_only: true
            content: >-
              {% set s = states('sensor.hbc_self_test_status') %}{% if s in
              ['ok', 'warning'] %}<ha-alert alert-type="success"
              title="Zelftest"><br>Laatste resultaat: {{ s }}</ha-alert>{% elif s ==
              'running' %}<ha-alert title="Zelftest"><br>Bezig…</ha-alert>{% else
              %}<ha-alert title="Start de zelftest"><br>Start met Full control aan
              de zelftest op de view Batterijen (Batterij-fasetest): die
              controleert de installatie en meet de fase van elke
              batterij.</ha-alert>{% endif %}
          - type: heading
            heading: Open Batterijen
            heading_style: subtitle
            icon: mdi:pen
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus-nl/batteries
          - type: markdown
            content: '### Klaar'
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - show_name: false
            show_icon: true
            type: button
            entity: input_boolean.house_battery_control_onboarding_finished
            grid_options:
              columns: 2
              rows: 1
            icon: mdi:eye-off-outline
            hold_action:
              action: toggle
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
            icon_height: 25px
          - type: markdown
            text_only: true
            grid_options:
              columns: 9
              rows: 1
            content: |-
              ---
              Onboarding verbergen
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - type: markdown
            content: >-
              _Afronden verbergt deze checklist en de installatiebanner op het
              Overzicht. Toon ze weer met **Onboarding tonen/verbergen**._
            grid_options:
              columns: full
              rows: auto
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
        visibility:
          - condition: state
            entity: input_boolean.house_battery_control_onboarding_finished
            state_not: 'on'
      - type: grid
        cards:
          - type: heading
            heading: Installatie
            heading_style: title
            icon: mdi:cog-outline
            grid_options:
              rows: 1
          - type: markdown
            text_only: true
            content: >-
              <font color=grey>De installatie is klaar. *Onboarding
              tonen/verbergen* brengt de checklist hier terug, en de
              installatiebanner op het Overzicht.</font>
          - type: tile
            entity: input_boolean.house_battery_control_onboarding_finished
            name: Onboarding tonen/verbergen
            icon: mdi:eye-off-outline
            color: disabled
            show_entity_picture: false
            hide_state: true
            vertical: false
            tap_action:
              action: toggle
            features_position: bottom
            grid_options:
              columns: full
        visibility:
          - condition: state
            entity: input_boolean.house_battery_control_onboarding_finished
            state: 'on'
      - type: grid
        cards:
          - type: heading
            heading: Instellingen fasebewaking
            heading_style: title
            icon: mdi:sine-wave
            grid_options:
              rows: 1
              columns: 12
          - type: heading
            icon: mdi:information
            heading: Grenzen en batterijkeuze per fase
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md#configuratiereferentie
          - type: entities
            entities:
              - entity: input_select.house_battery_phase_guard_mode
                name: Modus fasebewaking
              - entity: input_select.house_battery_phase_sharing
                name: Fasedeling
              - entity: input_number.house_battery_phase_limit_w
                name: Netzekering per fase
              - entity: input_number.house_battery_phase_circuit_limit_w
                name: Batterijgroep per fase
              - entity: input_number.house_battery_phase_margin_w
                name: Marge fasegrens
              - entity: input_select.house_battery_phase_selection
                name: Keuze actieve batterij
              - entity: input_number.house_battery_phase_switch_soc_delta
                name: SoC-verschil bij fasewissel
              - entity: input_number.house_battery_phase_min_dwell
                name: Minimale verblijftijd bij fasewissel
              - entity: sensor.house_battery_installed_max_charge_power
                name: Geïnstalleerd max. laadvermogen (alle batterijen)
              - entity: input_number.house_battery_total_max_charge_power
                name: Max. laadvermogen dat HBC+ aan planners meldt
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Meldingen
            heading_style: title
            icon: mdi:cellphone-message
            grid_options:
              rows: 1
          - type: markdown
            content: >-
              <font color=grey>Elke HBC+-melding gaat naar de notify-acties
              hieronder, gescheiden door komma's (bijv.
              `notify.mobile_app_<telefoon>`). Leeg = `notify.notify`. Stuur een
              test na het wijzigen van het veld: een tikfout in de naam geeft geen
              melding, alleen een fout in het HA-log.</font>
            text_only: true
          - type: entities
            entities:
              - entity: input_text.house_battery_notify_targets
                name: Meldingsdoelen
              - type: button
                name: Testmelding sturen
                icon: mdi:send
                action_name: Testen
                tap_action:
                  action: perform-action
                  perform_action: script.hbc_notify
                  data:
                    title: 'HBC+: test'
                    message: Testmelding vanaf de view Instellingen.
          - type: heading
            heading: EV-stoptrigger
            heading_style: title
            icon: mdi:power-plug-off
            grid_options:
              rows: 1
          - type: markdown
            content: >-
              <font color=grey>De stoptrigger GAAT BOVEN ALLE actieve
              strategieën.

              _Bijv. om je thuisbatterijen af te koppelen terwijl de EV
              laadt_</font>
            text_only: true
          - type: entities
            entities:
              - entity: input_text.house_battery_strategy_ev_sensor_entity_id
                name: Entity_id "EV laadt" (input_boolean)
                secondary_info: none
              - entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                name: Triggerstrategie
          - type: markdown
            content: >-
              <font color=grey>Vul in het veld hierboven de `entity_id` in van een
              `input_boolean` of een `on/off template_sensor`. Kies of een actieve
              trigger de batterijen helemaal stopt of in standby houdt voor peak
              shaving.</font>
            text_only: true
          - type: tile
            grid_options:
              columns: full
            entity: sensor.ev_is_charging
            name: EV-stoptrigger
            vertical: false
            features_position: bottom
          - type: markdown
            content: >-
              <font color=grey>De `EV-stoptrigger` hoort nu te tonen of de trigger
              actief is. Stoptrigger 'aan' = de gekozen triggerstrategie wordt
              toegepast.</font>
            text_only: true
      - type: grid
        cards:
          - type: heading
            heading: Versies
            heading_style: title
            icon: mdi:tag-multiple-outline
            grid_options:
              rows: 1
          - type: markdown
            text_only: true
            content: |-
              {%- set dash = '1.3.0' -%}
              {%- set rel = states('sensor.hbc_package_version') -%}
              {%- set mm = rel.split('.')[:2] | join('.') -%}
              {%- set fl = state_attr('sensor.hbc_health', 'flows_version') or '—' -%}
              {%- set files = state_attr('sensor.hbc_package_version', 'files') or {} -%}
              {%- macro ver(v) -%}{{ v if (v | string).split('.')[:2] | join('.') == mm else '<font color=red>' ~ v ~ '</font>' }}{%- endmacro -%}
              <font color=grey>Elk onderdeel van HBC+ en zijn versie. Een minor release (1.3 → 1.4) vervangt elk onderdeel; een patchrelease (1.3.0 → 1.3.1) alleen de onderdelen die veranderden, dus patchnummers kunnen verschillen. Een onderdeel in rood is van een andere release: zie de stappen voor bijwerken in de gebruikershandleiding.</font>

              | Onderdeel | Versie |
              |:--|:--|
              | **HBC+-release** | **{{ rel }}** |
              | Node-RED-flows | {{ ver(fl) }} |
              | Dashboard | {{ ver(dash) }} |
              {% for k, v in files | dictsort -%}
              | `{{ k }}.yaml` | {{ ver(v) }} |
              {% endfor %}
              {%- set items = state_attr('sensor.hbc_health', 'version_items') or [] -%}
              {%- set exp = state_attr('sensor.hbc_health', 'version_expected') or mm -%}
              {%- for part, title in [('flow', 'Node-RED-flow'), ('package', 'Packagebestand'), ('config', 'instelling in hbc_config.yaml')] -%}
              {%- set rows = items | selectattr('part', 'eq', part) | list -%}
              {%- if rows %}

              <ha-alert alert-type="warning" title="HBC+: versie van {{ title }} klopt niet"><br>{% for r in rows -%}
              {{ r.name }} {{ ('v' ~ r.version) if r.version else ('ontbreekt' if part == 'config' else 'ontbreekt (of ouder dan deze controle)') }}<br>
              {%- endfor %}<small>Verwacht: v{{ exp }}.x</small></ha-alert>
              {%- endif -%}
              {%- endfor -%}
              {%- if dash.split('.')[:2] | join('.') != exp and rel is match('^\\d+\\.\\d+') %}

              <ha-alert alert-type="warning" title="HBC+: versie van het dashboard klopt niet"><br>Dashboard v{{ dash }}<br><small>Verwacht: v{{ exp }}.x</small></ha-alert>
              {%- endif %}
    max_columns: 4
  - type: sections
    title: Logging
    icon: mdi:spider-outline
    path: problem-solver
    background:
      opacity: 10
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Node-RED
            heading_style: title
            grid_options:
              rows: 1
          - type: heading
            icon: mdi:list-status
            heading: 🕵️ Flow-trace
            heading_style: subtitle
          - type: markdown
            content: >-
              **Strategie:** {{ states('input_select.house_battery_strategy')}}

              ***

              {% set history = state_attr('sensor.home_battery_control_trace',
              'history') or [] %} {% set start_ts =
              state_attr('sensor.home_battery_control_trace', 'start') %} {% set
              end_ts = state_attr('sensor.home_battery_control_trace', 'end') %}
              {% set start_dt = (start_ts / 1000) | as_datetime if start_ts is
              number else as_datetime(start_ts) %} {% set end_dt = (end_ts /
              1000) | as_datetime if end_ts is number else as_datetime(end_ts)
              %} {% set total_dt = (end_dt - start_dt).total_seconds() if end_dt
              and start_dt else 0 %}

              Gebruikte flows

              | Stap | Flow | Duur |

              | :--- | :--- | :--- |

              {% set first_ts = history[0].timestamp if history|length > 0 else
              end_ts %} {% set first_dt = (first_ts / 1000) | as_datetime if
              first_ts is number else as_datetime(first_ts) %} {% set d0 =
              (first_dt - start_dt).total_seconds() if first_dt and start_dt
              else 0 %} | 0 | Start thuisbatterij | `{{ "{:.3f}".format(d0) }}s`
              |

              {% for entry in history -%}
                {%- set ts = entry.timestamp -%}
                {%- set current_dt = (ts / 1000) | as_datetime if ts is number else as_datetime(ts) -%}
                {%- if not loop.last -%}
                  {%- set next_ts = history[loop.index].timestamp -%}
                {%- else -%}
                  {%- set next_ts = end_ts -%}
                {%- endif -%}    
                {%- set next_dt = (next_ts / 1000) | as_datetime if next_ts is number else as_datetime(next_ts) -%}
                {%- set delta = (next_dt - current_dt).total_seconds() if next_dt and current_dt else 0 -%}
                | {{ loop.index }} | {{ entry.flow }} | `{{ "{:.3f}".format(delta) }}s` |
              {% endfor %} | ✔️ | Start thuisbatterij | `Klaar` |


              **Totaal `{{ "{:.3f}".format(total_dt) }}s`** besteed in
              strategieflows
      - type: grid
        cards:
          - type: heading
            heading: Inzichten
            heading_style: title
            grid_options:
              rows: 1
            icon: batterijplan:info
          - type: heading
            icon: mdi:list-box-outline
            heading: 📋 Uitleg (laatste 100 items)
            heading_style: subtitle
          - type: markdown
            content: >
              {% set logs = state_attr('sensor.home_battery_control_log', 'log')
              %}  {% if logs %}

              | Tijd |  | Flow | Node | Uitleg |

              | :--- | :--- | :--- | :--- | :--- |
                {%- for entry in logs %}
                {%- set color = '#009ac7' -%}
                {%- if entry.level == 'log' %}{% set color = '#38cd9e' -%}
                {%- elif entry.level == 'warn' %}{% set color = 'orange' -%}
                {%- elif entry.level == 'error' %}{% set color = 'red' -%}
                {%- endif %}
                | {{ entry.timestamp }} | {{ entry.icon }} |<font color="{{color}}">{{ entry.flow }}</font> | {{ entry.node }} |{{ entry.payload }} |
                {%- endfor %}
              {% else %}
                Geen logs beschikbaar
              {% endif %}
            grid_options:
              columns: full
        column_span: 2
    header:
      card:
        type: markdown
        text_only: true
        content: >-
          ### Logging

          Hulp nodig om te zien wat er gebeurt? 

          Zet **Inzichtenmodus** aan. _Gaat na 5 min vanzelf uit._

          📘 [Documentatie problemen
          oplossen](https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md#problemen-oplossen)
