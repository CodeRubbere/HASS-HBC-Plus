    header:
      layout: center
      badges_position: top
      badges_wrap: scroll
      card:
        type: markdown
        text_only: true
        content: >-
          ### Batterijen


          **Batterijlevensduur**: kalibratie, welke batterij als eerste laadt, en
          wanneer een inactieve batterij stopt.

          De **zelftest** controleert de installatie en meet op welke fase elke
          batterij is aangesloten.

          _Per batterij: fase, cutoffs en maximaal vermogen..._
    cards: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Batterijlevensduur
            heading_style: title
            icon: mdi:medication
          - type: vertical-stack
            cards:
              - type: heading
                heading: Batterijkalibratie
                heading_style: subtitle
                icon: mdi:battery-sync
              - type: markdown
                content: >-
                  <font color=grey>Heeft een batterij het ingestelde aantal
                  dagen zijn laad-cutoff niet gehaald, dan laadt HBC+ hem één keer
                  tot 100 % in het goedkoopste blok na middernacht (Charge
                  Deadline). De laad-cutoff gaat voor die nacht naar 100 % en
                  daarna terug. Notify stuurt alleen een melding.</font>
                text_only: true
              - type: entities
                entities:
                  - entity: input_select.house_battery_calibration_mode
                    name: Modus
                  - entity: input_number.house_battery_calibration_days
                    name: Kalibreren na
                  - entity: input_datetime.house_battery_calibration_deadline
                    name: Vol om
                  - entity: sensor.hbc_calibration_status
                    name: Status
              - type: markdown
                content: >
                  {% set n = [states('input_number.house_battery_count') |
                  int(0), 6] | min %}

                  {% set lim =
                  states('input_number.house_battery_calibration_days') |
                  float(14) %}

                  {% set days = state_attr('sensor.hbc_calibration_due', 'days')
                  or {} %}

                  | Batterij | Dagen sinds vol |

                  | :--- | ---: |

                  {% for i in range(1, n + 1) %}{% set d = days.get('M' ~ i) %}|
                  M{{ i }} | {{ '–' if d is none else (d | round(0) | int) }}{{
                  ' ⚠️' if d is not none and d >= lim }} |

                  {% endfor %}
            grid_options:
              columns: 12
              rows: auto
          - type: vertical-stack
            cards:
              - type: heading
                icon: mdi:information
                heading: Wissel welke batterij als eerste laadt
                heading_style: subtitle
                tap_action:
