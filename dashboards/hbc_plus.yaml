  - type: sections
    title: Settings
    path: advanced-settings
    icon: mdi:cog-outline
    cards: []
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_health
        name: Health
        icon: mdi:stethoscope
        show_entity_picture: false
        card_mod:
          style:
            ha-badge:
              $: |
                .badge {
                  border: 2px solid {{ 'var(--success-color)' if is_state('sensor.hbc_health', 'ok') else 'var(--error-color)' }} !important;
                }
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_select.house_battery_strategy
        name: Choose strategy
        tap_action:
          action: more-info
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_text.house_battery_strategy_active_sub_strategy
        show_entity_picture: false
        name: Executing
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_time
        show_entity_picture: false
        name: Time
        tap_action:
          action: none
    header:
      layout: center
      badges_position: top
      badges_wrap: scroll
      card:
        type: markdown
        text_only: true
        content: >
          ### Settings


          **Setup**, the **phase guard settings**, **notifications** and the
          **EV stop trigger**.
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Setup
            heading_style: title
            icon: mdi:cog-outline
            grid_options:
              rows: 1
          - type: markdown
            content: '### Step 1'
            text_only: true
          - type: entities
            entities:
              - entity: input_number.house_battery_count
          - type: markdown
            content: '### Step 2'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="Setup Grid Power Sensor"><br>HBC+ needs
              sensor.p1_meter_power and sensor.p1_meter_power_phase_1 … _3 (W,
              import positive).</ha-alert>

              1. Edit the file `packages/hbc_config.yaml`

              1. Uncomment option A or B: every line between BEGIN and END

              1. Replace each sensor marked `<< YOUR`, check the configuration
              and reload Template entities
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.p1_meter_power
                    state: unavailable
                  - condition: state
                    entity: sensor.p1_meter_power
                    state: unknown
          - type: markdown
            content: >-
              <ha-alert title="Grid Power Sensor"
              alert-type="success"><br>Configured</ha-alert>
            visibility:
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - type: heading
            icon: mdi:pen
            heading: Open file editor
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /core_configurator
          - type: markdown
            content: '### Step 3'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="Setup Node-RED"><br> Import and deploy <font
              color=red>Node-RED</font> scripts.</ha-alert>
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state_not: 'on'
          - type: markdown
            content: >-
              <ha-alert title="Node-RED" alert-type="success"><br>Configured and
              script deployed</ha-alert>
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
          - type: markdown
            text_only: true
            content: '### Step 4'
          - type: markdown
            text_only: true
            content: >-
              {% set s =
              states('input_select.house_battery_strategy_dynamic_data_source')
              %}{% if s in ['None', 'unknown', 'unavailable'] %}<ha-alert
              title="Choose a tariff data source">Dynamic, Charge Deadline and
              the price guard need prices. Choose your source, and with Grid
              Clock your supplier.</ha-alert>{% else %}<ha-alert
              alert-type="success" title="Tariff data source"><br>{{ s
              }}</ha-alert>{% endif %}
          - type: heading
            heading: Open Prices
            heading_style: subtitle
            icon: mdi:pen
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/prices
          - type: markdown
            content: '### Step 5'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="(Optional) review power limits"><br> Use limits
              and peak shaving to reduce <font color=darkblue>peaks and overload
              risk</font>.</ha-alert>
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state_not: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state_not: 'on'
          - type: heading
            icon: mdi:cog-outline
            heading: Review power limits
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/phases
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state_not: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state_not: 'on'
          - type: markdown
            content: >-
              <ha-alert title="Power limits" alert-type="success"><br> Batteries
              will help prevent peaks and overloads, when able.</ha-alert>
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state: 'on'
          - type: markdown
            text_only: true
            content: '### Step 6'
          - type: markdown
            text_only: true
            content: >-
              {% set t = states('input_text.house_battery_notify_targets') %}{%
              if t in ['', 'unknown', 'unavailable'] %}<ha-alert
              title="(Optional) Notifications">Every notification now goes to
              <code>notify.notify</code>. Set your notify targets below and send
              a test.</ha-alert>{% else %}<ha-alert alert-type="success"
              title="Notifications"><br>Sent to {{ t }}</ha-alert>{% endif %}
          - type: markdown
            content: '### Step 7'
            text_only: true
          - type: markdown
            content: >-
              Set the Master Battery Control to `Full Control` only after
              reviewing and checking all installation instructions. 


              Pick a battery charging strategy e.g. `self-consumption`, choose
              controller sensitivity `very safe` and you are done!
          - type: markdown
            text_only: true
            content: '### Step 8'
          - type: markdown
            text_only: true
            content: >-
              {% set s = states('sensor.hbc_self_test_status') %}{% if s in
              ['ok', 'warning'] %}<ha-alert alert-type="success"
              title="Self-test">Last result: {{ s }}</ha-alert>{% elif s ==
              'running' %}<ha-alert title="Self-test">Running…</ha-alert>{% else
              %}<ha-alert title="Run the self-test">With Full control on, run
              the self-test on the Batteries view (Battery phase test): it
              checks the setup and measures the phase of every
              battery.</ha-alert>{% endif %}
          - type: heading
            heading: Open Batteries
            heading_style: subtitle
            icon: mdi:pen
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/batteries
          - type: markdown
            content: '### Done'
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - show_name: false
            show_icon: true
            type: button
            entity: input_boolean.house_battery_control_onboarding_finished
            grid_options:
              columns: 2
              rows: 1
            icon: mdi:eye-off-outline
            hold_action:
              action: toggle
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
            icon_height: 25px
          - type: markdown
            text_only: true
            grid_options:
              columns: 9
              rows: 1
            content: |-
              ---
              Hide onboarding
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - type: markdown
            content: >-
              _Finishing hides this checklist and the setup banner on the
              Overview. Show them again with **Show/Hide onboarding**._
            grid_options:
              columns: full
              rows: auto
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
        visibility:
          - condition: state
            entity: input_boolean.house_battery_control_onboarding_finished
            state_not: 'on'
      - type: grid
        cards:
          - type: heading
            heading: Setup
            heading_style: title
            icon: mdi:cog-outline
            grid_options:
              rows: 1
          - type: markdown
            text_only: true
            content: >-
              <font color=grey>Setup is finished. *Show/Hide onboarding* brings
              the checklist back here, and the setup banner on the
              Overview.</font>
          - type: tile
            entity: input_boolean.house_battery_control_onboarding_finished
            name: Show/Hide onboarding
            icon: mdi:eye-off-outline
            color: disabled
            show_entity_picture: false
            hide_state: true
            vertical: false
            tap_action:
              action: toggle
            features_position: bottom
            grid_options:
              columns: full
        visibility:
          - condition: state
            entity: input_boolean.house_battery_control_onboarding_finished
            state: 'on'
      - type: grid
        cards:
          - type: heading
            heading: Phase guard settings
            heading_style: title
            icon: mdi:sine-wave
            grid_options:
              rows: 1
              columns: 12
          - type: heading
            icon: mdi:information
            heading: Limits and battery selection per phase
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#configuration-reference
          - type: entities
            entities:
              - entity: input_select.house_battery_phase_guard_mode
              - entity: input_select.house_battery_phase_sharing
              - entity: input_number.house_battery_phase_limit_w
              - entity: input_number.house_battery_phase_circuit_limit_w
              - entity: input_number.house_battery_phase_margin_w
              - entity: input_select.house_battery_phase_selection
              - entity: input_number.house_battery_phase_switch_soc_delta
              - entity: input_number.house_battery_phase_min_dwell
              - entity: sensor.house_battery_installed_max_charge_power
                name: Installed max charge (all batteries)
              - entity: input_number.house_battery_total_max_charge_power
                name: Max charge HBC+ reports to planners
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Notifications
            heading_style: title
            icon: mdi:cellphone-message
            grid_options:
              rows: 1
          - type: markdown
            content: >-
              <font color=grey>Every HBC+ notification goes to the notify
              actions below, comma-separated (e.g. `notify.mobile_app_<phone>`).
              Empty = `notify.notify`. Send a test after changing the field: a
              typo in the name gives no notification, only an error in the HA
              log.</font>
            text_only: true
          - type: entities
            entities:
              - entity: input_text.house_battery_notify_targets
                name: Notify targets
              - type: button
                name: Send a test notification
                icon: mdi:send
                action_name: Test
                tap_action:
                  action: perform-action
                  perform_action: script.hbc_notify
                  data:
                    title: 'HBC+: test'
                    message: Test notification from the Settings view.
      - type: grid
        cards:
          - type: heading
            heading: EV Stop Trigger
            heading_style: title
            icon: mdi:power-plug-off
            grid_options:
              rows: 1
          - type: markdown
            content: >-
              <font color=grey>The Stop Trigger will OVERRULE ALL active
              strategies.

              _E.g. use to disengage your home batteries when EV is
              charging_</font>
            text_only: true
          - type: entities
            entities:
              - entity: input_text.house_battery_strategy_ev_sensor_entity_id
                secondary_info: none
              - entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                name: Trigger strategy
          - type: markdown
            content: >-
              <font color=grey>Enter the `entity_id` of an `input_boolean` or
              `on/off template_sensor` in the field above. Choose whether an
              active trigger should fully stop the batteries or keep them in
              standby for peak shaving.</font>
            text_only: true
          - type: tile
            grid_options:
              columns: full
            entity: sensor.ev_is_charging
            name: EV stop trigger
            vertical: false
            features_position: bottom
          - type: markdown
            content: >-
              <font color=grey>The `EV stop trigger` should now indicate whether
              the trigger is active. Stop trigger 'on' = selected trigger
              strategy is applied.</font>
            text_only: true
    max_columns: 4
  - type: sections
    title: Logging
    icon: mdi:spider-outline
    path: problem-solver
    background:
      opacity: 10
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Node-RED
            heading_style: title
            grid_options:
              rows: 1
          - type: heading
            icon: mdi:list-status
            heading: 🕵️ Flow trace
            heading_style: subtitle
          - type: markdown
            content: >-
              **Strategy:** {{ states('input_select.house_battery_strategy')}}

              ***

              {% set history = state_attr('sensor.home_battery_control_trace',
              'history') or [] %} {% set start_ts =
              state_attr('sensor.home_battery_control_trace', 'start') %} {% set
              end_ts = state_attr('sensor.home_battery_control_trace', 'end') %}
              {% set start_dt = (start_ts / 1000) | as_datetime if start_ts is
              number else as_datetime(start_ts) %} {% set end_dt = (end_ts /
              1000) | as_datetime if end_ts is number else as_datetime(end_ts)
              %} {% set total_dt = (end_dt - start_dt).total_seconds() if end_dt
              and start_dt else 0 %}

              Flows used

              | Step | Flow | Duration |

              | :--- | :--- | :--- |

              {% set first_ts = history[0].timestamp if history|length > 0 else
              end_ts %} {% set first_dt = (first_ts / 1000) | as_datetime if
              first_ts is number else as_datetime(first_ts) %} {% set d0 =
              (first_dt - start_dt).total_seconds() if first_dt and start_dt
              else 0 %} | 0 | Home battery start | `{{ "{:.3f}".format(d0) }}s`
              |

              {% for entry in history -%}
                {%- set ts = entry.timestamp -%}
                {%- set current_dt = (ts / 1000) | as_datetime if ts is number else as_datetime(ts) -%}
                {%- if not loop.last -%}
                  {%- set next_ts = history[loop.index].timestamp -%}
                {%- else -%}
                  {%- set next_ts = end_ts -%}
                {%- endif -%}    
                {%- set next_dt = (next_ts / 1000) | as_datetime if next_ts is number else as_datetime(next_ts) -%}
                {%- set delta = (next_dt - current_dt).total_seconds() if next_dt and current_dt else 0 -%}
                | {{ loop.index }} | {{ entry.flow }} | `{{ "{:.3f}".format(delta) }}s` |
              {% endfor %} | ✔️ | Home Battery Start | `Done` |


              **Total `{{ "{:.3f}".format(total_dt) }}s`** spent in strategy
              flows
      - type: grid
        cards:
          - type: heading
            heading: Insights
            heading_style: title
            grid_options:
              rows: 1
            icon: batterijplan:info
          - type: heading
            icon: mdi:list-box-outline
            heading: 📋 Explanations (last 100 items)
            heading_style: subtitle
          - type: markdown
            content: >
              {% set logs = state_attr('sensor.home_battery_control_log', 'log')
              %}  {% if logs %}

              | Time |  | Flow | Node | Explanation |

              | :--- | :--- | :--- | :--- | :--- |
                {%- for entry in logs %}
                {%- set color = '#009ac7' -%}
                {%- if entry.level == 'log' %}{% set color = '#38cd9e' -%}
                {%- elif entry.level == 'warn' %}{% set color = 'orange' -%}
                {%- elif entry.level == 'error' %}{% set color = 'red' -%}
                {%- endif %}
                | {{ entry.timestamp }} | {{ entry.icon }} |<font color="{{color}}">{{ entry.flow }}</font> | {{ entry.node }} |{{ entry.payload }} |
                {%- endfor %}
              {% else %}
                No logs available
              {% endif %}
            grid_options:
              columns: full
        column_span: 2
    header:
      card:
        type: markdown
        text_only: true
        content: >-
          ### Logging

          Need help figuring out what is going on? 

          Hit **Insights mode**. _Auto-off after 5min._

          📘 [Troubleshooting
          documentation](https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#troubleshooting)
      layout: center
      badges_position: top
      badges_wrap: scroll
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_health
        name: Health
        icon: mdi:stethoscope
        show_entity_picture: false
        card_mod:
          style:
            ha-badge:
              $: |
                .badge {
                  border: 2px solid {{ 'var(--success-color)' if is_state('sensor.hbc_health', 'ok') else 'var(--error-color)' }} !important;
                }
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: input_boolean.house_battery_control_is_debug_mode
        tap_action:
          action: toggle
        name: Live
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_select.house_battery_strategy
        name: Choose strategy
        tap_action:
          action: more-info
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: input_text.house_battery_strategy_active_sub_strategy
        show_entity_picture: false
        name: Executing
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_time
        show_entity_picture: false
        name: Time
        tap_action:
          action: none
    cards: []
    max_columns: 3
