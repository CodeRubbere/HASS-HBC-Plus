views:
  - type: sections
    path: home-battery-control
    title: Overview
    icon: mdi:home
    max_columns: 3
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_health
        name: Health
        icon: mdi:stethoscope
        show_entity_picture: false
        card_mod:
          style:
            ha-badge:
              $: |
                .badge {
                  border: 2px solid {{ 'var(--success-color)' if is_state('sensor.hbc_health', 'ok') else 'var(--error-color)' }} !important;
                }
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.hbc_time
        show_entity_picture: false
        name: Time
        tap_action:
          action: none
    header:
      card:
        type: markdown
        text_only: true
        content: >-
          <center><img src="/local/hbc-plus/hbc-plus-dashboard.svg?v=v1.4"
          alt="HBC+ Home Battery Control Plus" height="72"><br>v1.4</center>
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Status & control
            heading_style: title
            icon: mdi:gamepad-variant-outline
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_update_available
                state: 'on'
            content: >-
              {%- set u = 'binary_sensor.hbc_update_available' -%}
              <ha-alert alert-type="info" title="HBC+ v{{ state_attr(u,
              'latest') }} is available">You run v{{ state_attr(u, 'installed')
              }}. The release notes say what is new and how to update.</ha-alert>


              [Open release notes]({{ state_attr(u, 'release_url') }})
          - type: markdown
            text_only: true
            content: >-
              {%- set checks = [
                states('input_number.house_battery_count') | int(0) > 0,
                states('sensor.p1_meter_power') not in ['unknown', 'unavailable'],
                is_state('input_boolean.house_battery_control_has_node_red', 'on'),
                states('input_select.house_battery_strategy_dynamic_data_source') not in ['None', 'unknown', 'unavailable'],
                is_state('input_select.marstek_master_battery_mode', 'Full control'),
                states('sensor.hbc_self_test_status') in ['ok', 'warning'] ] -%}
              <ha-alert alert-type="info" title="Setup: {{ checks | select |
              list | count }} of {{ checks | count }} steps done">Finish the
              setup on the Settings view.</ha-alert>


              [Open Settings](/home-battery-control-plus/advanced-settings)
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_onboarding_finished
                state_not: 'on'
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state: 'on'
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            content: >-
              {%- set t = states('sensor.hbc_last_run') | as_datetime(None) -%}
              {%- set p1 = states.sensor.p1_meter_power -%} {%- set p1_ok = p1
              is not none and p1.state not in ['unknown', 'unavailable', ''] -%}
              {%- set p1_at = (p1.last_reported if p1 is not none and
              p1.last_reported is defined and p1.last_reported else
              (p1.last_updated if p1 is not none else none)) -%} {%- set
              p1_stale = not p1_ok or p1_at is none or (now() -
              p1_at).total_seconds() > 300 -%} <ha-alert alert-type="error"
              title="HBC+ is not steering the batteries"><br>No good control
              cycle {{ 'for ' ~ relative_time(t) if t else 'since Home Assistant
              started' }}. Home Assistant has handed the batteries back to their
              own firmware. {% if p1_stale -%} {%- if not p1_ok -%} The P1 meter
              (sensor.p1_meter_power) is {{ p1.state if p1 is not none else
              'missing' }}. {%- else -%} No new P1 meter value since {{
              as_local(p1_at).strftime('%H:%M') }} (last {{ p1.state }} W). {%-
              endif %} HBC+ only runs on P1 updates: check the P1 meter and its
              integration in Home Assistant. {%- else -%} Check that Node-RED
              runs. {%- endif %}</ha-alert>


              [Open Logging](/home-battery-control-plus/problem-solver)
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: sensor.hbc_health
                state:
                  - warning
                  - error
            content: >-
              {%- set h = 'sensor.hbc_health' -%} {%- set e = state_attr(h,
              'errors_10m') | int(0) -%} {%- set w = state_attr(h,
              'warnings_10m') | int(0) -%} {%- set last = state_attr(h,
              'last_error') if e > 0 else state_attr(h, 'last_warning') -%} {%-
              set ea = (state_attr(h, 'last_error_at') or '') |
              as_datetime(None) -%} {%- set wa = (state_attr(h,
              'last_warning_at') or '') | as_datetime(None) -%} {%- set at = ea
              if e > 0 else wa -%} {%- set newest = ([ea, wa] | select | max) if
              (ea or wa) else None -%} {%- set quiet = newest is not none and
              (now() - newest).total_seconds() > 90 -%} {%- set hint =
              state_attr(h, 'hint') or '' -%} {%- set what = 'errors' if e > 0
              else 'warnings' -%}

              {%- if quiet -%} <ha-alert alert-type="info" title="No new HBC+ {{
              what }} since {{ (newest | as_local).strftime('%H:%M')
              }}"><br>This notice clears by itself around {{ ((newest +
              timedelta(minutes=10)) | as_local).strftime('%H:%M') }}. In the
              last 10 minutes: {{ e }} error{{ 's' if e != 1 }} and {{ w }}
              warning{{ 's' if w != 1 }}. Latest: <i>{{ last | e }}</i>{% if
              hint %}<br><b>Fix:</b> {{ hint | e }}{% endif %}</ha-alert>

              {%- else -%} <ha-alert alert-type="{{ 'error' if is_state(h,
              'error') else 'warning' }}" title="{{ 'HBC+ keeps logging errors'
              if is_state(h, 'error') else 'HBC+ logged a problem' }}">{{ e }}
              error{{ 's' if e != 1 }} and {{ w }} warning{{ 's' if w != 1 }} in
              the last 10 minutes. Latest{{ ' (' ~ relative_time(at) ~ ' ago)'
              if at else '' }}: <i>{{ last | e }}</i>{% if hint
              %}<br><b>Fix:</b> {{ hint | e }}{% endif %}<br><small>Fixed the
              cause? This notice clears by itself after 10 minutes without new
              errors or warnings.</small></ha-alert>

              {%- endif %}


              [Open Logging](/home-battery-control-plus/problem-solver)
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_phase_limit_exceeded
                state: 'on'
            content: >-
              {% set lim = states('input_number.house_battery_phase_limit_w') |
              float(3680) %} <ha-alert alert-type="error" title="Phase fuse
              overloaded"><br>Grid power on {% for i in [1, 2, 3] if
              states('sensor.p1_meter_power_phase_' ~ i) | float(0) | abs > lim
              %}L{{ i }} {% endfor %} is above {{ lim | int }} W. Check house
              load and the active batteries.</ha-alert>


              [Open Phase guard](/home-battery-control-plus/phases)
          - type: markdown
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_phase_circuit_limit_exceeded
                state: 'on'
            content: >-
              {% set circ =
              states('input_number.house_battery_phase_circuit_limit_w') |
              float(3680) %} <ha-alert alert-type="error" title="Battery circuit
              overloaded"><br>The batteries on {% for i in [1, 2, 3] if
              states('sensor.hbc_phase_l' ~ i ~ '_battery_power') | float(0) |
              abs > circ %}L{{ i }} {% endfor %} draw more than {{ circ | int }}
              W. Check that only one battery per phase runs
              (Enforce).</ha-alert>


              [Open Phase guard](/home-battery-control-plus/phases)
          - type: tile
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.ev_is_charging
                state: 'on'
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
              - condition: state
                entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                state: Full stop
            entity: sensor.ev_is_charging
            name: EV is charging - Full Stop strategy is active
            color: red
            hide_state: true
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.ev_is_charging
                state: 'on'
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
              - condition: state
                entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                state: Standby / peak shave
            entity: sensor.ev_is_charging
            name: EV is charging - Standby / peak shave strategy is active
            color: amber
            hide_state: true
            vertical: false
            features_position: bottom
          - type: heading
            icon: mdi:cash-remove
            heading: >-
              No energy prices: Dynamic runs its baseline strategy. Check the
              tariff source
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/prices
            visibility:
              - condition: state
                entity: binary_sensor.hbc_price_data_missing
                state: 'on'
          - type: heading
            icon: mdi:alert
            heading: 'Dynamic strategy: Full Stop. Choose a tariff data source'
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/prices
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy_dynamic_data_source
                state: None
              - condition: state
                entity: input_select.house_battery_strategy
                state: Dynamic
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - features:
              - type: select-options
            type: tile
            entity: input_select.marstek_master_battery_mode
            features_position: bottom
            vertical: false
            show_entity_picture: false
            hide_state: true
            name: Control Mode
            icon: mdi:camera-control
          - type: tile
            entity: input_select.house_battery_strategy
            name: Choose strategy
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: select-options
                options:
                  - Full stop
                  - Self-consumption
                  - Timed
                  - Dynamic
                  - Charge
                  - Charge PV
                  - Charge Deadline
                  - Sell
                  - Zero import
                  - Standby / peak shave
                  - Helios
            features_position: bottom
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - type: markdown
            text_only: true
            content: >-
              <ha-alert alert-type="info" title="Managed by HELIOS"> Strategy
              <b>Helios</b> is selected.</br>

              The HELIOS flow decides when the batteries charge, discharge or
              hold, not HBC+. If no HELIOS flow is installed, HBC+ runs Full
              stop instead. Choose another strategy to hand control back to
              HBC+.</ha-alert>
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy
                state: Helios
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: heading
            icon: mdi:battery-sync
            heading: Managed by HELIOS Optimizer (Live)
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /helios-optimizer
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy
                state: Helios
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: markdown
            content: >-
              {%- set a = state_attr('sensor.batterijplan', 'actie') -%} {%- set
              t = {'L': 'charge from the grid', 'O': 'discharge', 'H': 'hold',
              'V': 'feed in', 'Z': 'solar only'} -%} <ha-alert alert-type="info"
              title="Managed by Batterijplan (Live)"> Now: <b>{{ t.get(a, 'no
              plan yet') }}</b>.</br>

              Batterijplan sets the Dynamic modes every quarter; your own modes
              come back when Batterijplan Live goes off or you leave HBC+
              Dynamic. {%- if state_attr('sensor.batterijplan_zon_voor_hbc',
              'modus') == 'laaddoel' %} HBC+'s solar forecast is replaced by
              Batterijplan's charge target. {%- endif %}</ha-alert>
            text_only: true
            visibility:
              - condition: state
                entity: binary_sensor.hbc_managed_by_batterijplan
                state: 'on'
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: heading
            icon: mdi:battery-sync
            heading: Dynamic · managed by Batterijplan (Live)
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /batterijplan
            visibility:
              - condition: state
                entity: binary_sensor.hbc_managed_by_batterijplan
                state: 'on'
              - condition: state
                entity: binary_sensor.hbc_heartbeat_stale
                state_not: 'on'
          - type: markdown
            content: >-
              **✋ Held by:** {% for h in state_attr('sensor.hbc_strategy_holds',
              'holds') or [] if h.active %}{{ h.requester }} ({{ h.strategy }}{{
              ', until ' ~ h.expires if h.expires }}){{ ', ' if not loop.last
              }}{% endfor %}. Your choice: {{
              state_attr('sensor.hbc_strategy_holds', 'base') }}.
            visibility:
              - condition: numeric_state
                entity: sensor.hbc_strategy_holds
                above: 0
          - type: markdown
            content: >-
              **⚡ Price guard:** {{ state_attr('sensor.hbc_price_guard',
              'action') }} {%- set u = state_attr('sensor.hbc_price_state',
              'until') -%} {%- if u %} until {{ as_timestamp(u) |
              timestamp_custom('%H:%M') }}{% endif %} ({{ {'export_negative':
              'feeding in costs money',
                  'import_negative': 'you are paid to import'}.get(states('sensor.hbc_price_state'), 'low prices') }})
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/prices
            visibility:
              - condition: state
                entity: sensor.hbc_price_guard
                state: override
          - type: heading
            icon: mdi:information-slab-circle
            heading: 'About strategies '
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#choosing-a-strategy
          - type: entities
            entities:
              - entity: input_text.house_battery_strategy_active_sub_strategy
                type: simple-entity
                name: Executing (flow)
            grid_options:
              columns: 12
              rows: auto
            show_header_toggle: false
            state_color: false
            no_background: true
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - type: history-graph
            entities:
              - entity: input_select.house_battery_strategy
                name: Chosen strategy
              - entity: input_text.house_battery_strategy_active_sub_strategy
                name: Executing
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            hours_to_show: 12
          - type: markdown
            content: |-
              <font color="grey">

              #### Your energy and battery usage</font>
            text_only: true
          - type: history-graph
            entities:
              - entity: input_number.house_battery_control_pid_output
                name: PID control
              - entity: sensor.p1_meter_power
                name: Grid power
              - entity: select.marstek_m1_forcible_charge_discharge
                name: M1
              - entity: select.marstek_m2_forcible_charge_discharge
                name: M2
              - entity: select.marstek_m3_forcible_charge_discharge
                name: M3
              - entity: select.marstek_m4_forcible_charge_discharge
                name: M4
              - entity: select.marstek_m5_forcible_charge_discharge
                name: M5
              - entity: select.marstek_m6_forcible_charge_discharge
                name: M6
            hours_to_show: 0.05
      - type: grid
        cards:
          - type: heading
            heading: Now
            heading_style: title
            icon: mdi:flash
          - type: tile
            grid_options:
              columns: full
              rows: 1
            entity: sensor.battery_time_remaining
            name: Battery remaining energy
            icon: mdi:battery-clock
            show_entity_picture: false
            hide_state: false
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.p1_meter_power
            name: Grid power
            vertical: false
            show_entity_picture: false
            grid_options:
              columns: 6
            icon: mdi:transmission-tower
          - type: tile
            grid_options:
              columns: 6
            entity: sensor.house_total_battery_power
            name: Battery power
            icon: mdi:home-battery
            show_entity_picture: false
            vertical: false
            features_position: bottom
          - type: heading
            heading: Last 24 hours
            heading_style: subtitle
            grid_options:
              rows: 1
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.p1_meter_power
                name: Grid power
              - entity: sensor.house_total_battery_power
                name: Batteries
          - type: heading
            heading: Info and guides
            heading_style: title
            icon: mdi:book-open-page-variant
          - type: heading
            icon: mdi:book-open-variant
            heading: User guide (English)
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md
          - type: heading
            icon: mdi:book-open-variant
            heading: Gebruikershandleiding (Nederlands)
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md
          - type: heading
            icon: mdi:spider
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/problem-solver
            heading: Logging
          - type: markdown
            content: -----
            text_only: true
          - type: heading
            icon: mdi:star-check-outline
            heading: Do you like HBC+? Consider giving it a star
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus
          - type: markdown
            content: >-
              [![GitHub
              stars](https://img.shields.io/github/stars/CodeRubbere/HASS-HBC-Plus?style=social)](https://github.com/CodeRubbere/HASS-HBC-Plus)
            text_only: true
      - type: grid
        cards:
          - type: heading
            heading: Batteries
            heading_style: title
            icon: mdi:home-battery
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/batteries
          - type: heading
            heading: Marstek M1
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: state
                entity: sensor.marstek_m1_device_name
                state_not: unknown
          - type: glance
            entities:
              - entity: sensor.marstek_m1_battery_state_of_charge
                name: M1 SoC
              - entity: sensor.marstek_m1_ac_power
                name: M1 Power
              - entity: number.marstek_m1_max_charge_power
              - entity: number.marstek_m1_max_discharge_power
              - entity: input_select.marstek_m1_phase
            visibility:
              - condition: state
                entity: sensor.marstek_m1_device_name
                state_not: unknown
          - type: heading
            heading: Marstek M2
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m2_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 1
          - type: glance
            entities:
              - entity: sensor.marstek_m2_battery_state_of_charge
                name: M2 SoC
              - entity: sensor.marstek_m2_ac_power
                name: M2 Power
              - entity: number.marstek_m2_max_charge_power
              - entity: number.marstek_m2_max_discharge_power
              - entity: input_select.marstek_m2_phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m2_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 1
          - type: heading
            heading: Marstek M3
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m3_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 2
          - type: glance
            entities:
              - entity: sensor.marstek_m3_battery_state_of_charge
                name: M3 SoC
              - entity: sensor.marstek_m3_ac_power
                name: M3 Power
              - entity: number.marstek_m3_max_charge_power
              - entity: number.marstek_m3_max_discharge_power
              - entity: input_select.marstek_m3_phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m3_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 2
          - type: heading
            heading: Marstek M4
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m4_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 3
          - type: glance
            entities:
              - entity: sensor.marstek_m4_battery_state_of_charge
                name: M4 SoC
              - entity: sensor.marstek_m4_ac_power
                name: M4 Power
              - entity: number.marstek_m4_max_charge_power
                name: Max Charge
              - entity: number.marstek_m4_max_discharge_power
                name: Max Discharge
              - entity: input_select.marstek_m4_phase
                name: Phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m4_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 3
          - type: heading
            heading: Marstek M5
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m5_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 4
          - type: glance
            entities:
              - entity: sensor.marstek_m5_battery_state_of_charge
                name: M5 SoC
              - entity: sensor.marstek_m5_ac_power
                name: M5 Power
              - entity: number.marstek_m5_max_charge_power
                name: Max Charge
              - entity: number.marstek_m5_max_discharge_power
                name: Max Discharge
              - entity: input_select.marstek_m5_phase
                name: Phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m5_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 4
          - type: heading
            heading: Marstek M6
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m6_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 5
          - type: glance
            entities:
              - entity: sensor.marstek_m6_battery_state_of_charge
                name: M6 SoC
