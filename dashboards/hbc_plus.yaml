            name: Today
            icon: mdi:calendar-today
            vertical: true
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.hbc_savings_month
            name: This month
            icon: mdi:calendar-month
            vertical: true
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.hbc_savings_year
            name: This year
            icon: mdi:calendar
            vertical: true
            grid_options:
              columns: 4
          - type: markdown
            content: >-
              <font color=grey>What your energy cost with the batteries,
              compared with what it would have cost without them, quarter by
              quarter at that quarter's buy and sell price. Fixed costs are left
              out. Today with batteries €{{
              states('sensor.hbc_cost_with_battery_today') | float(0) | round(2)
              }}, without €{{ states('sensor.hbc_cost_without_battery_today') |
              float(0) | round(2) }}. {%- set m =
              state_attr('sensor.hbc_savings_total', 'quarters_missing') |
              int(0) -%} {%- if m > 0 %} {{ m }} quarters could not be valued
              (HA down or no price).{% endif %}</font>
            text_only: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cost per day, last 30 days
            heading_style: title
            icon: mdi:chart-bar
          - type: statistics-graph
            entities:
              - entity: sensor.hbc_cost_without_battery_total
                name: Without batteries
              - entity: sensor.hbc_cost_with_battery_total
                name: With batteries
            stat_types:
              - change
            period: day
            days_to_show: 30
            chart_type: bar
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Round-trip efficiency
            heading_style: title
            icon: mdi:battery-sync
          - type: entities
            entities:
              - entity: sensor.hbc_round_trip_efficiency
                name: Measured over 7 days
              - entity: sensor.hbc_suggested_minimum_spread
                name: Suggested Minimum spread
              - entity: input_number.house_battery_strategy_dynamic_threshold_delta
                name: Current Minimum spread
              - entity: input_number.house_battery_wear_cost
                name: Wear cost
              - entity: input_boolean.house_battery_dynamic_use_efficiency
                name: Dynamic uses measured efficiency
              - type: button
                name: Use the suggestion
                icon: mdi:cash-check
                action_name: Apply
                tap_action:
                  action: perform-action
                  perform_action: script.hbc_apply_suggested_spread
          - type: markdown
            content: >-
              {%- set w = state_attr('sensor.hbc_round_trip_efficiency',
              'warning') -%} <font color=grey>Energy out plus the change in
              stored energy, divided by energy in, measured at the battery's AC
              side.


              The suggestion is the spread at which a charge/discharge cycle
              still pays: the loss on the expensive quarters plus the wear cost,
              rounded up. 


              With *Dynamic uses measured efficiency* on, Dynamic takes the loss
              out itself (efficiency × high − low) and the suggestion is the
              wear cost only.{% if w %} ⚠️ {{ w }}.{% endif %}</font>
