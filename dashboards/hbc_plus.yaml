              - type: markdown
                text_only: true
                content: >-
                  {%- set a = state_attr('sensor.batterijplan', 'actie') -%} {%-
                  set items = [('L', '#3b82f6', 'Charge from grid'), ('O',
                  '#22c55e', 'Discharge'), ('H', '#f59e0b', 'Hold'), ('V',
