                    ha-card { padding: 12px 16px 0 16px !important; }
              - type: custom:apexcharts-card
                card_mod:
                  style: >
                    ha-card { background: none !important; border: none
                    !important; box-shadow: none !important; }
                header:
                  show: false
                graph_span: 48h
                span:
                  start: day
                stacked: false
                now:
                  show: true
                  color: '#009ac7'
                  label: Now
                apex_config:
                  noData:
                    text: No Data Available
                    align: center
                    verticalAlign: middle
                    style:
                      fontSize: 16px
                  plotOptions:
                    bar:
                      borderRadius: 2
                      columnWidth: 90%
                  legend:
                    show: true
                    position: top
                  xaxis:
                    type: datetime
                    labels:
                      datetimeUTC: false
                      format: HH:mm
                      rotate: -45
                      rotateAlways: true
                  yaxis:
                    decimalsInFloat: 0
                    title:
                      text: cent / kWh
                  tooltip:
                    shared: true
                    intersect: false
                    x:
                      format: ddd dd MMM HH:mm
                series:
                  - entity: sensor.hbc_energy_prices_data
                    name: Buy
                    type: column
                    color: '#9e9e9e'
                    float_precision: 1
                    show:
                      legend_value: false
                    data_generator: >
                      const marks = entity.attributes.marks || [];

                      // HBC+ v1.2: purple = feeding in costs money, dark purple
                      = paid to import

                      const colours = { high: '#ff9800', low: '#4caf50' };

                      const negColours = { export: '#9c27b0', import: '#4a148c'
                      };

                      const now = Date.now();

                      return marks.map(iv => {
                        const s = new Date(iv.start).getTime();
                        const e = new Date(iv.end).getTime();
                        return {
                          x: s,
                          y: iv.price,
                          fillColor: (now >= s && now < e)
                            ? '#009ac7'
                            : (negColours[iv.neg] || colours[iv.mark] || '#9e9e9e')
                        };
                      });
                  - entity: sensor.hbc_energy_prices_data
                    name: Sell
                    type: line
                    color: '#455a64'
                    stroke_width: 2
                    curve: stepline
                    float_precision: 1
                    show:
                      legend_value: false
                    data_generator: >
                      // HBC+ v1.2: only when there are separate sell prices
                      (Grid Clock feed)

                      const marks = entity.attributes.marks || [];

                      if (!marks.some(iv => iv.sell !== undefined && iv.sell !==
                      null && iv.sell !== iv.price)) return [];

                      return marks.map(iv => ({ x: new Date(iv.start).getTime(),
                      y: iv.sell }));
