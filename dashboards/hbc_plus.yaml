          action: none
    header:
      layout: center
      badges_position: top
      badges_wrap: scroll
      card:
        type: markdown
        text_only: true
        content: >
          ### Charge & Sell


          **Charge** and **Sell** run your batteries until a goal is reached,
          then switch to the strategy you choose.

          **Charge Deadline** reaches its goal before a set time.

          _Choose them yourself, or let Timed and Dynamic switch to them..._
