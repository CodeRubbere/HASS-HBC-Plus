            icon: mdi:alert-circle-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            icon_tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
