          - type: markdown
            content: >-
              {%- set e = 'sensor.hbc_round_trip_efficiency' -%} {%- set w =
              state_attr(e, 'warning') -%} {%- set n = state_attr(e, 'days') |
              count if state_attr(e, 'days') else 0 -%} {%- if w -%} {%- if
              w.startswith('collecting data') -%} {%- set due = (now() +
              timedelta(days=8 - n)).strftime('%-d %b') -%} ⏳ **Status:**
              collecting data, {{ n }} of 8 daily snapshots. The first value
              comes on {{ due }} at 00:05. {%- else -%} ⚠️ **Status:** {{ w[0] |
              upper }}{{ w[1:] }}. {%- endif -%} {%- else -%} ✅ **Status:**
              measured over the last 7 days. {%- endif %}


              <font color=grey>Energy out plus the change in stored energy,
              divided by energy in, measured at the battery's AC side. HBC+
              saves one snapshot a day at 00:05 and needs 8 of them (7 days)
              before it shows a value.


              The suggestion is the spread at which a charge/discharge cycle
              still pays: the loss on the expensive quarters plus the wear cost,
              rounded up. 


              With *Dynamic uses measured efficiency* on, Dynamic takes the loss
              out itself (efficiency × high − low) and the suggestion is the
              wear cost only.</font>
