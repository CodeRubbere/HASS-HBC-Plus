          cutoffs and max power.
    cards: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Battery life
            heading_style: title
            icon: mdi:medication
          - type: heading
            icon: mdi:information
            heading: Charging order
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#advanced-settings
          - type: tile
            entity: input_number.house_battery_control_prioritize_battery
            name: Charges first (battery)
            icon: mdi:battery-arrow-up
            vertical: false
            grid_options:
              columns: full
              rows: 1
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: tile
            entity: input_select.house_battery_control_priority_change_interval
            name: Rotation
            icon: mdi:battery-clock
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            features:
              - type: select-options
            features_position: inline
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            text_only: true
            content: >-
              <font color=grey>The batteries charge in turn, starting with this
              one. <i>Rotation</i> moves the start to the next battery every 30
              minutes (<i>Auto balance</i>), daily or weekly at 02:00, or
              never.</font>
          - type: heading
            icon: mdi:information
            heading: Idle and switching
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#advanced-settings
          - type: tile
            entity: input_number.house_battery_control_idle_time
            name: Stop after idle
            icon: mdi:timer-sand
            vertical: false
            grid_options:
              columns: full
              rows: 1
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: tile
            entity: input_number.house_battery_control_hysteresis_in_w
            name: Hysteresis
            icon: mdi:swap-vertical
            vertical: false
            grid_options:
              columns: full
              rows: 1
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            text_only: true
            content: >-
              <font color=grey><i>Stop after idle</i>: how long a battery that
              is not needed keeps its relay closed (1 W) before it stops. 0
              stops at once; longer saves relay clicks when the load goes up and
              down.<br> <i>Hysteresis</i>: how far the control output must pass
              0 W before the batteries switch between charging and discharging.
              0 switches at once; higher switches less often.</font>
      - type: grid
        cards:
          - type: heading
            heading: Battery phase test
            heading_style: title
            icon: mdi:clipboard-check-outline
          - type: heading
            icon: mdi:information
            heading: Check the setup and the phase map
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#setup-self-test
          - type: markdown
            text_only: true
            content: >-
              <font color=grey>Checks the setup and measures each battery's
              phase. It never changes your phase map by itself.</font>
          - type: tile
            entity: script.hbc_selftest_run
            name: Run full test
            icon: mdi:play-circle-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: true
              confirmation:
                text: >-
                  Run the full test? Each battery in turn charges at 800 W,
                  about 1 to 3 minutes per battery; your strategy takes over
                  again afterwards.
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: true
              confirmation:
                text: >-
                  Run the full test? Each battery in turn charges at 800 W,
                  about 1 to 3 minutes per battery; your strategy takes over
                  again afterwards.
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state_not: running
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: tile
            entity: script.hbc_selftest_run
            name: Check setup only
            icon: mdi:clipboard-list-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: false
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: false
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state_not: running
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: tile
            entity: script.hbc_selftest_abort
            name: Stop test
            icon: mdi:stop-circle-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_abort
            icon_tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_abort
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state: running
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            text_only: true
            content: >-
              <font color=grey><small><i>Run full test</i>: each battery charges
              at 800 W, about 1 to 3 minutes per battery. <i>Check setup
              only</i>: no charging.</small></font>
          - type: markdown
            text_only: true
            content: >-
              {%- set st = states('sensor.hbc_self_test_status') -%}

              {%- set c = state_attr('sensor.hbc_self_test_status', 'checks') or
              [] -%}

              {%- set okc = c | selectattr('result', 'eq', 'ok') | list | count
              -%}

              {%- set bad = c | rejectattr('result', 'eq', 'ok') | list -%}

              {%- set p = states('sensor.hbc_self_test_phases') -%}

              {%- set same = state_attr('sensor.hbc_self_test_phases', 'run_id')
              == state_attr('sensor.hbc_self_test_status', 'run_id') -%}

              {%- set bs = state_attr('sensor.hbc_self_test_phases',
              'batteries') or [] -%}

              {%- set f = state_attr('sensor.hbc_self_test_status', 'finished')
              -%}

              {%- set ts = as_timestamp(f, none) if f else none -%}

              {%- set when = '' if ts is none else ((('today ' if ts |
              timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') else ts
              | timestamp_custom('%d-%m ')) ~ ts | timestamp_custom('%H:%M')))
              -%}

              {%- set ptxt = {'ok': 'all batteries on the expected phase',
              'mismatch': 'a battery is on another phase', 'uncertain': 'a phase
              is not certain', 'skipped': 'phase detection skipped',
              'not_started': 'phase detection did not start', 'timeout': 'phase
              detection timed out', 'aborted': 'phase detection stopped',
              'error': 'phase detection failed'}.get(p, '') if same else 'phases
              not measured' -%}

              {%- if st == 'running' -%}

              <ha-alert alert-type="info" title="Test running">{{ 'Measuring
              phases: one battery at a time charges at 800 W.' if
              is_state_attr('sensor.hbc_self_test_status', 'step',
              'phase_detection') else 'Running the checks…' }}</ha-alert>

              {%- elif not c -%}

              <ha-alert alert-type="info" title="Not run yet">Press <b>Run full
              test</b> once after installing or changing batteries.</ha-alert>

              {%- else -%}

              {%- set typ = 'error' if st == 'errors' else ('warning' if st in
              ['warnings', 'aborted'] else 'success') -%}

              <ha-alert alert-type="{{ typ }}" title="{{ okc }} of {{ c | count
              }} checks passed{{ ' · ' ~ ptxt if ptxt }}">{{ ('Last run ' ~
              when) if when else '' }}

              {%- for x in bad %}<br>{{ '❌' if x.result == 'error' else '⚠️' }}
              <b>{{ x.label }}</b>: {{ x.info }}{% endfor %}

              {%- for b in bs if same %}{% set cur =
              states('input_select.marstek_' ~ (b.id | lower) ~ '_phase') %}{%
              if b.measured and cur in ['L1', 'L2', 'L3'] and b.measured != cur
              %}<br>⚠️ <b>{{ b.id }}</b>: phase map {{ cur }}, measured {{
              b.measured }}. Press <b>Apply phase map</b>.{% endif %}{% endfor
              -%}

              </ha-alert>

              {%- endif -%}
          - type: tile
            entity: input_boolean.hbc_show_selftest_details
            name: Show details
            icon: mdi:chevron-down
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_selftest_details
                state_not: 'on'
          - type: tile
            entity: input_boolean.hbc_show_selftest_details
            name: Hide details
            icon: mdi:chevron-up
            hide_state: true
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_selftest_details
                state: 'on'
          - type: button
            name: Apply phase map
            icon: mdi:sine-wave
            show_state: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_apply_phase_map
              confirmation:
                text: >-
                  Copy the measured phases into the phase map (Marstek MN
                  phase)? Batteries on Own circuit are left alone.
            visibility:
              - condition: numeric_state
                entity: sensor.hbc_self_test_phase_changes
                above: 0
            card_mod:
              style: |
                ha-card {
                  border: 2px solid var(--warning-color) !important;
                }
          - type: markdown
            content: >-
              {%- set c = state_attr('sensor.hbc_self_test_status', 'checks') or
              [] -%}

              {%- set icon = {'ok': '✅', 'warning': '⚠️', 'error': '❌'} -%}

              {%- set bs = state_attr('sensor.hbc_self_test_phases',
              'batteries') or [] -%}

              {%- set notes = bs | selectattr('note', 'defined') |
              selectattr('note') | list | count > 0 -%}

              {%- if c %}

              | Check | | Details |

              | :--- | :---: | :--- |

              {% for x in c -%}

              {%- set info = 'running' if x.id == 'flow' and x.result == 'ok'
                   else ('automatic' if x.id == 'price' and x.result == 'ok' and (x.info | string).startswith('not pinned') else x.info) -%}
              | {{ x.label }} | {{ icon.get(x.result, x.result) }} | {{ info |
              string | replace('|', '/') }} |

              {% endfor %}

              {%- else %}

              No test run yet.

              {% endif %}

              {%- if bs %}


              **Phases**


              | Battery | Phase map | Measured | Measured rise (W){{ ' | Note'
              if notes }} |

              | :--- | :---: | :---: | :---{{ ' | :---' if notes }} |

              {% for b in bs -%}

              {%- set cur = states('input_select.marstek_' ~ (b.id | lower) ~
              '_phase') -%}

              {%- set d = b.delta or {} -%}

              | {{ b.id }} | {{ cur }} | {{ b.measured or '–' }}{{ ' ⚠️' if
              b.measured and cur in ['L1', 'L2', 'L3'] and cur != b.measured }}
              | {% for ph in ['L1', 'L2', 'L3'] %}{{ '**' if ph == b.measured
              }}{{ ph }} {{ d.get(ph, '–') }}{{ '**' if ph == b.measured }}{{ '
              · ' if not loop.last }}{% endfor %}{% if notes %} | {{ b.note |
              default('') }}{{ ' (' ~ b.attempts ~ ' attempts)' if b.attempts |
              default(0) > 1 }}{% endif %} |

              {% endfor %}

              {%- endif %}


              Phase guard: **{{
              states('input_select.house_battery_phase_guard_mode') }}** · {{
              states('input_select.house_battery_phase_sharing') }}
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_selftest_details
                state: 'on'
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
