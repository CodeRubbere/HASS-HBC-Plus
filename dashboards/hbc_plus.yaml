      - type: grid
        cards:
          - type: heading
            heading: Battery phase test
            heading_style: title
            icon: mdi:clipboard-check-outline
            grid_options:
              rows: 1
          - type: heading
            icon: mdi:information
            heading: Check the setup and the phase map
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#setup-self-test
          - type: markdown
            content: >-
              <font color=grey>Checks that everything HBC+ needs is there and
              working, then measures per battery which phase it is on: one
              battery at a time charges at 800 W for about 35 s (1 to 3 minutes
              per battery, your strategy takes over again afterwards). The test
              never changes the phase map: apply it with the button
              below.</font>
            text_only: true
            grid_options:
              rows: 1
              columns: 24
          - show_name: true
            show_icon: true
            type: button
            name: Run self-test
            icon: mdi:play-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              confirmation:
                text: >-
                  Run the self-test? With phase detection on, the batteries
                  leave your strategy for 1 to 3 minutes per battery.
              data:
                phase_detection: true
              target: {}
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state_not: running
          - type: button
            name: Checks only
            icon: mdi:clipboard-list-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_run
              data:
                phase_detection: false
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state_not: running
          - type: button
            name: Stop self-test
            icon: mdi:stop-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.hbc_selftest_abort
            visibility:
              - condition: state
                entity: sensor.hbc_self_test_status
                state: running
          - type: heading
            icon: ''
            heading_style: subtitle
          - type: tile
