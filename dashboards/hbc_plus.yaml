      - type: grid
        cards:
          - type: heading
            heading: Price guard
            heading_style: title
            icon: mdi:cash-lock
            grid_options:
              rows: 1
          - type: heading
            icon: mdi:information-slab-circle
            heading: Negative prices
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#price-guard
          - type: entities
            entities:
              - entity: input_select.house_battery_price_guard_mode
                name: Price guard
              - entity: sensor.hbc_price_state
                name: State
              - type: conditional
                conditions:
                  - entity: sensor.hbc_price_state
                    state_not: normal
                row:
                  type: attribute
                  entity: sensor.hbc_price_state
                  attribute: until
                  name: Until
                  format: time
              - type: conditional
                conditions:
                  - entity: sensor.hbc_price_state
                    state: normal
                row:
                  type: attribute
                  entity: sensor.hbc_price_state
                  attribute: next_negative
                  name: Next negative period
              - type: conditional
                conditions:
                  - entity: sensor.hbc_price_guard
                    state_not: none
                row:
                  type: attribute
                  entity: sensor.hbc_price_guard
                  attribute: action
                  name: Action
                  icon: mdi:swap-horizontal
              - entity: input_number.house_battery_price_guard_import_threshold
              - entity: input_number.house_battery_price_guard_export_threshold
              - entity: binary_sensor.hbc_pv_curtail_advised
                name: PV curtailment advised
            show_header_toggle: false
            state_color: true
          - type: markdown
            content: >-
              **On needs the tariff source Grid Clock.** With another tariff
              source the price guard only shows what it would do (Monitor): only
              the feed has the real all-in buy and sell prices.
            visibility:
              - condition: state
                entity: input_select.house_battery_price_guard_mode
                state: 'On'
              - condition: state
                entity: input_select.house_battery_strategy_dynamic_data_source
                state_not: Grid Clock
          - type: markdown
            content: >-
              **Import override stays in Monitor:** a phase carries two
              batteries and the phase guard is not on *Enforce*. Charging at
              full power from the grid could overload that phase's group.
            visibility:
              - condition: state
                entity: binary_sensor.hbc_phase_shared
                state: 'on'
              - condition: state
                entity: input_select.house_battery_phase_guard_mode
                state_not: Enforce
              - condition: state
                entity: input_select.house_battery_price_guard_mode
                state_not: 'Off'
          - type: markdown
            content: >-
              **Selling rarely pays without net metering.** Right now an
              exported kWh earns {{ states('sensor.hbc_energy_export_price_now')
              }} ct, a kWh you keep saves {{
              states('sensor.hbc_energy_price_now') }} ct. Dynamic only marks a
              Sell period when the sell price beats the buy price by more than
              the minimum spread; consider *Self-consumption* for expensive
              periods.
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy_dynamic_expensive
                state: Sell
              - condition: state
                entity: binary_sensor.hbc_sell_prices_separate
                state: 'on'
    max_columns: 4
    cards: []
  - type: sections
    title: Charge & Sell
    path: charge-sell
    icon: mdi:transmission-tower
    cards: []
    badges:
