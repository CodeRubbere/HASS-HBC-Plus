              rows: 1
              columns: 24
            entity: sensor.hbc_self_test_status
            name: Battery phase test
            vertical: false
            features_position: bottom
          - type: markdown
            content: >
              {% set c = state_attr('sensor.hbc_self_test_status', 'checks') or
              [] %} {% set icon = {'ok': '✅', 'warning': '⚠️', 'error': '❌'} %}
              {% if c %}| Check | | Details |

              | :--- | :---: | :--- |

              {% for x in c %}| {{ x.label }} | {{ icon.get(x.result, x.result)
              }} | {{ x.info | replace('|', '/') }} |

              {% endfor %}{% elif is_state('sensor.hbc_self_test_status',
              'running') %}Running the checks...{% else %}Not run yet.{% endif
              %}
          - type: markdown
            content: >
              {% set p = states('sensor.hbc_self_test_phases') %} {% set bs =
              state_attr('sensor.hbc_self_test_phases', 'batteries') or [] %} {%
              if is_state('sensor.hbc_self_test_status', 'running') and
              is_state_attr('sensor.hbc_self_test_status', 'step',
              'phase_detection') %}**Phase detection: running** – one battery at
              a time charges at 800 W, about 1 to 3 minutes per battery.{% elif
              p in ['unknown', 'unavailable'] %}Phase detection not run yet.{%
