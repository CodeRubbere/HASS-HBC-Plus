                  endfor -%} <font color="#616161">■</font> Past
                card_mod:
                  style: >
                    ha-card { padding: 4px 16px 0 16px !important; font-size:
                    12px; }
                visibility:
                  - condition: state
                    entity: binary_sensor.hbc_managed_by_batterijplan
                    state: 'on'
              - type: custom:apexcharts-card
                card_mod:
                  style: >
                    ha-card { background: none !important; border: none
                    !important; box-shadow: none !important; }
                header:
                  show: false
                graph_span: 48h
                span:
                  start: day
                stacked: false
                now:
                  show: true
                  color: '#009ac7'
                  label: Now
                apex_config:
                  noData:
                    text: No Data Available
                    align: center
                    verticalAlign: middle
                    style:
                      fontSize: 16px
                  plotOptions:
                    bar:
                      borderRadius: 2
                      columnWidth: 90%
                  legend:
                    show: true
                    position: top
                    markers:
                      width: 0
                      height: 0
                      size: 0
                      strokeWidth: 0
                    formatter: |
                      EVAL:function (name) {
                        const i = String(name).indexOf(':');
                        return i < 0 ? name : '<b>' + name.slice(0, i + 1) + '</b>' + name.slice(i + 1);
                      }
                  xaxis:
                    type: datetime
                    labels:
                      datetimeUTC: false
                      format: HH:mm
                      rotate: -45
                      rotateAlways: true
                  yaxis:
                    decimalsInFloat: 0
                    title:
                      text: cent / kWh
                  tooltip:
                    shared: true
                    intersect: false
                    x:
                      format: ddd dd MMM HH:mm
                    'y':
                      formatter: |
                        EVAL:function (val, opts) {
                          if (val === null || val === undefined) return '';
                          const t = Number(val).toFixed(1) + ' ct/kWh';
                          if (!opts || opts.seriesIndex !== 0) return t;
                          const x = opts.w.globals.seriesX[0][opts.dataPointIndex];
                          const l = (window.hbcPlanLabel || {})[x];
                          return l ? t + ' · ' + l : t;
                        }
                series:
                  - entity: sensor.hbc_energy_prices_data
                    name: 'Bars: buy price'
                    type: column
                    color: '#9e9e9e'
                    float_precision: 1
                    show:
                      legend_value: false
                    data_generator: >
                      // HBC+ v1.2: purple = feeding in costs money, dark purple
                      = paid to import

                      // HBC+ v1.4: while Batterijplan (Live) steers Dynamic
                      (F3), or the strategy is Helios

                      // with a HELIOS plan, past bars are plain grey and future
                      bars show the planned action.

                      const marks = entity.attributes.marks || [];

                      const colours = { high: '#ff9800', low: '#4caf50' };

                      const negColours = { export: '#9c27b0', import: '#4a148c'
                      };

                      const now = Date.now();

                      const bp =
                      hass.states['binary_sensor.hbc_managed_by_batterijplan']?.state
                      === 'on';

                      const helios =
                      hass.states['input_select.house_battery_strategy']?.state
                      === 'Helios';

                      // planAt(start ms) -> [colour, tooltip label] of the
                      planned action, or null

                      let planAt = () => null;

                      let managed = false;

                      if (bp) {
                        // Batterijplan: punten[0] = start in s, punten[5] = action
                        const ACT = { L: ['#3b82f6', 'charge from grid'], O: ['#22c55e', 'discharge'],
                                      H: ['#f59e0b', 'hold'], V: ['#ec4899', 'feed in'], Z: ['#94a3b8', 'solar only'] };
                        const plan = {};
                        (hass.states['sensor.batterijplan']?.attributes?.punten || [])
                          .forEach(p => { plan[p[0] * 1000] = p[5]; });
                        planAt = (s) => ACT[plan[s]] || null;
                        managed = true;
                      } else if (helios) {
                        // HELIOS: plan.timestamp[i] (local time) + plan.hbc_sub_strat[i], step_size in minutes;
                        // a quarter gets the sub-strategy of the HELIOS step it falls in
                        const SUB = { 'Sell': ['#ff9800', 'Sell'], 'Charge': ['#4caf50', 'Charge'],
                                      'Charge PV': ['#cddc39', 'Charge PV'], 'Self-consumption': ['#00bcd4', 'Self-consumption'],
                                      'Zero import': ['#3f51b5', 'Zero import'], 'Standby / peak shave': ['#9e9e9e', 'Standby / peak shave'],
                                      'Full stop': ['#e53935', 'Full stop'] };
                        const hp = hass.states['input_number.helios_optimizer_energy_plan']?.attributes || {};
                        const p = hp.plan || {};
                        const ts = (p.timestamp || []).map(t => new Date(String(t).replace(' ', 'T')).getTime());
                        const sub = p.hbc_sub_strat || [];
                        const step = (Number(hp.step_size) || 15) * 60000;
                        planAt = (s) => {
                          for (let i = ts.length - 1; i >= 0; i--) {
                            if (ts[i] <= s) return (s < ts[i] + step && SUB[sub[i]]) ? SUB[sub[i]] : null;
                          }
                          return null;
                        };
                        managed = ts.length > 0;
                      }

                      const labels = {};

                      const out = marks.map(iv => {
                        const s = new Date(iv.start).getTime();
                        const e = new Date(iv.end).getTime();
                        const a = managed ? planAt(s) : null;
                        if (a) labels[s] = a[1];
                        return {
                          x: s,
                          y: iv.price,
                          fillColor: (now >= s && now < e)
                            ? '#009ac7'
                            : (managed && e <= now)
                              ? '#616161'
                            : a
                              ? a[0]
                              : (negColours[iv.neg] || colours[iv.mark] || '#9e9e9e')
                        };
                      });

                      window.hbcPlanLabel = labels;

                      return out;
                  - entity: sensor.hbc_energy_prices_data
                    name: 'Line: sell price'
                    type: line
                    color: '#455a64'
                    stroke_width: 2
                    curve: stepline
                    float_precision: 1
                    show:
                      legend_value: false
                    data_generator: >
                      // HBC+ v1.2: only when there are separate sell prices
                      (Grid Clock feed)

                      const marks = entity.attributes.marks || [];

                      if (!marks.some(iv => iv.sell !== undefined && iv.sell !==
                      null && iv.sell !== iv.price)) return [];

                      return marks.map(iv => ({ x: new Date(iv.start).getTime(),
                      y: iv.sell }));
