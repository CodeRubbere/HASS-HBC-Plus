              float(3680) %} <ha-alert alert-type="error">Grid power on {% for i
              in [1, 2, 3] if states('sensor.p1_meter_power_phase_' ~ i) |
              float(0) | abs > lim %}L{{ i }} {% endfor %} is above {{ lim | int
