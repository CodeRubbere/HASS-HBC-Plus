          - type: markdown
            text_only: true
            content: >-
              {%- set dash = '1.3.0' -%}

              {%- set rel = states('sensor.hbc_package_version') -%}

              {%- set mm = rel.split('.')[:2] | join('.') -%}

              {%- set fl = state_attr('sensor.hbc_health', 'flows_version') or
              '—' -%}

              {%- set tabs = state_attr('sensor.hbc_health', 'flow_versions') or
              {} -%}

              {%- set files = dict(state_attr('sensor.hbc_package_version',
              'files') or {},
                                   **(state_attr('sensor.hbc_health', 'package_versions') or {})) -%}
              {%- set market = state_attr('sensor.hbc_marketplace', 'items') or
              [] -%}

              {%- macro row(n, v) -%}{%- if v and (v | string).split('.')[:2] |
              join('.') == mm -%}{{ n }} · {{ v }}{%- else -%}<font color=red>{{
              n }} · {{ v or 'missing' }}</font>{%- endif -%}{%- endmacro -%}

              <font color=grey>Every part of HBC+ and its version. A minor
              release (1.3 → 1.4) replaces every part; a patch release (1.3.0 →
              1.3.1) only the parts it changed, so patch numbers may differ. An
              entry in red is of another release or missing: see the update
              steps in the user guide. A Marketplace item or app in orange has a
              newer version.</font>


              **HBC+ release {{ rel }}**


              - {{ row('**Dashboard**', dash) }}

              - {{ row('**Node-RED flows**', fl) }}

              {%- for k, v in tabs | dictsort %}
                - {{ row(k | replace('HBC+ ', ''), v) }}
              {%- endfor %}

              {%- if not tabs %}
                - <font color=grey>no tab list yet (comes from *HBC+ health* in Node-RED)</font>
              {%- endif %}

              - **Package files**

              {%- for k, v in files | dictsort %}
                - {{ row(k ~ '.yaml', v) }}
              {%- endfor %}

              - **Marketplace**

              {%- for i in market %}
                - {% if i.status == 'not found' %}<font color=red>{{ i.name }} · not found</font>{% elif i.status == 'update' %}{{ i.name }} · {{ i.installed }} → <font color=orange>{{ i.latest }}</font>{% else %}{{ i.name }} · {{ i.installed or '—' }}{% endif %}
              {%- endfor %}

              {%- if not market %}
                - <font color=grey>no list yet (comes from `sensor.hbc_marketplace` in `hbc_control.yaml`)</font>
              {%- endif %}

              {%- set apps = state_attr('sensor.hbc_apps', 'items') or [] %}

              - **Apps**

              {%- for i in apps %}
                - {% if i.status in ['not set up', 'not connected', 'not running'] %}<font color=red>{{ i.name }} · {{ i.status }}{{ (' (no report for ' ~ i.minutes ~ ' min)') if i.status == 'not running' and i.minutes is not none else '' }}</font>{% elif i.status in ['not an app', 'standalone', 'unknown'] %}{{ i.name }} · <font color=grey>{{ {'not an app': 'not an app here (external broker)', 'standalone': 'running (standalone)', 'unknown': 'unknown (needs MQTT)'}[i.status] }}</font>{% elif i.status == 'update' %}{{ i.name }} · {{ i.installed }} → <font color=orange>{{ i.latest }}</font>{{ ' · running' if i.name == 'Node-RED' else '' }}{% elif i.type == 'Integration' %}{{ i.name }} · connected{{ (' · built into HA ' ~ i.installed) if i.installed else '' }}{% else %}{{ i.name }} · {{ i.installed }}{{ ' · running' if i.name == 'Node-RED' else '' }}{% endif %}
              {%- endfor %}

              {%- if not apps %}
                - <font color=grey>no list yet (comes from `sensor.hbc_apps` in `hbc_control.yaml`)</font>
              {%- endif %}

              {%- if market | selectattr('status', 'eq', 'not found') | list %}


              <small>*Not found* (Marketplace): not downloaded through the
              Marketplace, or its update entity is disabled, so HBC+ cannot
              check it. Download it from the Marketplace, or enable its update
              entity.</small>

              {%- endif %}

              {%- set items = state_attr('sensor.hbc_health', 'version_items')
              or [] -%}

              {%- set exp = state_attr('sensor.hbc_health', 'version_expected')
              or mm -%}

              {%- for part, title in [('flow', 'Node-RED flow'), ('package',
              'Package file'), ('config', 'hbc_config.yaml setting')] -%}

              {%- set rows = items | selectattr('part', 'eq', part) | list -%}

              {%- if rows %}


              <ha-alert alert-type="warning">{% for r in rows -%}

              {{ r.name }} {{ ('v' ~ r.version) if r.version else ('missing' if
              part == 'config' else 'missing (or older than this check)') }}<br>

              {%- endfor %}<small>Expected: v{{ exp }}.x</small></ha-alert>

              {%- endif -%}

              {%- endfor -%}

              {%- if dash.split('.')[:2] | join('.') != exp and rel is
              match('^\d+\.\d+') %}


              <ha-alert alert-type="warning">Dashboard v{{ dash
              }}<br><small>Expected: v{{ exp }}.x</small></ha-alert>

              {%- endif %}
            visibility:
              - condition: state
                entity: input_boolean.hbc_show_alert_info
