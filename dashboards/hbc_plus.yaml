    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Phase guard
            heading_style: title
            icon: mdi:sine-wave
          - type: heading
            heading: Phase guard settings
            heading_style: subtitle
            icon: mdi:cog-outline
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/advanced-settings
