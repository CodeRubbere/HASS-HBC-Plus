  - type: sections
    icon: mdi:math-integral-box
    path: self-consumption
    sections:
      - type: grid
        cards:
          - type: heading
            heading: PID controller (advanced settings)
            heading_style: title
            icon: mdi:cog-box
          - type: markdown
            content: >-
              <font color="grey"><i>These settings tune how aggressive the
              system tries to keep the grid power at the desired power level.
              Too aggressive is unstable! Too safe will cost efficiency. This
              PID control can outperform Vendor made software by a great margin,
              according to community feedback.

              </i></font>
            text_only: true
          - type: heading
            icon: mdi:information
            heading: Help | setup and tuning PID control
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#self-consumption-and-pid-tuning
          - type: tile
            entity: sensor.hbc_health
            name: High controller sensitivity
            icon: mdi:alert-outline
            hide_state: true
            vertical: false
            grid_options:
              columns: full
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            icon_tap_action:
              action: perform-action
              perform_action: input_boolean.toggle
              target:
                entity_id: input_boolean.hbc_show_alert_info
            card_mod:
              style:
                .: |
                  ha-card {
                    background: rgba(var(--rgb-warning-color, 255, 166, 0), 0.15) !important;
                    border: none !important;
                    --tile-color: var(--warning-color) !important;
                    --tile-info-primary-font-weight: 700 !important;
                    --tile-info-primary-font-size: 16px !important;
                    --tile-icon-opacity: 0 !important;
                  }
                ha-tile-icon$: |
                  .container::before { opacity: 0 !important; }
                  .container { background: none !important; }
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
