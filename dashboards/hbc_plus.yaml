          - type: markdown
            content: >-
              <font color=grey>HBC+ learns how much the house uses per quarter,
              on working days and weekend days. With the switch on, Dynamic
              keeps only as many cheap quarters as it needs to charge the
              expected use of the expensive quarters (plus the margin, minus
              what is stored), the cheapest first. Needs at least 7 working days
              and 4 weekend days of learning, the cheap strategy Charge, and an
              expensive strategy other than Sell.</font>
