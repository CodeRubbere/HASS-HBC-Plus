views:
  - type: sections
    path: home-battery-control
    max_columns: 3
    title: Home Battery Control Plus
    icon: mdi:home
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Onboarding
            heading_style: title
            icon: mdi:cog-outline
          - type: markdown
            content: '### Step 1'
            text_only: true
          - type: entities
            entities:
              - entity: input_number.house_battery_count
          - type: markdown
            content: '### Step 2'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="Setup Grid Power Sensor">Configure your P1 power
              sensor</ha-alert>

              1. Edit the file

              `packages/hbc_config.yaml` 

              1. Find the `<< YOUR GRID POWER SENSOR HERE` tag 

              1. Enter your sensor indicating your grid power usage in Watts.
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.p1_meter_power
                    state: unavailable
                  - condition: state
                    entity: sensor.p1_meter_power
                    state: unknown
          - type: markdown
            content: >-
              <ha-alert title="Grid Power Sensor"
              alert-type="success">Configured</ha-alert>
            visibility:
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - type: heading
            icon: mdi:pen
            heading: Open file editor
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /core_configurator
          - type: markdown
            content: '### Step 3'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="Setup Node-RED"> Import and deploy <font
              color=red>Node-RED</font> scripts.</ha-alert>
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state_not: 'on'
          - type: markdown
            content: >-
              <ha-alert title="Node-RED" alert-type="success">Configured and
              script deployed</ha-alert>
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
          - type: markdown
            content: '### Step 4'
            text_only: true
          - type: markdown
            content: >-
              <ha-alert title="(Optional) review power limits"> Use limits and
              peak shaving to reduce <font color=darkblue>peaks and overload
              risk</font>.</ha-alert>
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state_not: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state_not: 'on'
          - type: heading
            icon: mdi:cog-outline
            heading: Review power limits
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/advanced-settings
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state_not: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state_not: 'on'
          - type: markdown
            content: >-
              <ha-alert title="Power limits" alert-type="success"> Batteries
              will help prevent peaks and overloads, when able.</ha-alert>
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_import
                    state: 'on'
                  - condition: state
                    entity: input_boolean.house_battery_control_has_power_limit_export
                    state: 'on'
          - type: markdown
            content: '### Step 5'
            text_only: true
          - type: markdown
            content: >-
              Set the Master Battery Control to `Full Control` only after
              reviewing and checking all installation instructions. 


              Pick a battery charging strategy e.g. `self-consumption`, choose
              controller sensitivity `very safe` and you are done!
          - type: markdown
            content: '### Done'
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - show_name: false
            show_icon: true
            type: button
            entity: input_boolean.house_battery_control_onboarding_finished
            grid_options:
              columns: 2
              rows: 1
            icon: mdi:eye-off-outline
            hold_action:
              action: toggle
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
            icon_height: 25px
          - type: markdown
            text_only: true
            grid_options:
              columns: 9
              rows: 1
            content: |-
              ---
              Hide onboarding
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
          - type: markdown
            content: >-
              _You can find battery settings and unhide onboarding on the
              settings tab._
            grid_options:
              columns: full
              rows: auto
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.house_battery_control_has_node_red
                state: 'on'
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unavailable
                      - condition: state
                        entity: sensor.p1_meter_power
                        state: unknown
        visibility:
          - condition: not
            conditions:
              - condition: state
                entity: input_boolean.house_battery_control_onboarding_finished
                state: 'on'
      - type: grid
        cards:
          - type: heading
            heading: Master Battery Control
            heading_style: title
            icon: mdi:gamepad-variant-outline
          - type: tile
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.ev_is_charging
                state: 'on'
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
              - condition: state
                entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                state: Full stop
            entity: sensor.ev_is_charging
            name: EV is charging - Full Stop strategy is active
            color: red
            hide_state: true
            vertical: false
            features_position: bottom
          - type: tile
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.ev_is_charging
                state: 'on'
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
              - condition: state
                entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                state: Standby / peak shave
            entity: sensor.ev_is_charging
            name: EV is charging - Standby / peak shave strategy is active
            color: amber
            hide_state: true
            vertical: false
            features_position: bottom
          - features:
              - type: select-options
            type: tile
            entity: input_select.marstek_master_battery_mode
            features_position: bottom
            vertical: false
            show_entity_picture: false
            hide_state: true
            name: Control Mode
            icon: mdi:camera-control
          - type: tile
            entity: input_select.house_battery_strategy
            name: Choose strategy
            show_entity_picture: false
            hide_state: true
            vertical: false
            features:
              - type: select-options
            features_position: bottom
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - type: markdown
            content: >-
              **✋ Held by:** {% for h in state_attr('sensor.hbc_strategy_holds',
              'holds') or [] if h.active %}{{ h.requester }} ({{ h.strategy }}{{
              ', until ' ~ h.expires if h.expires }}){{ ', ' if not loop.last
              }}{% endfor %}. Your choice: {{
              state_attr('sensor.hbc_strategy_holds', 'base') }}.
            visibility:
              - condition: numeric_state
                entity: sensor.hbc_strategy_holds
                above: 0
          - type: tile
            entity: sensor.hbc_savings_today
            name: Savings today
            icon: mdi:piggy-bank-outline
            vertical: false
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/savings
          - type: markdown
            content: >-
              **⚡ Price guard:** {{ state_attr('sensor.hbc_price_guard',
              'action') }} {%- set u = state_attr('sensor.hbc_price_state',
              'until') -%} {%- if u %} until {{ as_timestamp(u) |
              timestamp_custom('%H:%M') }}{% endif %} ({{ {'export_negative':
              'feeding in costs money',
                  'import_negative': 'you are paid to import'}.get(states('sensor.hbc_price_state'), 'low prices') }})
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/timed-dynamic
            visibility:
              - condition: state
                entity: sensor.hbc_price_guard
                state: override
          - type: heading
            icon: mdi:cash-remove
            heading: >-
              No energy prices: Dynamic runs its baseline strategy. Check the
              tariff source
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/timed-dynamic
            visibility:
              - condition: state
                entity: binary_sensor.hbc_price_data_missing
                state: 'on'
          - type: heading
            icon: mdi:alert
            heading: 'Dynamic strategy: Full Stop. Please configure dynamic strategy'
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/timed-dynamic
            visibility:
              - condition: state
                entity: input_select.house_battery_strategy_dynamic_data_source
                state: None
              - condition: state
                entity: input_select.house_battery_strategy
                state: Dynamic
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - type: heading
            icon: mdi:information-slab-circle
            heading: 'About strategies '
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#choosing-a-strategy
          - type: entities
            entities:
              - entity: input_text.house_battery_strategy_active_sub_strategy
                type: simple-entity
                name: Executing (flow)
            grid_options:
              columns: 12
              rows: auto
            show_header_toggle: false
            state_color: false
            no_background: true
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
          - type: history-graph
            entities:
              - entity: input_select.house_battery_strategy
                name: Chosen strategy
              - entity: input_text.house_battery_strategy_active_sub_strategy
                name: Executing
            visibility:
              - condition: state
                entity: input_select.marstek_master_battery_mode
                state: Full control
            hours_to_show: 12
          - type: markdown
            content: |-
              <font color="grey">

              #### Your energy and battery usage</font>
            text_only: true
          - type: history-graph
            entities:
              - entity: input_number.house_battery_control_pid_output
                name: PID control
              - entity: sensor.p1_meter_power
                name: Grid power
              - entity: select.marstek_m1_forcible_charge_discharge
                name: M1
              - entity: select.marstek_m2_forcible_charge_discharge
                name: M2
              - entity: select.marstek_m3_forcible_charge_discharge
                name: M3
              - entity: select.marstek_m4_forcible_charge_discharge
                name: M4
              - entity: select.marstek_m5_forcible_charge_discharge
                name: M5
              - entity: select.marstek_m6_forcible_charge_discharge
                name: M6
            hours_to_show: 0.05
          - type: heading
            icon: mdi:information
            heading: Self-consumption
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/self-consumption
          - type: markdown
            content: >-
              <ha-alert alert-type="warning">High controller sensitivity,
              monitor your system.</ha-alert>
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: input_number.house_battery_control_kp
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_ki
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_kd
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_error_signal_dampening
                    above: 70
                  - condition: numeric_state
                    entity: input_number.house_battery_control_pid_output_dampening
                    above: 50
            text_only: true
          - type: entities
            entities:
              - entity: input_select.house_battery_control_pid_presets
                name: Controller sensitivity
          - type: heading
            icon: ''
            heading: Configure custom values
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/self-consumption
      - type: grid
        cards:
          - type: heading
            heading: Basic battery information
            heading_style: title
            icon: mdi:home-battery-outline
          - type: tile
            entity: sensor.battery_time_remaining
            name: Battery remaining
            icon: mdi:battery-clock
            show_entity_picture: false
            hide_state: false
            vertical: false
            features_position: bottom
            grid_options:
              columns: full
              rows: 1
          - type: heading
            heading: Marstek M1
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: state
                entity: sensor.marstek_m1_device_name
                state_not: unknown
          - type: glance
            entities:
              - entity: sensor.marstek_m1_battery_state_of_charge
                name: M1 SoC
              - entity: sensor.marstek_m1_ac_power
                name: M1 Power
              - entity: number.marstek_m1_max_charge_power
                name: Max Charge
              - entity: number.marstek_m1_max_discharge_power
                name: Max Discharge
              - entity: input_select.marstek_m1_phase
                name: Phase
            visibility:
              - condition: state
                entity: sensor.marstek_m1_device_name
                state_not: unknown
          - type: heading
            heading: Marstek M2
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m2_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 1
          - type: glance
            entities:
              - entity: sensor.marstek_m2_battery_state_of_charge
                name: M2 SoC
              - entity: sensor.marstek_m2_ac_power
                name: M2 Power
              - entity: number.marstek_m2_max_charge_power
                name: Max Charge
              - entity: number.marstek_m2_max_discharge_power
                name: Max Discharge
              - entity: input_select.marstek_m2_phase
                name: Phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m2_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 1
          - type: heading
            heading: Marstek M3
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m3_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 2
          - type: glance
            entities:
              - entity: sensor.marstek_m3_battery_state_of_charge
                name: M3 SoC
              - entity: sensor.marstek_m3_ac_power
                name: M3 Power
              - entity: number.marstek_m3_max_charge_power
                name: Max Charge
              - entity: number.marstek_m3_max_discharge_power
                name: Max Discharge
              - entity: input_select.marstek_m3_phase
                name: Phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m3_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 2
          - type: heading
            heading: Marstek M4
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m4_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 3
          - type: glance
            entities:
              - entity: sensor.marstek_m4_battery_state_of_charge
                name: M4 SoC
              - entity: sensor.marstek_m4_ac_power
                name: M4 Power
              - entity: number.marstek_m4_max_charge_power
                name: Max Charge
              - entity: number.marstek_m4_max_discharge_power
                name: Max Discharge
              - entity: input_select.marstek_m4_phase
                name: Phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m4_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 3
          - type: heading
            heading: Marstek M5
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m5_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 4
          - type: glance
            entities:
              - entity: sensor.marstek_m5_battery_state_of_charge
                name: M5 SoC
              - entity: sensor.marstek_m5_ac_power
                name: M5 Power
              - entity: number.marstek_m5_max_charge_power
                name: Max Charge
              - entity: number.marstek_m5_max_discharge_power
                name: Max Discharge
              - entity: input_select.marstek_m5_phase
                name: Phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m5_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 4
          - type: heading
            heading: Marstek M6
            heading_style: subtitle
            icon: ''
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m6_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 5
          - type: glance
            entities:
              - entity: sensor.marstek_m6_battery_state_of_charge
                name: M6 SoC
              - entity: sensor.marstek_m6_ac_power
                name: M6 Power
              - entity: number.marstek_m6_max_charge_power
                name: Max Charge
              - entity: number.marstek_m6_max_discharge_power
                name: Max Discharge
              - entity: input_select.marstek_m6_phase
                name: Phase
            visibility:
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.marstek_m6_device_name
                    state_not: unknown
                  - condition: numeric_state
                    entity: input_number.house_battery_count
                    above: 5
          - type: heading
            heading: Info and guides
            heading_style: title
            icon: mdi:book-open-page-variant
          - type: heading
            icon: mdi:information-slab-circle
            heading: User guide (English)
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md
          - type: heading
            icon: mdi:book-open-variant
            heading: Gebruikershandleiding (Nederlands)
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/gebruikershandleiding.nl.md
          - type: heading
            icon: mdi:spider
            heading_style: subtitle
            tap_action:
              action: navigate
              navigation_path: /home-battery-control-plus/problem-solver
            heading: Problem solver
          - type: markdown
            content: -----
            text_only: true
          - type: heading
            icon: mdi:star-check-outline
            heading: Do you like HBC+? Consider giving it a star
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus
          - type: markdown
            content: >-
              [![GitHub
              stars](https://img.shields.io/github/stars/CodeRubbere/HASS-HBC-Plus?style=social)](https://github.com/CodeRubbere/HASS-HBC-Plus)
            text_only: true
    header:
      card:
        type: markdown
        content: '### Home Battery Control Plus *(HBC+ v1.1)*'
        text_only: true
    cards: []
  - type: sections
    max_columns: 3
    icon: mdi:transmission-tower-off
    path: self-consumption
    sections:
      - type: grid
        cards:
          - type: heading
            heading: PID controller (advanced settings)
            heading_style: title
            icon: mdi:cog-box
          - type: markdown
            content: >-
              <font color="grey"><i>These settings tune how aggressive the
              system tries to keep the grid power at the desired power level.
              Too aggressive is unstable! Too safe will cost efficiency. This
              PID control can outperform Vendor made software by a great margin,
              according to community feedback.

              </i></font>
            text_only: true
          - type: heading
            icon: mdi:information
            heading: Help | setup and tuning PID control
            heading_style: subtitle
            tap_action:
              action: url
              url_path: https://github.com/CodeRubbere/HASS-HBC-Plus/blob/main/docs/user-guide.en.md#self-consumption-and-pid-tuning
          - type: markdown
            content: >-
              <ha-alert alert-type="warning">High controller sensitivity,
              monitor your system.</ha-alert>
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: input_number.house_battery_control_kp
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_ki
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_kd
                    above: 0.5
                  - condition: numeric_state
                    entity: input_number.house_battery_control_error_signal_dampening
                    above: 70
                  - condition: numeric_state
                    entity: input_number.house_battery_control_pid_output_dampening
                    above: 50
            text_only: true
          - type: entities
            entities:
              - entity: input_select.house_battery_control_pid_presets
                name: PID presets
              - entity: input_number.house_battery_control_kp
                name: Proportional gain (Kp)
              - entity: input_number.house_battery_control_ki
                name: Integral gain (Ki)
              - entity: input_number.house_battery_control_kd
                name: Differential gain (Kd)
              - entity: input_number.house_battery_control_error_signal_dampening
                name: Input smoothing
                secondary_info: none
              - entity: input_number.house_battery_control_pid_output_dampening
                name: Output smoothing
              - entity: input_number.house_target_grid_consumption_in_w
                name: Target grid consumption
      - type: grid
        cards:
          - type: heading
            heading: PID history
            heading_style: title
            icon: mdi:cog-box
          - type: markdown
            content: >-
              <font color="grey"><i>Use **PID History** for tuning. It shows the
              internal controller values:


              * **Input (W):** Grid power error (Current vs. Desired)

              * **Output (W):** Target battery power

              * **Output (W):** P-term + I-term + D-term


              </i></font>
            text_only: true
            grid_options:
              columns: full
          - title: PID analysis
