              state_attr('sensor.hbc_self_test_phases', 'reason') %} – {{
              state_attr('sensor.hbc_self_test_phases', 'reason') }}{% endif %}


              {% if bs %}| Battery | Set | Measured | Rise L1 / L2 / L3 (W) |
              Note |

              | :--- | :---: | :---: | :--- | :--- |

              {% for b in bs %}{% set cur = states('input_select.marstek_' ~
