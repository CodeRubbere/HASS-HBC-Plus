            heading_style: title
            icon: mdi:cellphone-message
          - type: markdown
            content: >-
              <font color=grey>Every HBC+ notification goes to the notify
              actions below, comma-separated (e.g. `notify.mobile_app_<phone>`).
              Empty = `notify.notify`. Send a test after changing the field: a
              typo in the name gives no notification, only an error in the HA
              log.</font>
            text_only: true
          - type: entities
            entities:
              - entity: input_text.house_battery_notify_targets
                name: Notify targets
              - type: button
                name: Send a test notification
                icon: mdi:send
                action_name: Test
                tap_action:
                  action: perform-action
                  perform_action: script.hbc_notify
                  data:
                    title: 'HBC+: test'
                    message: Test notification from the Settings view.
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: heading
            heading: EV Stop Trigger
            heading_style: title
            icon: mdi:power-plug-off
            grid_options:
              rows: 1
          - type: markdown
            content: >-
              <font color=grey>The Stop Trigger will OVERRULE ALL active
              strategies.

              _E.g. use to disengage your home batteries when EV is
              charging_</font>
            text_only: true
          - type: entities
            entities:
              - entity: input_text.house_battery_strategy_ev_sensor_entity_id
                secondary_info: none
              - entity: input_select.house_battery_strategy_ev_stop_trigger_strategy
                name: Trigger strategy
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            content: >-
              <font color=grey>Enter the `entity_id` of an `input_boolean` or
              `on/off template_sensor` in the field above. Choose whether an
              active trigger should fully stop the batteries or keep them in
              standby for peak shaving.</font>
            text_only: true
          - type: tile
            grid_options:
              columns: full
            entity: sensor.ev_is_charging
            name: EV stop trigger
            vertical: false
            features_position: bottom
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
          - type: markdown
            content: >-
              <font color=grey>The `EV stop trigger` should now indicate whether
              the trigger is active. Stop trigger 'on' = selected trigger
              strategy is applied.</font>
            text_only: true
    max_columns: 4
  - type: sections
    title: Logging
    icon: mdi:spider-outline
    path: problem-solver
    background:
      opacity: 10
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Node-RED
            heading_style: title
          - type: heading
            icon: mdi:list-status
            heading: 🕵️ Flow trace
            heading_style: subtitle
          - type: markdown
            content: >-
              **Strategy:** {{ states('input_select.house_battery_strategy')}}

              ***

              {% set history = state_attr('sensor.home_battery_control_trace',
              'history') or [] %} {% set start_ts =
              state_attr('sensor.home_battery_control_trace', 'start') %} {% set
              end_ts = state_attr('sensor.home_battery_control_trace', 'end') %}
              {% set start_dt = (start_ts / 1000) | as_datetime if start_ts is
              number else as_datetime(start_ts) %} {% set end_dt = (end_ts /
              1000) | as_datetime if end_ts is number else as_datetime(end_ts)
              %} {% set total_dt = (end_dt - start_dt).total_seconds() if end_dt
              and start_dt else 0 %}

              Flows used

              | Step | Flow | Duration |

              | :--- | :--- | :--- |

              {% set first_ts = history[0].timestamp if history|length > 0 else
              end_ts %} {% set first_dt = (first_ts / 1000) | as_datetime if
              first_ts is number else as_datetime(first_ts) %} {% set d0 =
              (first_dt - start_dt).total_seconds() if first_dt and start_dt
              else 0 %} | 0 | Home battery start | `{{ "{:.3f}".format(d0) }}s`
              |

              {% for entry in history -%}
                {%- set ts = entry.timestamp -%}
                {%- set current_dt = (ts / 1000) | as_datetime if ts is number else as_datetime(ts) -%}
                {%- if not loop.last -%}
                  {%- set next_ts = history[loop.index].timestamp -%}
                {%- else -%}
                  {%- set next_ts = end_ts -%}
                {%- endif -%}    
                {%- set next_dt = (next_ts / 1000) | as_datetime if next_ts is number else as_datetime(next_ts) -%}
                {%- set delta = (next_dt - current_dt).total_seconds() if next_dt and current_dt else 0 -%}
                | {{ loop.index }} | {{ entry.flow }} | `{{ "{:.3f}".format(delta) }}s` |
              {% endfor %} | ✔️ | Home Battery Start | `Done` |


              **Total `{{ "{:.3f}".format(total_dt) }}s`** spent in strategy
              flows
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
      - type: grid
        cards:
          - type: heading
            heading: Insights
            heading_style: title
            icon: mdi:information-outline
          - type: heading
            icon: mdi:list-box-outline
            heading: 📋 Explanations (last 100 items)
            heading_style: subtitle
          - type: markdown
            content: >
              {% set logs = state_attr('sensor.home_battery_control_log', 'log')
              %}  {% if logs %}

              | Time |  | Flow | Node | Explanation |

              | :--- | :--- | :--- | :--- | :--- |
                {%- for entry in logs %}
                {%- set color = '#009ac7' -%}
                {%- if entry.level == 'log' %}{% set color = '#38cd9e' -%}
                {%- elif entry.level == 'warn' %}{% set color = 'orange' -%}
                {%- elif entry.level == 'error' %}{% set color = 'red' -%}
                {%- endif %}
                | {{ entry.timestamp }} | {{ entry.icon }} |<font color="{{color}}">{{ entry.flow }}</font> | {{ entry.node }} |{{ entry.payload }} |
                {%- endfor %}
              {% else %}
                No logs available
              {% endif %}
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  border: 2px solid rgba(var(--rgb-primary-text-color), 0.22) !important;
                }
        column_span: 2
    header:
