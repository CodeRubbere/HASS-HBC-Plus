      card:
        type: markdown
        text_only: true
        content: >-
          ### Phase guard


          **Phase guard** keeps each phase below its grid fuse and battery
          circuit, _e.g. one active battery per shared phase_.

          **Peak shaving** keeps grid import and export below a limit, _e.g. for
          a capacity tariff_.

          _Per phase: the active battery, grid and battery load, and charge and
          discharge room..._
