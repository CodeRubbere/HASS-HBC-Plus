          - type: markdown
            content: >-
              <font color=grey>HBC+ learns how much the house uses per quarter,
              on working days and weekend days. With the switch on, Dynamic
              keeps only as many cheap quarters as it needs to charge the
              expected use of the expensive quarters (plus the margin, minus
              what is stored), the cheapest first. Needs at least 7 working days
              and 4 weekend days of learning, the cheap strategy Charge, and an
              expensive strategy other than Sell.</font>
            text_only: true
          - type: custom:apexcharts-card
            header:
              show: true
              title: Expected use, next 24 hours
            graph_span: 24h
            span:
              start: minute
            now:
              show: true
              label: Now
            apex_config:
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
              yaxis:
                decimalsInFloat: 0
                title:
                  text: W
            series:
              - entity: sensor.hbc_load_forecast
                name: Forecast
                type: area
                curve: stepline
                data_generator: >
                  const f = entity.attributes.forecast || []; const t0 = new
                  Date(entity.attributes.start).getTime(); return f.map((w, k)
                  => [t0 + k * 900000, w]);
          - type: markdown
            content: >-
              {%- set lf = state_attr('sensor.hbc_energy_prices_data',
              'load_forecast') or {} -%} {%- if
              is_state('input_boolean.house_battery_dynamic_use_load_forecast',
              'on') -%} {%- if lf.used -%} ✅ Dynamic keeps **{{ lf.low_kept }}**
              cheap quarters and skips {{ lf.low_dropped }}: the expensive
              quarters need {{ lf.need_kwh }} kWh, {{ lf.stored_kwh }} kWh is
              stored, one cheap quarter charges {{ lf.per_low_kwh }} kWh. {%-
              elif lf.reason -%} ⏳ Not used now: {{ lf.reason }}. Dynamic
              charges as without the forecast. {%- else -%} ⏳ Waiting for the
              next Dynamic run (every quarter). {%- endif -%} {%- endif %}
            text_only: true
