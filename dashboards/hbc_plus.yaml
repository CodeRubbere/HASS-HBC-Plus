      card:
        type: markdown
        text_only: true
        content: >-
          ### Batteries


          **Battery life**: calibration, which battery charges first, and when
          an idle battery stops.

          The **self-test** checks the setup and measures which phase each
          battery is connected to.

          _Per battery: phase, cutoffs and max power..._
    cards: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Battery calibration
            heading_style: title
            icon: mdi:battery-sync
            grid_options:
              rows: 1
          - type: markdown
            content: >-
              <font color=grey>When a battery has not reached its charge cutoff
              for the set number of days, HBC+ charges it to 100 % once in the
              cheapest block after midnight (Charge Deadline). The charge cutoff
              goes to 100 % for that night and back afterwards. Notify only
              sends a notification.</font>
            text_only: true
          - type: entities
            entities:
              - entity: input_select.house_battery_calibration_mode
                name: Mode
              - entity: input_number.house_battery_calibration_days
                name: Calibrate after
              - entity: input_datetime.house_battery_calibration_deadline
                name: Full by
              - entity: sensor.hbc_calibration_status
                name: Status
          - type: markdown
            content: >
              {% set n = [states('input_number.house_battery_count') | int(0),
              6] | min %}

              {% set lim = states('input_number.house_battery_calibration_days')
              | float(14) %}

              {% set days = state_attr('sensor.hbc_calibration_due', 'days') or
              {} %}

              | Battery | Days since full |

              | :--- | ---: |

              {% for i in range(1, n + 1) %}{% set d = days.get('M' ~ i) %}| M{{
              i }} | {{ '–' if d is none else (d | round(0) | int) }}{{ ' ⚠️' if
              d is not none and d >= lim }} |

              {% endfor %}
          - type: heading
            icon: mdi:information
            heading: Cycle which battery to charge first
            heading_style: subtitle
            tap_action:
