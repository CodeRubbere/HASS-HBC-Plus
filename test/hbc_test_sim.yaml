input_select:
  hbc_sim_pv_phase:
    name: "HBC sim: PV phase"
    options: ["L1", "L2", "L3", "3-phase"]
    icon: mdi:solar-panel
  hbc_sim_m1_phase:
    name: "HBC sim M1: physical phase"
    options: ["L1", "L2", "L3"]
    icon: mdi:sine-wave
  hbc_sim_m1_forcible:
    name: "HBC sim M1: forcible mode"
    options: ["stop", "charge", "discharge"]
  hbc_sim_m1_rs485:
    name: "HBC sim M1: RS485 control"
    options: ["disable", "enable"]  # a fresh Marstek starts with RS485 control off
  hbc_sim_m1_work_mode:
    name: "HBC sim M1: work mode"
    options: ["anti-feed", "manual", "ai"]
  hbc_sim_m2_phase:
    name: "HBC sim M2: physical phase"
    options: ["L1", "L2", "L3"]
    icon: mdi:sine-wave
  hbc_sim_m2_forcible:
    name: "HBC sim M2: forcible mode"
    options: ["stop", "charge", "discharge"]
  hbc_sim_m2_rs485:
    name: "HBC sim M2: RS485 control"
    options: ["disable", "enable"]  # a fresh Marstek starts with RS485 control off
  hbc_sim_m2_work_mode:
    name: "HBC sim M2: work mode"
    options: ["anti-feed", "manual", "ai"]
  hbc_sim_m3_phase:
    name: "HBC sim M3: physical phase"
    options: ["L1", "L2", "L3"]
    icon: mdi:sine-wave
  hbc_sim_m3_forcible:
    name: "HBC sim M3: forcible mode"
    options: ["stop", "charge", "discharge"]
  hbc_sim_m3_rs485:
    name: "HBC sim M3: RS485 control"
    options: ["disable", "enable"]  # a fresh Marstek starts with RS485 control off
  hbc_sim_m3_work_mode:
    name: "HBC sim M3: work mode"
    options: ["anti-feed", "manual", "ai"]

template:
  # P1 per phase: every 2 s, so the value changes like a real meter (a state that never changes would
  # let the HBC+ heartbeat go stale)
  - triggers:
      - trigger: time_pattern
        seconds: "/2"
    sensor:
      - name: "P1 meter power phase 1"
        unique_id: hbc_sim_p1_meter_power_phase_1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {%- set ph = 'L1' -%}
          {%- set load = states('input_number.hbc_sim_load_l1') | float(0) -%}
          {%- set pv = states('input_number.hbc_sim_pv') | float(0) -%}
          {%- set pvph = states('input_select.hbc_sim_pv_phase') -%}
          {%- set pv_here = pv / 3 if pvph == '3-phase' else (pv if pvph == ph else 0) -%}
          {%- set ns = namespace(b=0) -%}
          {%- for i in [1, 2, 3] if states('input_select.hbc_sim_m' ~ i ~ '_phase') == ph -%}
            {%- set ns.b = ns.b + states('sensor.marstek_m' ~ i ~ '_battery_power') | float(0) -%}
          {%- endfor -%}
          {%- set n = states('input_number.hbc_sim_noise') | int(0) -%}
          {{ (load - pv_here + ns.b + (range(-n, n + 1) | random)) | round(0) | int }}
      - name: "P1 meter power phase 2"
        unique_id: hbc_sim_p1_meter_power_phase_2
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {%- set ph = 'L2' -%}
          {%- set load = states('input_number.hbc_sim_load_l2') | float(0) -%}
          {%- set pv = states('input_number.hbc_sim_pv') | float(0) -%}
          {%- set pvph = states('input_select.hbc_sim_pv_phase') -%}
          {%- set pv_here = pv / 3 if pvph == '3-phase' else (pv if pvph == ph else 0) -%}
          {%- set ns = namespace(b=0) -%}
          {%- for i in [1, 2, 3] if states('input_select.hbc_sim_m' ~ i ~ '_phase') == ph -%}
            {%- set ns.b = ns.b + states('sensor.marstek_m' ~ i ~ '_battery_power') | float(0) -%}
          {%- endfor -%}
          {%- set n = states('input_number.hbc_sim_noise') | int(0) -%}
          {{ (load - pv_here + ns.b + (range(-n, n + 1) | random)) | round(0) | int }}
      - name: "P1 meter power phase 3"
        unique_id: hbc_sim_p1_meter_power_phase_3
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {%- set ph = 'L3' -%}
          {%- set load = states('input_number.hbc_sim_load_l3') | float(0) -%}
          {%- set pv = states('input_number.hbc_sim_pv') | float(0) -%}
          {%- set pvph = states('input_select.hbc_sim_pv_phase') -%}
          {%- set pv_here = pv / 3 if pvph == '3-phase' else (pv if pvph == ph else 0) -%}
          {%- set ns = namespace(b=0) -%}
          {%- for i in [1, 2, 3] if states('input_select.hbc_sim_m' ~ i ~ '_phase') == ph -%}
            {%- set ns.b = ns.b + states('sensor.marstek_m' ~ i ~ '_battery_power') | float(0) -%}
          {%- endfor -%}
          {%- set n = states('input_number.hbc_sim_noise') | int(0) -%}
          {{ (load - pv_here + ns.b + (range(-n, n + 1) | random)) | round(0) | int }}
  - sensor:
      - name: "P1 meter power"
        unique_id: hbc_sim_p1_meter_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {{ (states('sensor.p1_meter_power_phase_1') | float(0) + states('sensor.p1_meter_power_phase_2') | float(0)
              + states('sensor.p1_meter_power_phase_3') | float(0)) | round(0) | int }}
        availability: >-
          {{ has_value('sensor.p1_meter_power_phase_1') and has_value('sensor.p1_meter_power_phase_2')
             and has_value('sensor.p1_meter_power_phase_3') }}
      # ---- Marstek M1
      - name: "Marstek M1 battery power"
        unique_id: hbc_sim_m1_battery_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {%- set soc = states('input_number.hbc_sim_m1_soc') | float(0) -%}
          {%- set hi = states('input_number.marstek_m1_charging_cutoff_capacity') | float(100) -%}
          {%- set lo = states('input_number.marstek_m1_discharging_cutoff_capacity') | float(11) -%}
          {%- set mode = states('input_select.hbc_sim_m1_forcible') -%}
          {%- if not is_state('input_select.hbc_sim_m1_rs485', 'enable') or mode == 'stop' -%} 0
          {%- elif mode == 'charge' and soc < hi -%}
            {{ [states('input_number.hbc_sim_m1_forcible_charge') | float(0), states('input_number.hbc_sim_m1_max_charge') | float(0)] | min | round(0) | int }}
          {%- elif mode == 'discharge' and soc > lo -%}
            {{ -([states('input_number.hbc_sim_m1_forcible_discharge') | float(0), states('input_number.hbc_sim_m1_max_discharge') | float(0)] | min) | round(0) | int }}
          {%- else -%} 0
          {%- endif -%}
        availability: "{{ is_state('input_boolean.hbc_sim_m1_online', 'on') }}"
      - name: "Marstek M1 AC power"
        unique_id: hbc_sim_m1_ac_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.marstek_m1_battery_power') | float(0) | round(0) | int }}"  # same sign as battery power
        availability: "{{ is_state('input_boolean.hbc_sim_m1_online', 'on') }}"
      - name: "Marstek M1 battery state of charge"
        unique_id: hbc_sim_m1_battery_state_of_charge
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: "{{ states('input_number.hbc_sim_m1_soc') | float(0) | round(0) | int }}"
        availability: "{{ is_state('input_boolean.hbc_sim_m1_online', 'on') }}"
      - name: "Marstek M1 battery total energy"
        unique_id: hbc_sim_m1_battery_total_energy
        unit_of_measurement: "kWh"
        device_class: energy_storage
        state_class: measurement
        state: "5.12"
        availability: "{{ is_state('input_boolean.hbc_sim_m1_online', 'on') }}"
      - name: "Marstek M1 battery remaining capacity"
        unique_id: hbc_sim_m1_battery_remaining_capacity
        unit_of_measurement: "kWh"
        device_class: energy_storage
        state_class: measurement
        state: "{{ (states('input_number.hbc_sim_m1_soc') | float(0) * 5.12 / 100) | round(2) }}"
        availability: "{{ is_state('input_boolean.hbc_sim_m1_online', 'on') }}"
      - name: "Marstek M1 inverter state"
        unique_id: hbc_sim_m1_inverter_state
        state: >-
          {%- set p = states('sensor.marstek_m1_battery_power') | float(0) -%}
          {{ 'charge' if p > 0 else ('discharge' if p < 0 else 'standby') }}
        availability: "{{ is_state('input_boolean.hbc_sim_m1_online', 'on') }}"
      - name: "Marstek M1 device name"
        unique_id: hbc_sim_m1_device_name
        state: "Venus E (sim M1)"
        availability: "{{ is_state('input_boolean.hbc_sim_m1_online', 'on') }}"
      # ---- Marstek M2
      - name: "Marstek M2 battery power"
        unique_id: hbc_sim_m2_battery_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {%- set soc = states('input_number.hbc_sim_m2_soc') | float(0) -%}
          {%- set hi = states('input_number.marstek_m2_charging_cutoff_capacity') | float(100) -%}
          {%- set lo = states('input_number.marstek_m2_discharging_cutoff_capacity') | float(11) -%}
          {%- set mode = states('input_select.hbc_sim_m2_forcible') -%}
          {%- if not is_state('input_select.hbc_sim_m2_rs485', 'enable') or mode == 'stop' -%} 0
          {%- elif mode == 'charge' and soc < hi -%}
            {{ [states('input_number.hbc_sim_m2_forcible_charge') | float(0), states('input_number.hbc_sim_m2_max_charge') | float(0)] | min | round(0) | int }}
          {%- elif mode == 'discharge' and soc > lo -%}
            {{ -([states('input_number.hbc_sim_m2_forcible_discharge') | float(0), states('input_number.hbc_sim_m2_max_discharge') | float(0)] | min) | round(0) | int }}
          {%- else -%} 0
