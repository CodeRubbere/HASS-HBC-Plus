###########################################################################################################
# HBC+ test simulation: a P1 meter and 3 Marstek batteries (M1-M3) that do not exist        (TEST ONLY)
#
# ONLY for a separate TEST Home Assistant. Never put this file in the Home Assistant that controls your real
# batteries, and never next to a real P1 or Marstek integration: it creates the same entity IDs
# (sensor.p1_meter_power*, sensor/number/select.marstek_mN_*) and would hide or fight the real ones.
# This is NOT one of the HBC+ packages: it lives in test/, so "copy all files from packages/" never takes it.
#
# Install on the test HA: copy this file into packages/ next to the HBC+ packages, leave hbc_config.yaml
# as shipped (all commented out), Check configuration, restart. The first start sets the defaults below;
# script "HBC sim: reset" sets them again. Then set Number of batteries to 3.
#
# What it simulates
# - P1: per phase = house load - PV on that phase + the batteries physically on that phase (charging adds
#   import). Updated every 2 s with a little noise (like a real meter), so the HBC+ control loop keeps
#   ticking and its heartbeat stays fresh. sensor.p1_meter_power is the sum of the three phases.
# - Each battery follows the commands HBC+ writes: forcible charge or discharge at the forcible power,
#   capped by its max charge or discharge power, and stops at the HBC+ charge and discharge cutoffs.
#   With RS485 control off (the firmware in charge) it simply idles at 0 W: a real Marstek would run its
#   own work mode. The state of charge follows the power (5.12 kWh per battery); "Speed" makes it go faster.
# - "Physical phase" is where the battery is really connected. Make it differ from the HBC+ phase map
#   (input_select.marstek_mN_phase) to test the phase guard findings and the self-test (v1.4).
# - "Online" off makes every entity of that battery unavailable (a lost Modbus connection).
#
# Sliders: Settings -> Devices & services -> Helpers, search "HBC sim", or put them on a dashboard.
###########################################################################################################

