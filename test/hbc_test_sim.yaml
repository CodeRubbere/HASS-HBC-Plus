script:
  hbc_sim_reset:
    alias: "HBC sim: reset"
    icon: mdi:restore
    description: Sets every simulation slider back to its default and puts all simulated batteries online.
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_load_l1
        data:
          value: 300
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_load_l2
        data:
          value: 200
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_load_l3
        data:
          value: 250
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_pv
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_noise
        data:
          value: 15
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_speed
        data:
          value: 1
      - action: input_select.select_option
        target:
          entity_id: input_select.hbc_sim_pv_phase
        data:
          option: "L1"
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m1_soc
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m1_max_charge
        data:
          value: 2500
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m1_max_discharge
        data:
          value: 2500
      - action: input_select.select_option
        target:
          entity_id: input_select.hbc_sim_m1_phase
        data:
          option: "L1"
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m2_soc
        data:
          value: 60
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m2_max_charge
        data:
          value: 2500
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m2_max_discharge
        data:
          value: 2500
      - action: input_select.select_option
        target:
          entity_id: input_select.hbc_sim_m2_phase
        data:
          option: "L2"
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m3_soc
        data:
          value: 70
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m3_max_charge
        data:
          value: 2500
      - action: input_number.set_value
        target:
          entity_id: input_number.hbc_sim_m3_max_discharge
        data:
          value: 2500
      - action: input_select.select_option
        target:
          entity_id: input_select.hbc_sim_m3_phase
        data:
          option: "L3"
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.hbc_sim_m1_online
            - input_boolean.hbc_sim_m2_online
            - input_boolean.hbc_sim_m3_online
            - input_boolean.hbc_sim_initialized

automation:
  - id: hbc_sim_defaults_on_first_start
    alias: "HBC sim: defaults on the first start"
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hbc_sim_initialized
        state: "off"
    actions:
      - action: script.hbc_sim_reset

  - id: hbc_sim_state_of_charge
    alias: "HBC sim: state of charge follows the battery power"
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/10"
    actions:
      - repeat:
          for_each: [1, 2, 3]
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state('input_boolean.hbc_sim_m' ~ repeat.item ~ '_online', 'on') }}"
              then:
                - variables:
                    p: "{{ states('sensor.marstek_m' ~ repeat.item ~ '_battery_power') | float(0) }}"
                    soc: "{{ states('input_number.hbc_sim_m' ~ repeat.item ~ '_soc') | float(0) }}"
                    speed: "{{ states('input_number.hbc_sim_speed') | float(1) }}"
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.hbc_sim_m{{ repeat.item }}_soc"
                  data:
                    value: "{{ ([0, [100, soc + p * 10 / 3600 / 5120 * 100 * speed] | min] | max) | round(2) }}"
