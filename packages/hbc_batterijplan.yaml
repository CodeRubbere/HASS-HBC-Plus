# yaml-language-server: $schema=http://schemas.home-assistant.io/configuration
###########################################################################################################
# HBC+ v1.4 - Batterijplan indicator (F3)
#
# Batterijplan (github.com/satscan1/hbc-batterijplan) is a Home Assistant integration that can steer HBC+.
# With HBC+ on Dynamic and Batterijplan's Live switch on, Batterijplan sets the Dynamic mode of the coming
# quarter's price class every quarter (input_select.house_battery_strategy_dynamic_default / _cheapest /
# _expensive) and may replace HBC+'s solar forecast with a charge target. This package only shows that on
# the dashboard; it changes nothing in the control.
#
#   binary_sensor.hbc_managed_by_batterijplan   on while HBC+ is on Dynamic, switch.batterijplan_live is on
#                                               and sensor.batterijplan reports modus 'live'
#       attribute action_now       Batterijplan's action for this quarter: L charge from the grid, O discharge,
#                                  H hold, V feed in, Z solar only
#       attribute solar_override   true while Batterijplan replaces the solar forecast with a charge target
#
# Without Batterijplan installed the sensor stays off and the dashboard looks as before.
###########################################################################################################

template:
  # Version of this package file (HBC+ version check: 'HBC+ health' in Node-RED compares every
  # package with the flows; tools/set-version.py sets it on a release).
  - sensor:
      - name: "HBC version hbc_batterijplan"
        unique_id: hbc_version_hbc_batterijplan
        icon: mdi:tag-outline
        state: "1.4.0"

  - binary_sensor:
      - name: HBC managed by Batterijplan
        unique_id: hbc_managed_by_batterijplan
        icon: mdi:battery-sync
        state: >
          {{ is_state('input_select.house_battery_strategy', 'Dynamic')
             and is_state('switch.batterijplan_live', 'on')
             and state_attr('sensor.batterijplan', 'modus') == 'live' }}
        attributes:
          action_now: "{{ state_attr('sensor.batterijplan', 'actie') }}"
          solar_override: "{{ state_attr('sensor.batterijplan_zon_voor_hbc', 'modus') == 'laaddoel' }}"
