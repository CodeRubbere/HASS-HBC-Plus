# ---------------------------------------------------------------------------------------------------------
# Refresh HBC's price data when the data BEHIND the selected tariff source changes
# ---------------------------------------------------------------------------------------------------------
# The Dynamic flow caches the price list per tariff data source and otherwise only re-reads it on its
# 15-min tick or when an HBC setting changes. Its generic hook for "the source data changed, fetch again"
# is the HA event `hbc_refresh_energy_prices`; the flow itself knows nothing about any particular
# integration. Source-specific triggers belong here, in installation config.
#
# Grid Clock (the Grid Clock feed, HBC+ v1.2) needs no trigger here: Node-RED refreshes the prices itself
# when you change the zone, supplier or grid operator. The automation for the Grid Clock integration
# (what "Grid Clock" used up to v1.1) was removed.
