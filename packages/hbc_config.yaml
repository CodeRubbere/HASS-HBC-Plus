###########################################################################################################
# HBC+ - your installation-specific config                                                      (HBC+ v1.4)
#
# This is the one package that belongs to YOUR installation. Updates never replace it: when you copy the
# new packages, keep your own hbc_config.yaml (the update steps in the user guide say so).
# As shipped, everything below is commented out and Home Assistant loads it as an empty package.
#
# Grid power. HBC+ reads your P1 meter under fixed names, in W, import positive and export negative:
#   sensor.p1_meter_power            net grid power, all phases together
#   sensor.p1_meter_power_phase_1    net power on L1 (phase guard and self-test)
#   sensor.p1_meter_power_phase_2    net power on L2
#   sensor.p1_meter_power_phase_3    net power on L3
# Does your meter already provide these names (a HomeWizard P1, for example)? Then leave this file as it is.
# Otherwise uncomment ONE option below: remove the leading "# " from every line between BEGIN and END,
# "template:" included, and replace each sensor marked "<< YOUR". Then Developer tools -> YAML ->
# Check configuration, and reload Template entities. An alias only gets the name above when no other entity
# has that ID yet. A single-phase installation needs only the first alias of option A (phase guard Off).
###########################################################################################################

