# yaml-language-server: $schema=http://schemas.home-assistant.io/configuration
###########################################################################################################
# HBC+ heartbeat fallback - phase-aware                                          (HBC+ v1.0, 2026-11-14)
#
# Node-RED tab "HBC+ Home Battery Start" publishes the time to MQTT hbc/heartbeat (retained) at most once
# a minute, and only after a GOOD control cycle: the strategy returned without an error and at least one
# battery was written without an error (HBC+ 2026-11-15; before, every P1 update counted, even when the
# strategy or every write failed). When that heartbeat is older than 5 minutes while the master mode is
# "Full control", Home Assistant hands the batteries back to their own firmware (forcible stop, anti-feed,
# RS485 off), so they do not stay on their last setpoint while HBC is down or not working.
#
# Phase-aware (HBC+): with input_select.house_battery_phase_guard_mode = Enforce, only ONE battery per
# shared phase (L1/L2/L3) goes back to firmware: the one with the lowest M-number, the same rule as the
# Master Switch flow. Its partner stays under RS485 control with forcible 'stop', so two batteries in
# firmware anti-feed can never overload that phase's fuse. Partners are stopped first (break-before-make).
# Batteries on 'Own circuit', alone on their phase, and all batteries on Off / Monitor are handed back
# as before.
#
# Every battery gets forcible 'stop' BEFORE RS485 goes off (HBC+ 2026-11-15). If RS485 is ever switched on
# again while HBC is not running, the battery stays stopped instead of resuming HBC's last charge or
# discharge command. The Master Switch flow no longer switches RS485 back on while this heartbeat is stale;
# as soon as it is fresh again ('HBC heartbeat back'), it sets RS485 to 'enable' and HBC takes over again.
#
# HBC+ health (2026-11-15): the Start flow also publishes hbc/health (retained JSON) -> sensor.hbc_health:
# ok / warning / error, with the counts of the last 10 minutes and the last error. Warnings and errors from
# every HBC+ flow are counted and written to the Node-RED log, also when Insight mode is off. The automation
# hbc_health_alert below notifies when the status stays 'error' (3+ errors in 10 minutes) for 5 minutes.
#
# Replaces the earlier nodered_heartbeat.yaml (same sensor and automation ids). DELETE that file from your
# HA packages folder: with both files present HA sees duplicate ids and drops the fallback.
# Notifications go through script.hbc_notify (hbc_notify.yaml); set where they go on the Advanced settings view.
###########################################################################################################

mqtt:
  sensor:
    - name: "HBC last run"
      unique_id: hbc_last_run
      state_topic: hbc/heartbeat
      device_class: timestamp
      icon: mdi:heart-pulse
    - name: "HBC health"
      unique_id: hbc_health
      state_topic: hbc/health
      value_template: "{{ value_json.status | default('unknown') }}"
      json_attributes_topic: hbc/health
      icon: mdi:stethoscope

template:
  - binary_sensor:
      - name: "HBC heartbeat stale"
        unique_id: hbc_heartbeat_stale
        device_class: problem
        icon: mdi:heart-broken
        # re-evaluated every minute through now(); stale = HA RECEIVED no heartbeat for more than 5 minutes.
        # HBC+ 2026-11-15: judged by HA's own clock (last_reported = when HA last got the message), not by
        # the time inside the message. A message with a time in the future (spoofed, or a Node-RED clock that
        # runs ahead) used to keep this off forever; a clock that runs behind made it stale for nothing.
        # After an HA restart the retained heartbeat counts as just received; if no new one follows within
        # 5 minutes, this turns on (and the start trigger of the fallback re-checks after 5 minutes).
        # Also restrict who may publish on hbc/# in your MQTT broker: see the user guide, "Securing your setup".
        state: >
          {% set e = states.sensor.hbc_last_run %}
          {{ e is none or e.state in ['unknown', 'unavailable', '']
             or (now() - e.last_reported).total_seconds() > 300 }}

automation:
  - id: hbc_heartbeat_fallback
    alias: "HBC+: hand batteries back to firmware when the HBC heartbeat is stale (phase-aware)"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hbc_heartbeat_stale
        from: "off"
        to: "on"
        id: stale
      # after an HA restart the sensor may already be 'on' (no off -> on change); check again after 5 min
      - trigger: homeassistant
        event: start
        id: start
    conditions:
      - condition: state
        entity_id: input_select.marstek_master_battery_mode
        state: "Full control"
    actions:
      - if:
          - condition: trigger
            id: start
        then:
          - delay: "00:05:00"
      # (re)check: still stale and still under HBC control
      - condition: state
        entity_id: binary_sensor.hbc_heartbeat_stale
        state: "on"
      - condition: state
        entity_id: input_select.marstek_master_battery_mode
        state: "Full control"
      - variables:
          count: "{{ states('input_number.house_battery_count') | int(0) }}"
          enforce: "{{ is_state('input_select.house_battery_phase_guard_mode', 'Enforce') }}"
          # firmware = batteries handed back; hold = phase partners kept on RS485 + stop
          plan: >
            {% set ns = namespace(firmware=[], hold=[], seen=[]) %}
            {% for i in range(1, count + 1) %}
              {% set ph = states('input_select.marstek_m' ~ i ~ '_phase') %}
              {% if enforce and ph in ['L1', 'L2', 'L3'] and ph in ns.seen %}
                {% set ns.hold = ns.hold + ['marstek_m' ~ i] %}
              {% else %}
                {% set ns.firmware = ns.firmware + ['marstek_m' ~ i] %}
                {% if ph in ['L1', 'L2', 'L3'] %}{% set ns.seen = ns.seen + [ph] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ {'firmware': ns.firmware, 'hold': ns.hold} }}
      # 1. phase partners first: stay under RS485 control and stop (break-before-make)
      - if:
          - condition: template
            value_template: "{{ plan.hold | count > 0 }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ plan.hold | map('regex_replace', '^(.*)$', 'select.\\1_rs485_control_mode') | list }}"
            data:
              option: enable
            continue_on_error: true
          - action: select.select_option
            target:
              entity_id: "{{ plan.hold | map('regex_replace', '^(.*)$', 'select.\\1_forcible_charge_discharge') | list }}"
            data:
              option: stop
            continue_on_error: true
          - delay: "00:00:05"
      # 2. hand the others back to their firmware: forcible stop first (HBC+ 2026-11-15), then anti-feed,
      #    RS485 off. The stop is written while RS485 is still on, so the battery stops at once, and if RS485
      #    is ever switched on again without HBC running, it stays stopped instead of resuming HBC's last
      #    charge / discharge command.
      - if:
          - condition: template
            value_template: "{{ plan.firmware | count > 0 }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ plan.firmware | map('regex_replace', '^(.*)$', 'select.\\1_forcible_charge_discharge') | list }}"
            data:
              option: stop
            continue_on_error: true
          - action: select.select_option
            target:
              entity_id: "{{ plan.firmware | map('regex_replace', '^(.*)$', 'select.\\1_user_work_mode') | list }}"
            data:
              option: anti-feed
            continue_on_error: true
          - action: select.select_option
            target:
              entity_id: "{{ plan.firmware | map('regex_replace', '^(.*)$', 'select.\\1_rs485_control_mode') | list }}"
            data:
              option: disable
            continue_on_error: true
      - action: logbook.log
        data:
          name: HBC+ heartbeat fallback
          message: >-
            HBC heartbeat stale since {{ states('sensor.hbc_last_run') }}.
            Firmware anti-feed (forcible stop, RS485 off): {{ plan.firmware | join(', ') | upper or 'none' }}.
            Kept on RS485 + stop: {{ plan.hold | join(', ') | upper or 'none' }}.
      - action: script.hbc_notify
        continue_on_error: true
        data:
          title: "HBC stopped - batteries on firmware"
          message: >-
            No HBC heartbeat since {{ as_timestamp(states('sensor.hbc_last_run'), 0) | timestamp_custom('%d-%m %H:%M') }}.
            Anti-feed: {{ plan.firmware | join(', ') | upper or 'none' }}.
            Stopped (phase partner): {{ plan.hold | join(', ') | upper or 'none' }}.

  # HBC+ health alert (2026-11-15): HBC keeps logging errors (sensor.hbc_health = error: 3 or more errors in
  # the last 10 minutes) for 5 minutes. The details are in the Node-RED log. Dismissed when it is ok again.
  - id: hbc_health_alert
    alias: "HBC+: alert when the control loop keeps logging errors"
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.hbc_health
        to: "error"
        for: "00:05:00"
        id: error
      - trigger: state
        entity_id: sensor.hbc_health
        to: "ok"
        id: ok
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: error
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: hbc_health
                  title: "HBC+: errors in the control loop"
                  message: >-
                    HBC+ logged {{ state_attr('sensor.hbc_health', 'errors_10m') }} errors in the last 10 minutes.
                    Last error ({{ as_timestamp(state_attr('sensor.hbc_health', 'last_error_at'), 0) | timestamp_custom('%H:%M') }}):
                    {{ state_attr('sensor.hbc_health', 'last_error') }}
                    Details are in the Node-RED log.
              - action: script.hbc_notify
                continue_on_error: true
                data:
                  title: "HBC+: errors in the control loop"
                  message: >-
                    {{ state_attr('sensor.hbc_health', 'errors_10m') }} errors in 10 min. Last:
                    {{ state_attr('sensor.hbc_health', 'last_error') }}
          - conditions:
              - condition: trigger
                id: ok
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: hbc_health
