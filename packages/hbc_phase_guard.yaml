# yaml-language-server: $schema=http://schemas.home-assistant.io/configuration
###########################################################################################################
# HBC+ phase guard - helpers and sensors                                         (v0.1, 2026-11-14)
#
# Part of the HBC+ phase guard (see docs/user-guide.en.md, "Design background and decisions").
# Only creates entities; nothing in HBC reads them yet, so loading this changes no behaviour.
#   - settings: guard mode, sharing, grid fuse, battery circuit, margin, selection, swap delta, dwell
#   - battery -> phase map for M1..M6 (input_select.marstek_mN_phase)
#   - per phase: battery power, charge/discharge headroom (same formula as Node-RED):
#       room = min(grid fuse - margin -/+ house net, battery circuit - margin)
#   - binary_sensor.hbc_phase_limit_exceeded: grid power on a phase above the grid fuse for 10 s
#   - binary_sensor.hbc_phase_circuit_limit_exceeded: the batteries on a phase above the battery circuit for 10 s
#   - MQTT sensors for the Node-RED phase planner status (hbc/phase/L1..L3 + summary, retained JSON),
#     published by node-red/hbc-plus-phase-monitor.json (read-only tab)
#   - script.hbc_phase_guard_defaults: run once after the first restart to set the defaults
#   - automation hbc_phase_guard_settings_changed: notifies when one of the safety settings changes, and by whom
#   - automation hbc_phase_overload_full_stop: Full stop when a phase stays overloaded by the batteries
#     (helpers without 'initial:' start at their minimum / first option; they are restored after that)
#
# Signs (confirmed): sensor.marstek_mN_battery_power > 0 = charging; sensor.p1_meter_power_phase_N > 0 = import.
# Used by: dashboards/dashboard_hbc_plus.yaml (view 'Phases').
###########################################################################################################

input_select:
  house_battery_phase_guard_mode:
    name: Phase guard mode
    icon: mdi:shield-sync-outline
    options: ["Off", "Monitor", "Enforce"]
  house_battery_phase_sharing:
    name: Phase sharing
    icon: mdi:call-split
    options: ["One battery per phase", "Shared headroom"]
  house_battery_phase_selection:
    name: Active battery selection
    icon: mdi:sort-variant
    options: ["SoC balance", "Fixed order", "Rotate daily"]
  marstek_m1_phase:
    name: Marstek M1 phase
    icon: mdi:sine-wave
    options: ["L1", "L2", "L3", "Own circuit"]
  marstek_m2_phase:
    name: Marstek M2 phase
    icon: mdi:sine-wave
    options: ["L1", "L2", "L3", "Own circuit"]
  marstek_m3_phase:
    name: Marstek M3 phase
    icon: mdi:sine-wave
    options: ["L1", "L2", "L3", "Own circuit"]
  marstek_m4_phase:
    name: Marstek M4 phase
    icon: mdi:sine-wave
    options: ["L1", "L2", "L3", "Own circuit"]
  marstek_m5_phase:
    name: Marstek M5 phase
    icon: mdi:sine-wave
    options: ["L1", "L2", "L3", "Own circuit"]
  marstek_m6_phase:
    name: Marstek M6 phase
    icon: mdi:sine-wave
    options: ["L1", "L2", "L3", "Own circuit"]

input_number:
  # Main (grid) fuse per phase: house and batteries draw through it together.
  house_battery_phase_limit_w:
    name: Grid fuse per phase
    min: 1000
    max: 17250
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:fuse
  # Group (circuit breaker) the batteries of one phase share. Only the batteries are counted on it.
  # No separate battery group? Set it to the grid fuse value.
  house_battery_phase_circuit_limit_w:
    name: Battery circuit per phase
    min: 500
    max: 17250
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:home-lightning-bolt-outline
  # Margin kept free under BOTH limits (grid fuse and battery circuit) for meter error and load steps.
  house_battery_phase_margin_w:
    name: Phase limit margin
    min: 0
    max: 1000
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:arrow-collapse-vertical
  house_battery_phase_switch_soc_delta:
    name: Phase swap SoC delta
    min: 1
    max: 30
    step: 1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery-sync-outline
  house_battery_phase_min_dwell:
    name: Phase swap minimum dwell
    min: 1
    max: 120
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-sand

mqtt:
  sensor:
    - name: "HBC+ phase L1 active"
      unique_id: hbc_phase_l1_active
      state_topic: hbc/phase/L1
      value_template: "{{ value_json.active | default('none') }}"
      json_attributes_topic: hbc/phase/L1
      icon: mdi:battery-sync
    - name: "HBC+ phase L2 active"
      unique_id: hbc_phase_l2_active
      state_topic: hbc/phase/L2
      value_template: "{{ value_json.active | default('none') }}"
      json_attributes_topic: hbc/phase/L2
      icon: mdi:battery-sync
    - name: "HBC+ phase L3 active"
      unique_id: hbc_phase_l3_active
      state_topic: hbc/phase/L3
      value_template: "{{ value_json.active | default('none') }}"
      json_attributes_topic: hbc/phase/L3
      icon: mdi:battery-sync
    - name: "HBC+ phase findings"
      unique_id: hbc_phase_findings
      state_topic: hbc/phase/summary
      value_template: "{{ value_json.findings | default(0) }}"
      json_attributes_topic: hbc/phase/summary
      icon: mdi:shield-alert-outline

template:
  - sensor:
      - name: "HBC+ phase L1 battery power"
        unique_id: hbc_phase_l1_battery_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:home-battery-outline
        state: >
          {% set ns = namespace(p=0) %}
          {% for i in range(1, (states('input_number.house_battery_count') | int(0)) + 1) %}
            {% if states('input_select.marstek_m' ~ i ~ '_phase') == 'L1' %}
              {% set ns.p = ns.p + states('sensor.marstek_m' ~ i ~ '_battery_power') | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.p | round(0) }}
      # charge room = min(grid fuse - margin - house net, battery circuit - margin)
      # house net = P1 phase - batteries on the phase (import +); discharge room uses + house net
      - name: "HBC+ phase L1 charge headroom"
        unique_id: hbc_phase_l1_charge_headroom
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-up-outline
        availability: "{{ has_value('sensor.p1_meter_power_phase_1') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {% set mar = states('input_number.house_battery_phase_margin_w') | float(200) %}
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w') | float(lim) %}
          {% set house = states('sensor.p1_meter_power_phase_1') | float(0)
                         - states('sensor.hbc_phase_l1_battery_power') | float(0) %}
          {{ [[lim - mar - house, circ - mar] | min, 0] | max | round(0) }}
      - name: "HBC+ phase L1 discharge headroom"
        unique_id: hbc_phase_l1_discharge_headroom
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-down-outline
        availability: "{{ has_value('sensor.p1_meter_power_phase_1') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {% set mar = states('input_number.house_battery_phase_margin_w') | float(200) %}
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w') | float(lim) %}
          {% set house = states('sensor.p1_meter_power_phase_1') | float(0)
                         - states('sensor.hbc_phase_l1_battery_power') | float(0) %}
          {{ [[lim - mar + house, circ - mar] | min, 0] | max | round(0) }}
      - name: "HBC+ phase L2 battery power"
        unique_id: hbc_phase_l2_battery_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:home-battery-outline
        state: >
          {% set ns = namespace(p=0) %}
          {% for i in range(1, (states('input_number.house_battery_count') | int(0)) + 1) %}
            {% if states('input_select.marstek_m' ~ i ~ '_phase') == 'L2' %}
              {% set ns.p = ns.p + states('sensor.marstek_m' ~ i ~ '_battery_power') | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.p | round(0) }}
      # charge room = min(grid fuse - margin - house net, battery circuit - margin)
      # house net = P1 phase - batteries on the phase (import +); discharge room uses + house net
      - name: "HBC+ phase L2 charge headroom"
        unique_id: hbc_phase_l2_charge_headroom
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-up-outline
        availability: "{{ has_value('sensor.p1_meter_power_phase_2') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {% set mar = states('input_number.house_battery_phase_margin_w') | float(200) %}
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w') | float(lim) %}
          {% set house = states('sensor.p1_meter_power_phase_2') | float(0)
                         - states('sensor.hbc_phase_l2_battery_power') | float(0) %}
          {{ [[lim - mar - house, circ - mar] | min, 0] | max | round(0) }}
      - name: "HBC+ phase L2 discharge headroom"
        unique_id: hbc_phase_l2_discharge_headroom
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-down-outline
        availability: "{{ has_value('sensor.p1_meter_power_phase_2') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {% set mar = states('input_number.house_battery_phase_margin_w') | float(200) %}
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w') | float(lim) %}
          {% set house = states('sensor.p1_meter_power_phase_2') | float(0)
                         - states('sensor.hbc_phase_l2_battery_power') | float(0) %}
          {{ [[lim - mar + house, circ - mar] | min, 0] | max | round(0) }}
      - name: "HBC+ phase L3 battery power"
        unique_id: hbc_phase_l3_battery_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:home-battery-outline
        state: >
          {% set ns = namespace(p=0) %}
          {% for i in range(1, (states('input_number.house_battery_count') | int(0)) + 1) %}
            {% if states('input_select.marstek_m' ~ i ~ '_phase') == 'L3' %}
              {% set ns.p = ns.p + states('sensor.marstek_m' ~ i ~ '_battery_power') | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.p | round(0) }}
      # charge room = min(grid fuse - margin - house net, battery circuit - margin)
      # house net = P1 phase - batteries on the phase (import +); discharge room uses + house net
      - name: "HBC+ phase L3 charge headroom"
        unique_id: hbc_phase_l3_charge_headroom
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-up-outline
        availability: "{{ has_value('sensor.p1_meter_power_phase_3') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {% set mar = states('input_number.house_battery_phase_margin_w') | float(200) %}
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w') | float(lim) %}
          {% set house = states('sensor.p1_meter_power_phase_3') | float(0)
                         - states('sensor.hbc_phase_l3_battery_power') | float(0) %}
          {{ [[lim - mar - house, circ - mar] | min, 0] | max | round(0) }}
      - name: "HBC+ phase L3 discharge headroom"
        unique_id: hbc_phase_l3_discharge_headroom
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-down-outline
        availability: "{{ has_value('sensor.p1_meter_power_phase_3') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {% set mar = states('input_number.house_battery_phase_margin_w') | float(200) %}
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w') | float(lim) %}
          {% set house = states('sensor.p1_meter_power_phase_3') | float(0)
                         - states('sensor.hbc_phase_l3_battery_power') | float(0) %}
          {{ [[lim - mar + house, circ - mar] | min, 0] | max | round(0) }}
      # Plain sum of all batteries' max charge power, for comparison with what HBC reports to planners
      - name: "House battery installed max charge power"
        unique_id: house_battery_installed_max_charge_power
        unit_of_measurement: W
        device_class: power
        icon: mdi:battery-plus-variant
        state: >
          {% set ns = namespace(p=0) %}
          {% for i in range(1, (states('input_number.house_battery_count') | int(0)) + 1) %}
            {% set ns.p = ns.p + states('number.marstek_m' ~ i ~ '_max_charge_power') | float(0) %}
          {% endfor %}
          {{ ns.p | round(0) }}
      # Load per phase in % of the phase guard limits, for the gauges on the Phase guard view. A gauge
      # card cannot read its range from a helper; in % the bands follow the settings by themselves.
      # Grid load = P1 phase power / grid fuse (import +, export -).
      # Circuit load = batteries on the phase / battery circuit (charge +, discharge -).
      # No state_class and kept out of the recorder: they follow the P1 meter every second (see P5).
      - name: "HBC+ phase L1 grid load"
        unique_id: hbc_phase_l1_grid_load
        unit_of_measurement: "%"
        icon: mdi:fuse
        availability: "{{ has_value('sensor.p1_meter_power_phase_1') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {{ (states('sensor.p1_meter_power_phase_1') | float(0) / [lim, 1] | max * 100) | round(0) | int }}
        attributes:
          limit_w: "{{ states('input_number.house_battery_phase_limit_w') | float(3680) | round(0) | int }}"
          guard_w: >-
            {{ (states('input_number.house_battery_phase_limit_w') | float(3680)
                - states('input_number.house_battery_phase_margin_w') | float(200)) | round(0) | int }}
      - name: "HBC+ phase L1 circuit load"
        unique_id: hbc_phase_l1_circuit_load
        unit_of_measurement: "%"
        icon: mdi:home-lightning-bolt-outline
        state: >
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w')
                        | float(states('input_number.house_battery_phase_limit_w') | float(3680)) %}
          {{ (states('sensor.hbc_phase_l1_battery_power') | float(0) / [circ, 1] | max * 100) | round(0) | int }}
        attributes:
          limit_w: >-
            {{ states('input_number.house_battery_phase_circuit_limit_w')
               | float(states('input_number.house_battery_phase_limit_w') | float(3680)) | round(0) | int }}
      - name: "HBC+ phase L2 grid load"
        unique_id: hbc_phase_l2_grid_load
        unit_of_measurement: "%"
        icon: mdi:fuse
        availability: "{{ has_value('sensor.p1_meter_power_phase_2') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {{ (states('sensor.p1_meter_power_phase_2') | float(0) / [lim, 1] | max * 100) | round(0) | int }}
        attributes:
          limit_w: "{{ states('input_number.house_battery_phase_limit_w') | float(3680) | round(0) | int }}"
          guard_w: >-
            {{ (states('input_number.house_battery_phase_limit_w') | float(3680)
                - states('input_number.house_battery_phase_margin_w') | float(200)) | round(0) | int }}
      - name: "HBC+ phase L2 circuit load"
        unique_id: hbc_phase_l2_circuit_load
        unit_of_measurement: "%"
        icon: mdi:home-lightning-bolt-outline
        state: >
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w')
                        | float(states('input_number.house_battery_phase_limit_w') | float(3680)) %}
          {{ (states('sensor.hbc_phase_l2_battery_power') | float(0) / [circ, 1] | max * 100) | round(0) | int }}
        attributes:
          limit_w: >-
            {{ states('input_number.house_battery_phase_circuit_limit_w')
               | float(states('input_number.house_battery_phase_limit_w') | float(3680)) | round(0) | int }}
      - name: "HBC+ phase L3 grid load"
        unique_id: hbc_phase_l3_grid_load
        unit_of_measurement: "%"
        icon: mdi:fuse
        availability: "{{ has_value('sensor.p1_meter_power_phase_3') }}"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {{ (states('sensor.p1_meter_power_phase_3') | float(0) / [lim, 1] | max * 100) | round(0) | int }}
        attributes:
          limit_w: "{{ states('input_number.house_battery_phase_limit_w') | float(3680) | round(0) | int }}"
          guard_w: >-
            {{ (states('input_number.house_battery_phase_limit_w') | float(3680)
                - states('input_number.house_battery_phase_margin_w') | float(200)) | round(0) | int }}
      - name: "HBC+ phase L3 circuit load"
        unique_id: hbc_phase_l3_circuit_load
        unit_of_measurement: "%"
        icon: mdi:home-lightning-bolt-outline
        state: >
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w')
                        | float(states('input_number.house_battery_phase_limit_w') | float(3680)) %}
          {{ (states('sensor.hbc_phase_l3_battery_power') | float(0) / [circ, 1] | max * 100) | round(0) | int }}
        attributes:
          limit_w: >-
            {{ states('input_number.house_battery_phase_circuit_limit_w')
               | float(states('input_number.house_battery_phase_limit_w') | float(3680)) | round(0) | int }}

  - binary_sensor:
      - name: "HBC+ phase limit exceeded"
        unique_id: hbc_phase_limit_exceeded
        device_class: problem
        icon: mdi:fuse-alert
        delay_on: "00:00:10"
        state: >
          {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
          {{ [states('sensor.p1_meter_power_phase_1'),
              states('sensor.p1_meter_power_phase_2'),
              states('sensor.p1_meter_power_phase_3')]
             | map('float', 0) | map('abs') | max > lim }}
      - name: "HBC+ phase circuit limit exceeded"
        unique_id: hbc_phase_circuit_limit_exceeded
        device_class: problem
        icon: mdi:home-lightning-bolt
        delay_on: "00:00:10"
        state: >
          {% set circ = states('input_number.house_battery_phase_circuit_limit_w')
                        | float(states('input_number.house_battery_phase_limit_w') | float(3680)) %}
          {{ [states('sensor.hbc_phase_l1_battery_power'),
              states('sensor.hbc_phase_l2_battery_power'),
              states('sensor.hbc_phase_l3_battery_power')]
             | map('float', 0) | map('abs') | max > circ }}

script:
  hbc_phase_guard_defaults:
    alias: "HBC+ phase guard: apply defaults"
    icon: mdi:restore
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.house_battery_phase_guard_mode
        data:
          option: "Monitor"
      - action: input_select.select_option
        target:
          entity_id: input_select.house_battery_phase_sharing
        data:
          option: "One battery per phase"
      - action: input_select.select_option
        target:
          entity_id: input_select.house_battery_phase_selection
        data:
          option: "SoC balance"
      - action: input_number.set_value
        target:
          entity_id: input_number.house_battery_phase_limit_w
        data:
          value: 3680
      - action: input_number.set_value
        target:
          entity_id: input_number.house_battery_phase_circuit_limit_w
        data:
          value: 3680
      - action: input_number.set_value
        target:
          entity_id: input_number.house_battery_phase_margin_w
        data:
          value: 200
      - action: input_number.set_value
        target:
          entity_id: input_number.house_battery_phase_switch_soc_delta
        data:
          value: 5
      - action: input_number.set_value
        target:
          entity_id: input_number.house_battery_phase_min_dwell
        data:
          value: 15
      # default map: M1/M4 = L1, M2/M5 = L2, M3/M6 = L3
      - action: input_select.select_option
        target:
          entity_id: input_select.marstek_m1_phase
        data:
          option: "L1"
      - action: input_select.select_option
        target:
          entity_id: input_select.marstek_m2_phase
        data:
          option: "L2"
      - action: input_select.select_option
        target:
          entity_id: input_select.marstek_m3_phase
        data:
          option: "L3"
      - action: input_select.select_option
        target:
          entity_id: input_select.marstek_m4_phase
        data:
          option: "L1"
      - action: input_select.select_option
        target:
          entity_id: input_select.marstek_m5_phase
        data:
          option: "L2"
      - action: input_select.select_option
        target:
          entity_id: input_select.marstek_m6_phase
        data:
          option: "L3"

# Safety settings changed (HBC+ 2026-11-15). Home Assistant has no per-entity permissions: every user, also a
# non-admin, and every automation can change these helpers. This cannot block that, but it makes every change
# visible: a persistent notification and a phone notification (script.hbc_notify), naming who made the change. A burst of changes (for
# example the defaults script) gives one notification, 10 s after the last change.
# Notifications go through script.hbc_notify (hbc_notify.yaml); set where they go on the Settings view.
automation:
  - id: hbc_phase_guard_settings_changed
    alias: "HBC+: notify when a phase guard safety setting changes"
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_select.house_battery_phase_guard_mode
          - input_select.house_battery_phase_sharing
          - input_number.house_battery_phase_limit_w
          - input_number.house_battery_phase_circuit_limit_w
          - input_number.house_battery_phase_margin_w
          - input_select.marstek_m1_phase
          - input_select.marstek_m2_phase
          - input_select.marstek_m3_phase
          - input_select.marstek_m4_phase
          - input_select.marstek_m5_phase
          - input_select.marstek_m6_phase
        not_from: ["unknown", "unavailable"]
        not_to: ["unknown", "unavailable"]
    actions:
      - variables:
          what: "{{ trigger.to_state.name }}: {{ trigger.from_state.state }} → {{ trigger.to_state.state }}"
          uid: "{{ trigger.to_state.context.user_id or '' }}"
          who: >-
            {% set p = states.person | selectattr('attributes.user_id', 'eq', uid) | map(attribute='name') | list %}
            {{ p | first if p | count > 0 else ('user ' ~ uid if uid else 'an automation or script') }}
      # collect a burst of changes into one notification
      - delay: "00:00:10"
      - action: persistent_notification.create
        data:
          notification_id: hbc_phase_guard_settings
          title: "HBC+: phase guard setting changed"
          message: >-
            Last change: {{ what }} (by {{ who }}).
            Now: guard {{ states('input_select.house_battery_phase_guard_mode') }},
            {{ states('input_select.house_battery_phase_sharing') }},
            grid fuse {{ states('input_number.house_battery_phase_limit_w') | int(0) }} W,
            battery circuit {{ states('input_number.house_battery_phase_circuit_limit_w') | int(0) }} W,
            margin {{ states('input_number.house_battery_phase_margin_w') | int(0) }} W,
            phases {% for i in range(1, (states('input_number.house_battery_count') | int(0)) + 1) %}M{{ i }} {{ states('input_select.marstek_m' ~ i ~ '_phase') }}{{ ', ' if not loop.last }}{% endfor %}.
      - action: script.hbc_notify
        continue_on_error: true
        data:
          title: "HBC+: phase guard setting changed"
          message: >-
            {{ what }} (by {{ who }}). Guard {{ states('input_select.house_battery_phase_guard_mode') }},
            grid fuse {{ states('input_number.house_battery_phase_limit_w') | int(0) }} W,
            circuit {{ states('input_number.house_battery_phase_circuit_limit_w') | int(0) }} W.

  # Overload -> Full stop (HBC+ 2026-11-15). When a phase stays overloaded (the alarms below turn on after 10 s)
  # and the batteries on that phase are part of the cause, Home Assistant sets the strategy to Full stop. The
  # Strategy arbiter treats that as a manual choice, so HBC itself stops the batteries and HA does not fight
  # Node-RED. If HBC is not running (heartbeat stale), HA also stops the batteries on that phase directly
  # (RS485 enable + forcible stop). Restore your strategy by hand once the cause is clear.
  # "Part of the cause": batteries above the battery circuit, or the phase above the grid fuse while the
  # batteries push the same way (charging on import, discharging on export). A house load alone that
  # overloads the grid fuse while the batteries discharge is not stopped: they are helping.
  # Only with the guard on Monitor or Enforce, i.e. once the limits under Phase guard settings (Settings view) are set.
  - id: hbc_phase_overload_full_stop
    alias: "HBC+: Full stop when a phase stays overloaded by the batteries"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hbc_phase_limit_exceeded
          - binary_sensor.hbc_phase_circuit_limit_exceeded
        to: "on"
    conditions:
      - condition: state
        entity_id: input_select.marstek_master_battery_mode
        state: "Full control"
      - condition: state
        entity_id: input_select.house_battery_phase_guard_mode
        state: ["Monitor", "Enforce"]
      - condition: template
        value_template: "{{ bad_phases | count > 0 }}"
    variables:
      bad_phases: >-
        {% set lim = states('input_number.house_battery_phase_limit_w') | float(3680) %}
        {% set circ = states('input_number.house_battery_phase_circuit_limit_w') | float(lim) %}
        {% set ns = namespace(bad=[]) %}
        {% for n in [1, 2, 3] %}
          {% set p1 = states('sensor.p1_meter_power_phase_' ~ n) | float(0) %}
          {% set b = states('sensor.hbc_phase_l' ~ n ~ '_battery_power') | float(0) %}
          {% if b | abs > circ or (p1 > lim and b > 50) or (p1 < -lim and b < -50) %}
            {% set ns.bad = ns.bad + ['L' ~ n] %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}
    actions:
      - variables:
          before: "{{ states('input_select.house_battery_strategy') }}"
          on_phase: >-
            {% set ns = namespace(ids=[]) %}
            {% for i in range(1, (states('input_number.house_battery_count') | int(0)) + 1) %}
              {% if states('input_select.marstek_m' ~ i ~ '_phase') in bad_phases %}
                {% set ns.ids = ns.ids + ['marstek_m' ~ i] %}
              {% endif %}
            {% endfor %}
            {{ ns.ids }}
      - if:
          - condition: template
            value_template: "{{ before != 'Full stop' }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.house_battery_strategy
            data:
              option: "Full stop"
      # HBC not running: stop the batteries on that phase directly
      - if:
          - condition: state
            entity_id: binary_sensor.hbc_heartbeat_stale
            state: "on"
          - condition: template
            value_template: "{{ on_phase | count > 0 }}"
        then:
          - action: select.select_option
            target:
              entity_id: "{{ on_phase | map('regex_replace', '^(.*)$', 'select.\\1_rs485_control_mode') | list }}"
            data:
              option: enable
            continue_on_error: true
          - action: select.select_option
            target:
              entity_id: "{{ on_phase | map('regex_replace', '^(.*)$', 'select.\\1_forcible_charge_discharge') | list }}"
            data:
              option: stop
            continue_on_error: true
      - action: logbook.log
        data:
          name: HBC+ phase overload
          message: >-
            Phase {{ bad_phases | join(', ') }} overloaded for 10 s with the batteries part of the cause.
            Strategy {{ before }} -> Full stop.
      - action: persistent_notification.create
        data:
          notification_id: hbc_phase_overload
          title: "HBC+: phase overload - Full stop"
          message: >-
            Phase {{ bad_phases | join(', ') }} stayed above its limit for 10 s, with the batteries part of the
            cause. HBC+ switched from {{ before }} to Full stop. Check the Phase guard view, then choose your strategy again.
      - action: script.hbc_notify
        continue_on_error: true
        data:
          title: "HBC+: phase overload - Full stop"
          message: "Phase {{ bad_phases | join(', ') }} overloaded by the batteries; strategy {{ before }} -> Full stop."

# The planner status is display-only (current attributes on the Phase guard view); keep it out of the database.
# HBC+ 2026-11-15: the per-phase battery power and headroom sensors too. They follow the P1 phase sensors,
# so with a meter that reports every second they wrote up to ~500,000 rows a day, while the Phase guard view
# only shows their current value. Excluding them also drops their long-term statistics (nothing uses them).
recorder:
  exclude:
    entities:
      - sensor.hbc_phase_l1_active
      - sensor.hbc_phase_l2_active
      - sensor.hbc_phase_l3_active
      - sensor.hbc_phase_findings
      - sensor.hbc_phase_l1_battery_power
      - sensor.hbc_phase_l2_battery_power
      - sensor.hbc_phase_l3_battery_power
      - sensor.hbc_phase_l1_charge_headroom
      - sensor.hbc_phase_l2_charge_headroom
      - sensor.hbc_phase_l3_charge_headroom
      - sensor.hbc_phase_l1_discharge_headroom
      - sensor.hbc_phase_l2_discharge_headroom
      - sensor.hbc_phase_l3_discharge_headroom
      - sensor.hbc_phase_l1_grid_load
      - sensor.hbc_phase_l2_grid_load
      - sensor.hbc_phase_l3_grid_load
      - sensor.hbc_phase_l1_circuit_load
      - sensor.hbc_phase_l2_circuit_load
      - sensor.hbc_phase_l3_circuit_load
